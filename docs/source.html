<div class="intro">
  <h2>Two services, and the one bug a mutex cannot fix.</h2>
  <p>An authorization service that owns credentials and fronts a profile service as an API gateway. Clients only ever address the gateway; the profile service never sees a bearer token.</p>
  <p>The interesting code is not the routing. It is <b>lost update</b> prevention — two clients read version 4, both edit, and without a precondition the second silently erases the first while both receive <code>200</code> — and a login endpoint where an unknown username and a wrong password are indistinguishable in body <em>and</em> in elapsed time.</p>

  <h3>Start here</h3>
  <div class="start">
    <button type="button" data-path="crates/profile-service/src/store/mod.rs">
      <b>store/mod.rs</b><span>The concurrency argument, and why storage is a trait rather than a HashMap.</span>
    </button>
    <button type="button" data-path="crates/profile-service/src/store/sqlite.rs">
      <b>store/sqlite.rs</b><span>The same compare-and-swap as one SQL statement, decided by row count.</span>
    </button>
    <button type="button" data-path="crates/auth-service/src/users.rs">
      <b>users.rs</b><span>Credential checking that destroys the reason for rejection before it can leak.</span>
    </button>
    <button type="button" data-path="crates/auth-service/src/throttle.rs">
      <b>throttle.rs</b><span>Account lockout without turning lockout into the enumeration oracle.</span>
    </button>
    <button type="button" data-path="crates/profile-service/tests/repository_conformance.rs">
      <b>repository_conformance.rs</b><span>One suite, both backends. The evidence the guarantee is not tied to one data structure.</span>
    </button>
    <button type="button" data-path="crates/loadgen/src/main.rs">
      <b>loadgen</b><span>Real HTTP against both entry points, so the gateway hop can be priced by difference.</span>
    </button>
    <button type="button" data-path="README.md">
      <b>README.md</b><span>How to run it, the measurements, the prompt log, and both AI reflections.</span>
    </button>
  </div>

  <h3>Reading order</h3>
  <ul>
    <li><b>common/</b> — wire types both services compile against, so a field rename is a compile error rather than a runtime 422. <code>Version</code> is a newtype whose <code>Display</code> writes the ETag and whose <code>FromStr</code> parses one.</li>
    <li><b>auth-service/</b> — argon2id, HS256 with <code>kid</code> rotation and <code>jti</code> revocation, a login throttle, a semaphore bounding concurrent hashes, and the gateway proxy that strips client-supplied identity headers.</li>
    <li><b>profile-service/</b> — versioned records behind <code>ETag</code>/<code>If-Match</code>, an append-only audit trail, idempotency keys, and a constant-time internal-token check.</li>
  </ul>

  <h3>Verification</h3>
  <ul>
    <li><b>48 tests</b>, including a conformance suite run against both storage backends.</li>
    <li><b>Zero findings</b> under <code>clippy::pedantic</code>, <code>missing_docs</code>, and <code>forbid(unsafe_code)</code>.</li>
    <li><b>Mutation-checked.</b> Deleting the compare-and-swap predicate from either backend fails three tests in that backend, symmetrically. The torn-write test correctly survives — the mutation left the lock alone.</li>
  </ul>

r the shared copy.\npassword-hash = { version = \"0.5\", features = [\"getrandom\"] }\njsonwebtoken = \"9\"\n# Constant-time comparison for the shared internal token.\nsubtle = \"2\"\nasync-trait = \"0.1\"\n# No lock poisoning: a panic while holding a guard cannot brick one account\n# until the process restarts.\nparking_lot = \"0.12\"\n# Profile keys come from tokens this workspace signed, never from an attacker,\n# so SipHash's collision-DoS resistance buys nothing here.\nrustc-hash = \"2\"\n# Lock-free reads of the current projection: a reader loads an Arc without\n# taking any lock, so a hot profile stops serialising its readers.\narc-swap = \"1\"\n# `bundled` compiles SQLite from vendored C, so the build needs no system\n# library. Used with an in-memory database, per the brief.\nrusqlite = { version = \"0.37\", features = [\"bundled\"] }\nreqwest = { version = \"0.12\", default-features = false, features = [\"json\", \"rustls-tls\", \"http2\"] }\ncommon = { path = \"crates/common\" }\n"}, {"path": "README.md", "group": "workspace", "lang": "md", "lines": 554, "src": "# Knova coding exercise — auth + profile services\n\nTwo Rust microservices. The authorization service owns credentials and fronts\nthe profile service as an API gateway; clients never address the profile\nservice directly.\n\n```\n                    ┌──────────────────────────────────────┐\n  client ──────────►│  auth-service            :8080       │\n  (only ever        │  POST /login    argon2id + JWT       │\n   talks here)      │  POST /profile ─┐                    │\n                    │  GET  /profile ─┤ verify JWT,        │\n                    │  PUT  /profile ─┘ inject identity    │\n                    └───────────┬──────────────────────────┘\n                                │ x-internal-token (constant-time checked)\n                                │ x-user-id       (from the verified token)\n                    ┌───────────▼──────────────────────────┐\n                    │  profile-service         :8081       │\n                    │  never sees or validates a token     │\n                    │  in-memory store, versioned records  │\n                    └──────────────────────────────────────┘\n```\n\n## Running it\n\n```bash\ncargo run -p profile-service &   # :8081\ncargo run -p auth-service &      # :8080\n```\n\nSeeded account: `alice` / `correct-horse-battery-staple`.\n\n```bash\nTOKEN=$(curl -s -X POST localhost:8080/login \\\n  -H 'content-type: application/json' \\\n  -d '{\"username\":\"alice\",\"password\":\"correct-horse-battery-staple\"}' \\\n  | jq -r .access_token)\n\n# create -> 201, ETag: \"1\"\ncurl -i -X POST localhost:8080/profile -H \"authorization: Bearer $TOKEN\" \\\n  -H 'content-type: application/json' \\\n  -d '{\"address\":\"1 Main St\",\"phone_number\":\"555-0100\"}'\n\n# update -> 200, ETag: \"2\"\ncurl -i -X PUT localhost:8080/profile -H \"authorization: Bearer $TOKEN\" \\\n  -H 'content-type: application/json' -H 'if-match: \"1\"' \\\n  -d '{\"address\":\"2 Oak Ave\",\"phone_number\":\"555-0200\"}'\n\n# replay the stale version -> 412, with the current ETag so you can retry\ncurl -i -X PUT localhost:8080/profile -H \"authorization: Bearer $TOKEN\" \\\n  -H 'content-type: application/json' -H 'if-match: \"1\"' \\\n  -d '{\"address\":\"clobber\",\"phone_number\":\"000\"}'\n```\n\n### Tests\n\n```bash\ncargo test --workspace\ncargo clippy --workspace --all-targets   # pedantic, clean\n```\n\n### Benchmarks\n\nIn-process store and middleware measurements:\n\n```bash\ncargo test -p profile-service --release --test read_contention -- --ignored --nocapture\n```\n\nThe running system over real HTTP, with both services up:\n\n```bash\ncargo run --release -p loadgen -- direct  64 2000\ncargo run --release -p loadgen -- gateway 64 2000\n```\n\n### Configuration\n\nAll values have development defaults; nothing needs to be set to run locally.\n\n| Variable | Default | Used by |\n|---|---|---|\n| `AUTH_BIND_ADDR` | `127.0.0.1:8080` | auth |\n| `PROFILE_BIND_ADDR` | `127.0.0.1:8081` | profile |\n| `JWT_SECRET` | dev placeholder | auth |\n| `TOKEN_TTL_SECS` | `900` | auth |\n| `INTERNAL_TOKEN` | dev placeholder | both |\n| `PROFILE_BACKEND` | `memory` (or `sqlite`) | profile |\n| `JWT_ACTIVE_KID` | `k1` | auth |\n| `JWT_RETIRED_KEYS` | empty; `kid=secret;kid=secret` | auth |\n| `PROFILE_SERVICE_URL` | `http://127.0.0.1:8081` | auth |\n| `SEED_USERNAME` / `SEED_PASSWORD` | `alice` / `correct-horse-battery-staple` | auth |\n\n## Requirement 1 — concurrency correctness\n\nThree hazards get conflated under \"concurrency\". They need different answers.\n\n**Data races.** Ruled out by the compiler. Sharing across threads needs `Sync`,\nmutation needs exclusive access. No design effort spent; it is not the\ninteresting part and I would not claim credit for it.\n\n**Torn writes** — a reader seeing the new address beside the old phone number.\nAny lock around the whole record prevents this. The per-entry `Mutex` does.\n\n**Lost updates** — the one that matters, and the one **a mutex cannot fix**. Two\nclients `GET` version 4, both edit, both `PUT`. The second silently erases the\nfirst, and *both* get `200`. The window spans two round-trips with human\nthink-time in between, so holding a lock across it is not an option.\n\nThe answer is optimistic concurrency control. Each record carries a version; a\nwriter states the version it believes it is replacing; the store refuses the\nwrite if that belief is stale. Over HTTP that is `ETag` / `If-Match`, so it is\n[RFC 9110] semantics rather than a bespoke protocol.\n\n| Request | Response |\n|---|---|\n| `POST`, no profile yet | `201` + `ETag: \"1\"` |\n| `POST`, profile exists | `409` |\n| `GET` | `200` + `ETag: \"n\"`, or `404` |\n| `PUT`, no `If-Match` | `428 Precondition Required` |\n| `PUT`, stale `If-Match` | `412` + `ETag` of the version that won |\n| `PUT`, current `If-Match` | `200` + `ETag: \"n+1\"` |\n| `GET /profile/history` | `200` — every accepted revision, oldest first |\n| `POST` with `Idempotency-Key`, retried | the original response replayed, not `409` |\n| `POST /logout` | `204`; the token is dead before its `exp` |\n\nVersions are a `common::Version` newtype rather than a bare `u64`. Its `Display`\nwrites the entity tag (`\"3\"`, quotes included) and its `FromStr` parses one, so\nthe value stored and the value on the wire cannot drift; `*` is rejected there,\nin one place, rather than at each call site.\n\n`If-Match` is **mandatory**, not optional. An optional precondition is not a\nguarantee — it is a suggestion that the one client which forgets it gets to\nignore. `If-Match: *` is rejected for the same reason: it means \"any current\nversion\", which is exactly the unconditional overwrite this endpoint exists to\nprevent. `412` carries the current `ETag` so a client can retry without a\nseparate re-read.\n\n### Storage is a trait, with two real backends\n\nThe guarantee has to outlive the `HashMap`. A single-process store makes\n`If-Match: \"4\"` meaningful only to the instance that issued version 4; behind a\nload balancer with three replicas there are three divergent histories and the\nguarantee is void. So `ProfileRepository` states the contract independently of\nwhere the bytes live, and there are two implementations:\n\n- **`InMemoryProfiles`** (default) — per-key locks, described below.\n- **`SqliteProfiles`** — the same compare-and-swap as one SQL statement:\n\n  ```sql\n  UPDATE profiles SET address = ?, phone_number = ?, version = ?\n   WHERE user_id = ? AND version = ?\n  ```\n\n  The row count decides the outcome: one row means the caller's version was\n  current, zero means stale *or* missing, told apart by a read inside the same\n  `IMMEDIATE` transaction. Opened in memory, per the brief; pointing it at a\n  file or at Postgres changes this module and nothing above it.\n\nBoth pass the *same* suite (`tests/repository_conformance.rs`, 8 tests × 2\nbackends), which is the actual evidence that the concurrency guarantee is a\nproperty of the design rather than of one data structure. Deleting the\ncompare-and-swap predicate from either backend fails three tests in that\nbackend, symmetrically.\n\nAdding Postgres means one line in the test macro and one new module.\n\n### Audit trail\n\nA profile is a projection of its revisions, not a cell that gets overwritten.\nEvery accepted write appends a `Revision`; `GET /profile/history` returns them\noldest first. An address change is a fraud and KYC signal, so discarding the\nprior value destroys evidence. Rejected writes leave no trace, which the\nconformance suite asserts.\n\nIn SQLite this is an append-only `profile_revisions` table written in the same\ntransaction as the projection, so the two can never disagree.\n\n### Lock granularity\n\n```rust\n[ RwLock\u003cHashMap\u003cUserId, Arc\u003cRecord>>> ; 64 ]     Record { ArcSwap\u003cProfile>, Mutex\u003cVec\u003cRevision>> }\n  ^^^^^^                                             ^^^^^^^^^^^^^^^^ read with no lock at all\n  one shard's structure, four shards per core\n```\n\nOne lock over the whole map is correct, and it is also one cache line that every\ncore touches on every request — even a *read* lock has to write the reader count,\nso the line bounces between cores and throughput stops scaling with them.\nSharding the keyspace keeps unrelated profiles off each other's lines.\n\nReads then take **no lock at all**. The current projection lives in an `ArcSwap`,\nrebuilt only when a write is accepted, so a read is a single atomic load — no\nlock, no allocation, no readers blocking each other. Before this, the address,\nthe phone number and the id were each cloned to build every response.\n\nWriters still serialise on the revisions mutex, which is what keeps the\ncompare-and-swap atomic: the version is read and the new projection published\nunder one hold, so no two writers can both believe they won. A reader concurrent\nwith a write sees the old projection or the new one, never a mix.\n\nTwo conformance tests assert the sharing structurally rather than by timing —\n`reads_share_one_projection` (two reads return `Arc::ptr_eq` pointers, so nothing\nwas cloned) and `a_write_publishes_a_new_projection` (they differ after a write).\n\nThe shard guard is released before the entry is touched (`InMemoryProfiles::slot`).\nHolding both would collapse this straight back into a global lock wearing a\ndisguise, and it would look correct in review.\n\n`parking_lot` rather than `std::sync`: std locks poison on panic, and a poisoned\nentry lock would make one account permanently unreadable until the process\nrestarts — a customer locked out of their own record by an unrelated bug.\n`parking_lot` does not poison, which removes the failure mode instead of arguing\nthat the critical sections cannot panic.\n\n### What the measurements actually said\n\nTwo rounds of this, and the second one invalidated most of the first.\n\n#### Round one: the store and the framework\n\nMedians of five rounds on four cores, in-process, driving the router with\n`oneshot`. Reproduce with\n`cargo test -p profile-service --release --test read_contention -- --ignored --nocapture`.\n\nSharding the map was the real win there — one lock over the whole map is also\none cache line every core writes to, since even a read lock updates the reader\ncount:\n\n| shards | spread reads | vs. one lock |\n|---|---|---|\n| 1 | 8.87M ops/sec | — |\n| 16 | 11.76M | +33% |\n| **64** | **13.52M** | **+52%** |\n| 256 | 13.31M | +50% |\n\nIt flattens at 64 (four per core), so that is the default. Then:\n\n| | ns/op | share of an in-process request |\n|---|---|---|\n| store read | 59 | 1.5% |\n| JSON serialisation | 100 | 2.5% |\n| in-process `GET /profile` | 3,951 | 100% |\n\nEach `from_fn` layer costs ~900 ns of machinery — a boxed future and a state\nclone — whatever it does, so two layers cost more than the handler they guard.\nMerging the internal-token check with request-id adoption took 1,388 ns to\n949 ns.\n\n#### Round two: the actual system\n\nThen I measured the running services over real HTTP (`crates/loadgen`,\n64 connections), and the framework tuning stopped looking important:\n\n| | throughput | p50 | p99 |\n|---|---|---|---|\n| straight to profile-service | 64,158 req/sec | 898 µs | 2.68 ms |\n| **through the gateway** | **25,414 req/sec** | **2.42 ms** | 4.89 ms |\n\n**The gateway hop costs 60% of throughput and ~1.5 ms of p50** — roughly 29 µs\nof CPU per request. Everything merged in round one totalled 439 *nanoseconds*.\nThe hop is about 67× larger than every framework optimisation combined, and\n`auth-service` burns 139% CPU against `profile-service`'s 45% serving the same\nrequests.\n\nThe single biggest win came from that measurement, and it was a bug I had\nwritten: both services defaulted their `EnvFilter` to `\"info,tower_http=debug\"`,\nwhich emits **two formatted log lines per request**. A 160,000-request run wrote\n320,006 lines. Changing the default to `info` gained **+18% gateway throughput\nand −0.45 ms p50**, and stopped a production deployment from filling a disk with\nrequest metadata nobody asked to keep.\n\n#### What I measured and did not ship\n\n- **HTTP/2 on the internal hop.** The obvious move for service-to-service: one\n  multiplexed connection instead of 64. Measured **25% slower** — head-of-line\n  blocking and framing overhead, with no connection-setup cost to amortise\n  against a peer on the same host. Reverted. It wins over a WAN with TLS\n  handshakes, which this is not.\n- **A JWT verification cache.** Verification measures 2.8 µs, which is **0.148%\n  of the hop** — so a cache would buy nothing, and keying one by token would\n  have quietly broken revocation.\n- **Pre-parsed `HeaderName` lookups.** 664 ns against 626 ns, inside the noise.\n  Added a dependency to `common` and bought nothing measurable, so it came out.\n- **Removing `TraceLayer`.** Worth ~10% even with its events filtered out. Kept:\n  trading request observability for 10% is a bad deal, and naming the cost is\n  better than silently taking it.\n- **Removing `#[async_trait]`.** 35% on the store read path — 118 ns/op of boxed\n  future, which is the price of `Arc\u003cdyn ProfileRepository>` and therefore of\n  choosing the backend at deploy time. At 1.5% of an in-process request and far\n  less of a real one, obviously worth paying.\n- **Folding the auth check into an extractor.** Saves ~900 ns and converts\n  \"every route below this is protected\" into \"every route that remembered to\n  ask\". An optimisation that opens a hole is not an optimisation.\n\nThe honest summary: the store and the middleware were the wrong place to look,\nand I only found that out by measuring the system instead of the parts. What is\nleft is architectural — the hop itself. Removing it for reads means either\nletting clients address the profile service with a verified token (moving\nverification to both services and giving up the single trust boundary) or\ncaching projections at the gateway (which reintroduces the staleness the version\ncounter exists to prevent). Both are real designs with real costs, and neither\nis a tuning change.\n\n### `std::sync::Mutex`, not `tokio::sync::Mutex`\n\nBecause no critical section here contains an `.await`. Tokio's mutex exists for\nlocks held *across* await points; it is a queue plus a semaphore and is\nmeasurably slower. The rule: if the guard never crosses an await, use the std\none. See \"where AI got it wrong\" below.\n\n### What the tests actually prove\n\n`crates/profile-service/tests/concurrency.rs`:\n\n- `stale_update_is_rejected` — the two-client lost-update scenario, explicitly.\n- `concurrent_increments_never_lose_an_update` — 64 tasks on 8 threads, each\n  doing read-modify-write with retry-on-412. The final counter must equal 64.\n- `concurrent_writes_are_never_torn` — 64 writers submitting matched\n  `address-N`/`phone-N` pairs; the stored pair must never be mismatched.\n- `unconditional_update_is_refused`, `direct_access_without_the_internal_token_is_refused`.\n\nVerified by mutation: deleting the version check from `ProfileStore::update`\nmakes the first two fail. The torn-write test still passes, correctly — it\ncovers the mutex, which the mutation left intact.\n\n## Requirement 2 — security-relevant test\n\n`crates/auth-service/tests/login_security.rs`.\n\nMatching the status code and body is the easy half. The half that gets missed is\ntiming: a naive implementation returns immediately when the username lookup\nmisses but burns ~50–100 ms of Argon2 when it hits. That gap is measurable\nacross a network and turns login into a \"does this account exist\" oracle even\nwhen every response is byte-identical.\n\nThe fix is structural rather than a rule anyone has to remember:\n\n- `UserDirectory::authenticate` returns a two-variant enum, `Authenticated` or\n  `Rejected`. The reason for rejection never leaves the module, so no handler is\n  able to leak what it was never given.\n- On a lookup miss the supplied password is verified against a **decoy hash** —\n  a real Argon2 hash of a value no account holds. Identical work, always false.\n- `AppError::parts` is the single place that renders any error, so the guarantee\n  is auditable by reading one function.\n\nTests: `indistinguishable_responses` pins status, content type and exact body\nbytes; `no_early_return_for_unknown_user` asserts the miss path spends real\nArgon2 time, which is only possible if it hashed something. That second one is\ndeliberately a floor check rather than an A-vs-B timing comparison — comparing\ntwo measured durations is flaky under CI load, while \"Argon2 at m=19 MiB cannot\nfinish in under 5 ms\" is robust.\n\n## Requirement 3 — prompt log\n\nOnly the prompts that changed the design or caught something.\n\n1. **\"Read the exercise and tell me what's actually being graded, not what it\n   literally asks for.\"** Produced the framing that two toy services are ~45\n   minutes and the real weight sits in the concurrency question and the\n   enumeration test. Everything after was scoped by that.\n\n2. **\"This isn't elegant clean rust.\"** Rejecting the first draft. It had a 2:1\n   comment-to-code ratio, cloned a password hash per login, and branched on the\n   same fact in two places. The rewrite moved the credential decision into\n   `UserDirectory::authenticate` returning an enum — which is also what made the\n   security property structural instead of conventional.\n\n3. **\"Read the rust handbook and give me textbook clean rust.\"** Drove an audit\n   against the [Rust API Guidelines] checklist. Concrete results: the `UserId`\n   newtype, private fields with getters, `# Errors`/`# Panics` doc sections,\n   `[workspace.lints]` with `unsafe_code = \"forbid\"`, and the hand-written\n   `Debug` impls that stopped a credential leak (below).\n\n4. **\"Prove the tests catch the bug.\"** Asked for mutation testing rather than a\n   green checkmark. This caught a bad test — see below.\n\n5. **\"You can do better.\"** Called out that polishing step one while the two\n   graded requirements were unbuilt was stalling. Correct.\n\n## Requirement 4 — where AI got it wrong\n\nThree, in ascending order of how much they'd have cost.\n\n**`#[derive(Debug)]` on a struct holding secrets.** `Config` held `jwt_secret`\nand `seed_password`; `UserRecord` held an Argon2 hash. A derived `Debug` means\nthe first `tracing::debug!(?config)` anyone adds prints the signing key into the\nlog aggregator. Nothing warns about this — not the compiler, not clippy. Caught\nby working through C-DEBUG in the API guidelines and asking what `Debug` would\nactually print. Fixed with hand-written impls that render `\u003credacted>`, and\n`finish_non_exhaustive()` on `TokenService`.\n\n**`tokio::sync::Mutex` by reflex.** The default suggestion for a lock in async\nRust, and wrong here: no critical section crosses an `.await`, so the std mutex\nis correct and faster. Tokio's own documentation says so. The tell is that the\njustification offered is \"it's async code\" rather than anything about the\ncritical section.\n\n**A concurrency test that proved nothing — and this one was my own.** The first\nversion spawned 64 writers and asserted the final version equalled 65. It\npassed. Then I deleted the version check from the store to confirm the test\nwould catch it, and **it still passed**: under last-write-wins every `PUT`\nreturns `200`, so there are still 64 accepted writes and the version still lands\non 65. Counting writes cannot distinguish the two designs.\n\nRewritten so each writer's value depends on what it read — a shared counter, 64\nincrements, final value must be 64. That version fails on the mutant. The\nlesson: a concurrency test that never observes a *lost* value isn't testing for\nlost updates, and only mutation testing surfaces that.\n\n## Requirement 5 — agentic reflection\n\n**Delegate to an agent:** the mechanical breadth. Scaffolding, wiring the fourth\nendpoint that looks like the first three, exhaustive error-path tests, doc\ncomments, guideline audits, keeping the README honest against the code. Also\nadversarial review — \"what would make CI reject this\" is a question an agent\nanswers tirelessly and a human answers once.\n\n**Keep deterministic:** anything where being right matters more than being fast\nand the check is cheap. The lint wall (`forbid(unsafe_code)`, pedantic clippy,\n`missing_docs`) is deterministic policy an agent cannot argue with. Mutation\ntesting is deterministic. Version-bumping and lockfiles: deterministic.\n\n**Keep human:** the trust boundary. *Where* the internal token is checked, what\nthe gateway strips, whether `If-Match` is mandatory or optional — those are\njudgement calls whose failure mode is silent. An agent will happily make\n`If-Match` optional because it is friendlier, and nothing goes red.\n\n**The engineer's role when agents write most of the code:** specifying the\ninvariant and designing the falsification. In this exercise the code was the\ncheap part; the expensive parts were deciding that lost updates were the actual\nrequirement, and noticing that the test for it was vacuous. Both are the job of\nwhoever knows what \"correct\" means here. Reviewing generated code line by line\ndoes not scale; deciding what would prove it wrong does.\n\n**Getting context an agent lacks by default.** In ascending order of cost:\ncommit the context (an `ARCHITECTURE.md` and this README are agent-readable);\nencode it as executable checks so it is enforced rather than remembered\n(the lint wall and mutation tests are context that cannot be ignored); give the\nagent the tools to discover it (run the tests, fetch the API guidelines, curl\nthe running service — every non-obvious decision here came from something\nobserved, not recalled); and where the constraint is genuinely external —\n\"security review requires constant-time comparison on shared secrets\" — put it\nin the prompt, because the agent cannot derive it from the repository.\n\n## Assumptions\n\n- In-memory storage in both services, as permitted. Restarting loses everything.\n- One seeded account, as permitted. No registration endpoint.\n- Symmetric JWT (HS256) because a single service both signs and verifies. If the\n  profile service verified tokens itself, this would need to be asymmetric so\n  the signing key never left the issuer.\n- The internal token is a static shared secret. Adequate given the two services\n  are assumed to be on a trusted network; mTLS would be the real answer.\n- `PUT` is full replacement, not a merge. `PATCH` semantics would need a\n  separate endpoint.\n\n## Production readiness\n\nThe brief permits an in-memory store and a hard-coded user, so this is not a\nproduction system. These are the gaps that would matter if it were, separated\ninto what is fixed here and what is architectural.\n\n### Hardened in this repository\n\n| Defect | Consequence | Fix | Evidence |\n|---|---|---|---|\n| `reqwest::Client::new()` applies no timeout | An upstream that accepts connections and stops responding hangs every gateway request forever; the gateway dies of accumulated connections rather than anything wrong with itself | `connect_timeout` 2 s, `timeout` 5 s | against a socket that accepts and never replies: `502` at **5012 ms**, gateway still serving |\n| `/login` had no concurrency bound | Argon2id allocates 19 MiB per verification and tokio's blocking pool grows to 512 threads — one attacker with a loop reaches ~9.7 GiB resident and gets the process OOM-killed | `Semaphore` sized to core count, `try_acquire` and shed with `503` + `Retry-After` | 40 concurrent logins on a 4-core box: **4 × `200`, 36 × `503`**, service recovers |\n| Profile fields were unbounded free text | A client could pin megabytes per stored profile, and unvalidated phone numbers are unusable for downstream screening | `ProfileInput::validate` — length caps, E.164 digit count, character allowlist | `422` with the offending field named; 4 unit tests |\n| `axum::serve` without graceful shutdown | `SIGTERM` from an orchestrator kills in-flight requests mid-write on every rolling deploy | `with_graceful_shutdown`, `SIGTERM` and `SIGINT` | — |\n| No liveness endpoint | An orchestrator cannot tell a wedged process from a healthy one | `GET /health`, deliberately outside the internal-token layer | reachable on both services without credentials |\n\nHealth is outside the auth layer on purpose: a probe that can fail for\nauthorization reasons reports the wrong thing, and would take healthy pods out\nof service during a token rotation.\n\n### Also hardened\n\n| Defect | Consequence | Fix |\n|---|---|---|\n| State was per-process | `If-Match` meaningless across replicas; the guarantee is void behind a load balancer | `ProfileRepository` trait + SQLite backend where the version lives in shared storage |\n| No durability | An acknowledged write vanishes on restart | `SqliteProfiles::open` is the same store against a file; `in_memory` is the brief-compliant default |\n| No audit trail | An address change is a fraud and KYC signal, and the prior value was destroyed | append-only revisions, `GET /profile/history` |\n| `std::sync` lock poisoning | one panic bricks a single account until restart | `parking_lot`, which does not poison |\n| `Version::next` saturated | at saturation every stale version silently becomes valid again — a correctness failure, not a capacity one | `checked_next` returning `Option`; `StoreError::VersionExhausted` |\n\n### Closed in the hardening pass\n\n| Gap | Fix | Evidence |\n|---|---|---|\n| **Idempotency** — a timed-out `POST` retry got `409`, indistinguishable from \"someone else created this\" | `Idempotency-Key` with in-flight reservation, body fingerprinting, and replay of the recorded response | retry replays `201`; same key with a different body → `422`; no key → genuine `409` |\n| **Revocation** — a stolen token stayed valid for its full 15 minutes | `jti` per token, `POST /logout`, revocations retained only to natural expiry | `200` → logout `204` → `401` |\n| **Key rotation** — one secret, no way to change it without ending every session | `kid` in the header, one active signing key plus retired verification keys | tokens signed `kid=k2`; a token signed by retired `k1` still verifies |\n| **Credential stuffing** — the semaphore bounds memory, not guessing | per-account and per-address limits, `throttle.rs` | 6th and 7th failures return the *same* `401` at the *same* latency; other accounts unaffected |\n| **Correlation** — no way to follow one request across the hop | `x-request-id`, accepted or minted, forwarded upstream, echoed to the client | client id echoed verbatim; absent one minted; log-breaking ones replaced |\n\nTwo of these needed care beyond the obvious.\n\n**Account lockout is the classic way to reintroduce user enumeration.** Answer a\nthrottled account with `429` and an unknown one with `401`, and an attacker\nlearns which usernames are real by failing at them five times. Answer both with\n`401` but skip the Argon2 on the throttled path, and the answer comes back in\nfive milliseconds instead of five hundred — the same oracle, read off a\nstopwatch. So a throttled account gets the identical `401` *and* still pays for\na full verification, against a password nothing can match. Throttling here buys\ncredential-stuffing resistance, not CPU; resource exhaustion is the semaphore's\njob and the address limit's.\n\n**The decoy hash was lazily initialised, which was itself an oracle.** It lives\nbehind a `OnceLock`, so the first unknown-username login after a restart\ncomputed the decoy *and then* verified against it — two Argon2 passes where a\nknown username costs one. Measured at 0.94 s versus 0.47 s: for exactly one\nrequest per process, response time revealed whether the account existed. Found\nby looking at a single outlier in a throttle test that had nothing to do with\nit. `UserDirectory::with_seed_user` now warms it, and a unit test asserts\n`decoy_hash()` returns in under a millisecond after construction, which a cold\n`OnceLock` could not.\n\n### Still architectural\n\n1. **Throttle and idempotency state is per-process**, like the profile store was\n   before `ProfileRepository`. Five replicas means five separate failure\n   counters, so the effective limit is five times what it says, and an\n   idempotency key is only honoured by the replica that saw it first. Both want\n   the same remedy: shared storage behind a trait, Redis being the usual answer.\n\n2. **A single SQLite connection behind one mutex.** Correct for an in-memory\n   database, which belongs to one connection, but it serialises backend access.\n   A file or server backend takes a pool; that is a change to `store/sqlite.rs`\n   and nothing else.\n\n3. **No metrics.** Tracing spans now correlate, but there are no RED counters\n   and no alerting on the signals that matter — throttle trips, `412` rate,\n   shed requests.\n\n4. **`X-Forwarded-For` is deliberately ignored**, so behind a proxy every\n   request appears to come from the proxy and the address limit collapses into\n   a global one. Honouring it safely is a deployment decision that belongs with\n   the proxy config that makes it trustworthy.\n\n### Also worth doing\n\n- **Event-driven `PUT`**, the optional part of the brief. The version field is\n  already the right primitive: an event carrying `expected_version` is the same\n  compare-and-swap, and the store needs no change.\n- **`proptest`** over update interleavings rather than 64 tasks and a hope, and\n  **`loom`** for the store, which explores orderings exhaustively rather than\n  sampling them.\n- **Streaming the gateway body** instead of buffering it, once payloads are\n  large enough to matter.\n\n[RFC 9110]: https://www.rfc-editor.org/rfc/rfc9110#field.if-match\n[Rust API Guidelines]: https://rust-lang.github.io/api-guidelines/checklist.html\n"}, {"path": "crates/common/Cargo.toml", "group": "common", "lang": "toml", "lines": 17, "src": "[package]\nname = \"common\"\ndescription = \"Wire types shared by the authorization and profile services.\"\nversion.workspace = true\nedition.workspace = true\npublish.workspace = true\nlicense.workspace = true\nrepository.workspace = true\nauthors.workspace = true\n\n[dependencies]\nserde.workspace = true\nthiserror.workspace = true\nuuid.workspace = true\n\n[lints]\nworkspace = true\n"}, {"path": "crates/common/src/dto.rs", "group": "common", "lang": "rust", "lines": 217, "src": "//! Request and response bodies.\n//!\n//! Deliberately behaviourless: these describe the shape of the JSON on the\n//! wire and nothing else.\n\nuse std::borrow::Cow;\n\nuse serde::{Deserialize, Serialize};\n\nuse crate::{UserId, Version};\n\n/// Body of `POST /login`.\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct LoginRequest {\n    /// The account name being claimed.\n    pub username: String,\n    /// The password offered for that account.\n    pub password: String,\n}\n\n/// Successful response to `POST /login`.\n#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]\npub struct LoginResponse {\n    /// Signed bearer token to present on subsequent requests.\n    pub access_token: String,\n    /// Always `\"Bearer\"`; present so the response matches OAuth 2.0 habits.\n    ///\n    /// A [`Cow`] because it is invariably a literal on the way out, and only\n    /// ever owned when a client deserializes one.\n    pub token_type: Cow\u003c'static, str>,\n    /// Seconds remaining until [`Self::access_token`] expires.\n    pub expires_in: u64,\n}\n\n/// Why a profile payload was rejected.\n///\n/// Field-level, because a client cannot fix \"invalid input\" but can fix \"phone\n/// number has too few digits\". None of these distinctions are sensitive: the\n/// caller supplied the value being complained about.\n#[derive(Debug, Clone, Copy, PartialEq, Eq, thiserror::Error)]\npub enum InvalidProfile {\n    /// Address was empty or only whitespace.\n    #[error(\"address must not be empty\")]\n    EmptyAddress,\n    /// Address exceeded [`ProfileInput::MAX_ADDRESS_BYTES`].\n    #[error(\"address must be at most {} bytes\", ProfileInput::MAX_ADDRESS_BYTES)]\n    AddressTooLong,\n    /// Phone number was empty or only whitespace.\n    #[error(\"phone number must not be empty\")]\n    EmptyPhone,\n    /// Phone number exceeded [`ProfileInput::MAX_PHONE_BYTES`].\n    #[error(\"phone number must be at most {} bytes\", ProfileInput::MAX_PHONE_BYTES)]\n    PhoneTooLong,\n    /// Phone number contained something other than digits and `+-() `.\n    #[error(\"phone number may contain only digits and the characters + - ( ) and space\")]\n    PhoneCharacters,\n    /// Phone number had too few or too many digits to be dialable.\n    #[error(\n        \"phone number must contain between {} and {} digits\",\n        ProfileInput::MIN_PHONE_DIGITS,\n        ProfileInput::MAX_PHONE_DIGITS\n    )]\n    PhoneDigitCount,\n}\n\n/// Body of `POST /profile` and `PUT /profile`.\n///\n/// There is deliberately no user id field: the caller never states whose\n/// profile is being written. That comes from the verified token, which is why\n/// an authenticated user cannot overwrite someone else's profile.\n#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]\npub struct ProfileInput {\n    /// Postal address.\n    pub address: String,\n    /// Telephone number.\n    pub phone_number: String,\n}\n\nimpl ProfileInput {\n    /// Longest accepted address. Generous for a postal address, and bounded so\n    /// a client cannot pin megabytes of resident memory per stored profile.\n    pub const MAX_ADDRESS_BYTES: usize = 512;\n    /// Longest accepted phone number, in bytes.\n    pub const MAX_PHONE_BYTES: usize = 32;\n    /// Fewest digits in a dialable number (shortest national numbers).\n    pub const MIN_PHONE_DIGITS: usize = 7;\n    /// Most digits in a dialable number, per E.164.\n    pub const MAX_PHONE_DIGITS: usize = 15;\n\n    /// Checks the payload against the stored-field invariants.\n    ///\n    /// Lives here rather than in the profile service so the gateway could\n    /// reject a bad payload before spending an upstream round-trip on it, and\n    /// so both sides can never disagree about what is storable.\n    ///\n    /// # Errors\n    ///\n    /// Returns the first [`InvalidProfile`] the payload violates.\n    pub fn validate(&self) -> Result\u003c(), InvalidProfile> {\n        if self.address.len() > Self::MAX_ADDRESS_BYTES {\n            return Err(InvalidProfile::AddressTooLong);\n        }\n        if self.address.trim().is_empty() {\n            return Err(InvalidProfile::EmptyAddress);\n        }\n        if self.phone_number.len() > Self::MAX_PHONE_BYTES {\n            return Err(InvalidProfile::PhoneTooLong);\n        }\n\n        let phone = self.phone_number.trim();\n        if phone.is_empty() {\n            return Err(InvalidProfile::EmptyPhone);\n        }\n        if !phone\n            .chars()\n            .all(|c| c.is_ascii_digit() || matches!(c, '+' | '-' | '(' | ')' | ' '))\n        {\n            return Err(InvalidProfile::PhoneCharacters);\n        }\n\n        let digits = phone.chars().filter(char::is_ascii_digit).count();\n        if !(Self::MIN_PHONE_DIGITS..=Self::MAX_PHONE_DIGITS).contains(&digits) {\n            return Err(InvalidProfile::PhoneDigitCount);\n        }\n\n        Ok(())\n    }\n}\n\n/// A stored profile as returned to the client.\n#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]\npub struct Profile {\n    /// Owner of this profile.\n    pub user_id: UserId,\n    /// Free-form postal address.\n    pub address: String,\n    /// Free-form telephone number.\n    pub phone_number: String,\n    /// Revision counter, echoed as an `ETag` and required back in `If-Match`\n    /// on update. It is how a lost update is detected.\n    pub version: Version,\n}\n\n/// Uniform error envelope.\n///\n/// Every non-2xx response from either service has this shape. It matters most\n/// for login, where the body must be byte-identical whether the username was\n/// unknown or the password was wrong.\n#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]\npub struct ErrorResponse {\n    /// Stable machine-readable code, for example `invalid_credentials`.\n    pub error: Cow\u003c'static, str>,\n    /// Human-readable text, chosen so it reveals nothing the code does not.\n    pub message: Cow\u003c'static, str>,\n}\n\nimpl ErrorResponse {\n    /// Builds a response from the static strings every call site already has,\n    /// so rendering an error allocates nothing.\n    #[must_use]\n    pub const fn new(error: &'static str, message: &'static str) -> Self {\n        Self {\n            error: Cow::Borrowed(error),\n            message: Cow::Borrowed(message),\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    fn input(address: &str, phone: &str) -> ProfileInput {\n        ProfileInput {\n            address: address.to_owned(),\n            phone_number: phone.to_owned(),\n        }\n    }\n\n    #[test]\n    fn accepts_ordinary_values() {\n        assert_eq!(input(\"1 Main St\", \"+1 (555) 010-0123\").validate(), Ok(()));\n    }\n\n    #[test]\n    fn rejects_blank_fields() {\n        assert_eq!(\n            input(\"   \", \"5550100\").validate(),\n            Err(InvalidProfile::EmptyAddress)\n        );\n        assert_eq!(\n            input(\"1 Main St\", \"  \").validate(),\n            Err(InvalidProfile::EmptyPhone)\n        );\n    }\n\n    #[test]\n    fn rejects_oversized_fields() {\n        let long = \"x\".repeat(ProfileInput::MAX_ADDRESS_BYTES + 1);\n        assert_eq!(\n            input(&long, \"5550100\").validate(),\n            Err(InvalidProfile::AddressTooLong)\n        );\n    }\n\n    #[test]\n    fn rejects_undialable_numbers() {\n        assert_eq!(\n            input(\"1 Main St\", \"555-01\").validate(),\n            Err(InvalidProfile::PhoneDigitCount)\n        );\n        assert_eq!(\n            input(\"1 Main St\", \"555-0100 ext. 12\").validate(),\n            Err(InvalidProfile::PhoneCharacters)\n        );\n    }\n}\n"}, {"path": "crates/common/src/headers.rs", "group": "common", "lang": "rust", "lines": 22, "src": "//! Header names used on the internal gateway-to-profile-service hop.\n//!\n//! Constants rather than literals at each call site: a typo in a literal is a\n//! silent authorization bypass, a typo in a constant is a compile error.\n\n/// Shared secret proving a request originated from the gateway rather than\n/// from a client that discovered the profile service's port.\npub const INTERNAL_TOKEN: &str = \"x-internal-token\";\n\n/// The authenticated [`UserId`], established by the gateway from a verified\n/// token. The profile service treats it as ground truth only because it is read\n/// after [`INTERNAL_TOKEN`] has been checked.\n///\n/// [`UserId`]: crate::UserId\npub const USER_ID: &str = \"x-user-id\";\n\n/// Correlates the log lines both services emit for one client request.\n///\n/// Accepted from the caller when present so a trace can span the client too,\n/// and minted by the gateway otherwise. Two services is the point at which\n/// \"grep both logs for the timestamp\" stops working.\npub const REQUEST_ID: &str = \"x-request-id\";\n"}, {"path": "crates/common/src/lib.rs", "group": "common", "lang": "rust", "lines": 19, "src": "//! Types shared by [`auth-service`] and [`profile-service`].\n//!\n//! Both services compile against these definitions of the wire format, so\n//! renaming a field is a compile error in the gateway rather than a `422` at\n//! runtime. That is the only reason this crate exists; it holds no behaviour\n//! beyond the conversions and invariants of [`UserId`].\n//!\n//! [`auth-service`]: https://github.com/0xSoftBoi/knova\n//! [`profile-service`]: https://github.com/0xSoftBoi/knova\n\npub mod dto;\npub mod headers;\nmod user_id;\nmod version;\n\npub use user_id::UserId;\npub use version::{InvalidVersion, Version};\n\npub use dto::InvalidProfile;\n"}, {"path": "crates/common/src/user_id.rs", "group": "common", "lang": "rust", "lines": 64, "src": "use std::convert::Infallible;\nuse std::fmt;\nuse std::str::FromStr;\n\nuse serde::{Deserialize, Serialize};\n\n/// Opaque identifier for a user account.\n///\n/// A newtype rather than a bare [`String`] so an id cannot be silently\n/// interchanged with a username, an address, or any other string in scope. The\n/// distinction matters most on the internal hop, where the gateway writes an id\n/// into a header and the profile service reads it back out.\n///\n/// Serializes transparently, so the JSON representation is a plain string.\n#[derive(Debug, Clone, PartialEq, Eq, Hash, PartialOrd, Ord, Serialize, Deserialize)]\n#[serde(transparent)]\npub struct UserId(String);\n\nimpl UserId {\n    /// Generates a fresh random identifier.\n    #[must_use]\n    pub fn random() -> Self {\n        Self(uuid::Uuid::new_v4().to_string())\n    }\n\n    /// Borrows the identifier as a string slice.\n    #[must_use]\n    pub fn as_str(&self) -> &str {\n        &self.0\n    }\n}\n\nimpl fmt::Display for UserId {\n    fn fmt(&self, f: &mut fmt::Formatter\u003c'_>) -> fmt::Result {\n        f.write_str(&self.0)\n    }\n}\n\nimpl From\u003cString> for UserId {\n    fn from(value: String) -> Self {\n        Self(value)\n    }\n}\n\nimpl From\u003c&str> for UserId {\n    fn from(value: &str) -> Self {\n        Self(value.to_owned())\n    }\n}\n\nimpl AsRef\u003cstr> for UserId {\n    fn as_ref(&self) -> &str {\n        &self.0\n    }\n}\n\nimpl FromStr for UserId {\n    type Err = Infallible;\n\n    /// Never fails; any string is a syntactically valid identifier.\n    fn from_str(s: &str) -> Result\u003cSelf, Self::Err> {\n        Ok(Self::from(s))\n    }\n}\n"}, {"path": "crates/common/src/version.rs", "group": "common", "lang": "rust", "lines": 123, "src": "use std::fmt;\nuse std::str::FromStr;\n\nuse serde::{Deserialize, Serialize};\n\n/// A profile's revision counter, and the entity tag that carries it.\n///\n/// One type rather than a `u64` plus a formatting helper plus a parsing helper,\n/// so the stored version and the `ETag` on the wire cannot drift apart. The\n/// [`Display`] and [`FromStr`] impls are inverses by construction.\n///\n/// [`Display`]: fmt::Display\n#[derive(Debug, Clone, Copy, PartialEq, Eq, PartialOrd, Ord, Hash, Serialize, Deserialize)]\n#[serde(transparent)]\npub struct Version(u64);\n\nimpl Version {\n    /// The version a freshly created profile is stored at.\n    pub const INITIAL: Self = Self(1);\n\n    /// The counter as a plain integer, for storage backends that must persist\n    /// one. Not a leak of an implementation detail: the same number is\n    /// published to every client as an `ETag`.\n    #[must_use]\n    pub const fn get(self) -> u64 {\n        self.0\n    }\n\n    /// Rebuilds a version read back from storage.\n    #[must_use]\n    pub const fn from_counter(counter: u64) -> Self {\n        Self(counter)\n    }\n\n    /// The version this one becomes after an accepted write, or [`None`] if the\n    /// counter cannot advance.\n    ///\n    /// Fallible rather than saturating or wrapping. Overflow is unreachable —\n    /// at one write per nanosecond it is 584 years away — but at saturation\n    /// every stale version would silently become valid again, and at wrap the\n    /// sequence would repeat. Both turn a capacity limit into a correctness\n    /// failure, so the caller is made to handle it.\n    #[must_use]\n    pub const fn checked_next(self) -> Option\u003cSelf> {\n        match self.0.checked_add(1) {\n            Some(next) => Some(Self(next)),\n            None => None,\n        }\n    }\n}\n\n/// Renders as an HTTP entity tag, quotes included: `\"3\"`.\nimpl fmt::Display for Version {\n    fn fmt(&self, f: &mut fmt::Formatter\u003c'_>) -> fmt::Result {\n        write!(f, \"\\\"{}\\\"\", self.0)\n    }\n}\n\n/// An `If-Match` value that is not a version this service issued.\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub struct InvalidVersion;\n\nimpl fmt::Display for InvalidVersion {\n    fn fmt(&self, f: &mut fmt::Formatter\u003c'_>) -> fmt::Result {\n        f.write_str(\"expected an entity tag such as \\\"3\\\"\")\n    }\n}\n\nimpl std::error::Error for InvalidVersion {}\n\nimpl FromStr for Version {\n    type Err = InvalidVersion;\n\n    /// Accepts the quoted form an `ETag` round-trips as (`\"3\"`) and the bare\n    /// form typed by hand (`3`).\n    ///\n    /// `*` is rejected rather than treated as \"any version\": it means exactly\n    /// the unconditional overwrite the precondition exists to prevent.\n    fn from_str(s: &str) -> Result\u003cSelf, Self::Err> {\n        s.trim()\n            .trim_matches('\"')\n            .parse()\n            .map(Self)\n            .map_err(|_| InvalidVersion)\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    /// Convenience for tests, where overflow is not in question.\n    fn bump(version: Version, times: usize) -> Version {\n        (0..times).fold(version, |current, _| {\n            current\n                .checked_next()\n                .expect(\"test versions do not overflow\")\n        })\n    }\n\n    #[test]\n    fn display_and_parse_are_inverses() {\n        let version = bump(Version::INITIAL, 2);\n        assert_eq!(version.to_string(), r#\"\"3\"\"#);\n        assert_eq!(version.to_string().parse(), Ok(version));\n    }\n\n    #[test]\n    fn bare_digits_are_accepted() {\n        assert_eq!(\"3\".parse(), Ok(bump(Version::INITIAL, 2)));\n    }\n\n    #[test]\n    fn the_counter_refuses_to_wrap() {\n        let last: Version = u64::MAX.to_string().parse().expect(\"parses\");\n        assert_eq!(last.checked_next(), None);\n    }\n\n    #[test]\n    fn wildcard_is_rejected() {\n        assert_eq!(\"*\".parse::\u003cVersion>(), Err(InvalidVersion));\n    }\n}\n"}, {"path": "crates/auth-service/Cargo.toml", "group": "auth-service", "lang": "toml", "lines": 32, "src": "[package]\nname = \"auth-service\"\ndescription = \"Authorization service: issues bearer tokens and fronts the profile service as an API gateway.\"\nversion.workspace = true\nedition.workspace = true\npublish.workspace = true\nlicense.workspace = true\nrepository.workspace = true\nauthors.workspace = true\n\n[dependencies]\ncommon.workspace = true\naxum.workspace = true\ntokio.workspace = true\ntower-http.workspace = true\nserde.workspace = true\nserde_json.workspace = true\nthiserror.workspace = true\ntracing.workspace = true\ntracing-subscriber.workspace = true\nargon2.workspace = true\nparking_lot.workspace = true\nuuid.workspace = true\npassword-hash.workspace = true\njsonwebtoken.workspace = true\nreqwest.workspace = true\n\n[dev-dependencies]\ntower.workspace = true\n\n[lints]\nworkspace = true\n"}, {"path": "crates/auth-service/src/config.rs", "group": "auth-service", "lang": "rust", "lines": 120, "src": "//! Process configuration, read once at startup so a bad value fails the boot\n//! rather than the first request.\n\nuse std::fmt;\n\nuse crate::token::KeyMaterial;\nuse std::num::ParseIntError;\nuse std::time::Duration;\n\n/// Why [`Config::from_env`] could not produce a usable configuration.\n#[derive(Debug, thiserror::Error)]\npub enum ConfigError {\n    /// A duration variable was set to something that is not a number of seconds.\n    #[error(\"{key} must be a whole number of seconds\")]\n    InvalidDuration {\n        /// The offending environment variable.\n        key: &'static str,\n        /// The underlying parse failure.\n        #[source]\n        source: ParseIntError,\n    },\n}\n\n/// Values read from the environment at startup.\n#[derive(Clone)]\npub struct Config {\n    /// Address the HTTP listener binds to.\n    pub bind_addr: String,\n    /// Key currently used to sign tokens.\n    pub active_key: KeyMaterial,\n    /// Keys no longer used for signing but still accepted for verification,\n    /// so a rotation does not invalidate every live session.\n    pub retired_keys: Vec\u003cKeyMaterial>,\n    /// How long an issued token remains valid.\n    pub token_ttl: Duration,\n    /// Username of the hard-coded account the exercise permits.\n    pub seed_username: String,\n    /// Password of that account, in plain text; hashed during seeding.\n    pub seed_password: String,\n    /// Base URL of the profile service the gateway forwards to.\n    pub profile_service_url: String,\n    /// Shared secret presented on the internal hop.\n    pub internal_token: String,\n}\n\nimpl Config {\n    /// Reads configuration from the environment, falling back to development\n    /// defaults so `cargo run` works with no setup.\n    ///\n    /// # Errors\n    ///\n    /// Returns [`ConfigError::InvalidDuration`] if `TOKEN_TTL_SECS` is set to a\n    /// value that is not a whole number.\n    pub fn from_env() -> Result\u003cSelf, ConfigError> {\n        fn var(key: &str, default: &str) -> String {\n            std::env::var(key).unwrap_or_else(|_| default.to_owned())\n        }\n\n        const TTL_KEY: &str = \"TOKEN_TTL_SECS\";\n        let token_ttl = var(TTL_KEY, \"900\")\n            .parse()\n            .map(Duration::from_secs)\n            .map_err(|source| ConfigError::InvalidDuration {\n                key: TTL_KEY,\n                source,\n            })?;\n\n        Ok(Self {\n            bind_addr: var(\"AUTH_BIND_ADDR\", \"127.0.0.1:8080\"),\n            // Development default. A production deployment would source this\n            // from a secret manager and refuse to boot without it.\n            active_key: KeyMaterial::new(\n                &var(\"JWT_ACTIVE_KID\", \"k1\"),\n                &var(\"JWT_SECRET\", \"dev-only-insecure-jwt-secret-change-me\"),\n            ),\n            retired_keys: parse_retired(&var(\"JWT_RETIRED_KEYS\", \"\")),\n            token_ttl,\n            seed_username: var(\"SEED_USERNAME\", \"alice\"),\n            seed_password: var(\"SEED_PASSWORD\", \"correct-horse-battery-staple\"),\n            profile_service_url: var(\"PROFILE_SERVICE_URL\", \"http://127.0.0.1:8081\"),\n            internal_token: var(\"INTERNAL_TOKEN\", \"dev-only-internal-token-change-me\"),\n        })\n    }\n}\n\n/// Parses `kid=secret;kid=secret` into retired verification keys.\n///\n/// Malformed entries are skipped rather than failing the boot: a typo in a\n/// *retired* key must not take the service down, and the consequence is only\n/// that tokens signed by it stop verifying, which rotation was going to do\n/// anyway.\nfn parse_retired(raw: &str) -> Vec\u003cKeyMaterial> {\n    raw.split(';')\n        .filter_map(|entry| entry.split_once('='))\n        .map(|(kid, secret)| KeyMaterial::new(kid.trim(), secret))\n        .filter(|key| !key.kid.is_empty() && !key.secret.is_empty())\n        .collect()\n}\n\n/// Redacts the secret-bearing fields.\n///\n/// A derived implementation would print the signing key and the seed password\n/// the first time anything logged the configuration.\nimpl fmt::Debug for Config {\n    fn fmt(&self, f: &mut fmt::Formatter\u003c'_>) -> fmt::Result {\n        f.debug_struct(\"Config\")\n            .field(\"bind_addr\", &self.bind_addr)\n            .field(\"active_kid\", &self.active_key.kid)\n            .field(\n                \"retired_kids\",\n                &self.retired_keys.iter().map(|k| &k.kid).collect::\u003cVec\u003c_>>(),\n            )\n            .field(\"token_ttl\", &self.token_ttl)\n            .field(\"seed_username\", &self.seed_username)\n            .field(\"seed_password\", &\"\u003credacted>\")\n            .field(\"profile_service_url\", &self.profile_service_url)\n            .field(\"internal_token\", &\"\u003credacted>\")\n            .finish()\n    }\n}\n"}, {"path": "crates/auth-service/src/error.rs", "group": "auth-service", "lang": "rust", "lines": 116, "src": "//! The service-wide error type and its single HTTP mapping.\n\nuse axum::Json;\nuse axum::http::{StatusCode, header};\nuse axum::response::{IntoResponse, Response};\nuse common::dto::ErrorResponse;\n\n/// Anything a handler can fail with.\n#[derive(Debug, thiserror::Error)]\npub enum AppError {\n    /// The username was unknown, or the password was wrong. Deliberately one\n    /// variant: see [`Authentication`](crate::Authentication).\n    #[error(\"invalid credentials\")]\n    InvalidCredentials,\n\n    /// No usable `Authorization: Bearer` header was present.\n    #[error(\"missing bearer token\")]\n    MissingBearer,\n\n    /// A bearer token was present but did not validate.\n    #[error(\"invalid token\")]\n    InvalidToken,\n\n    /// Claims could not be serialized or signed.\n    #[error(\"token signing failed\")]\n    TokenSigning(#[source] jsonwebtoken::errors::Error),\n\n    /// A `spawn_blocking` task panicked or was cancelled.\n    #[error(\"blocking task failed\")]\n    BlockingTask(#[from] tokio::task::JoinError),\n\n    /// The profile service could not be reached, or its response was unreadable.\n    #[error(\"upstream request failed\")]\n    Upstream(#[source] Box\u003creqwest::Error>),\n\n    /// Every password-verification permit is in use.\n    #[error(\"password verification capacity exhausted\")]\n    Overloaded,\n\n    /// The calling address has failed too many logins recently.\n    ///\n    /// Safe to report honestly: it depends on the caller's address, not on\n    /// whether any account exists.\n    #[error(\"too many failed logins from this address\")]\n    AddressThrottled,\n}\n\nimpl AppError {\n    /// Maps the error to `(status, machine-readable code, client-safe message)`.\n    ///\n    /// The only place that decides how an error appears on the wire, which is\n    /// what makes the indistinguishability of the two credential failures\n    /// auditable by reading a single function.\n    fn parts(&self) -> (StatusCode, &'static str, &'static str) {\n        match self {\n            Self::InvalidCredentials => (\n                StatusCode::UNAUTHORIZED,\n                \"invalid_credentials\",\n                \"Invalid username or password.\",\n            ),\n            Self::MissingBearer | Self::InvalidToken => (\n                StatusCode::UNAUTHORIZED,\n                \"unauthorized\",\n                \"A valid bearer token is required.\",\n            ),\n            Self::AddressThrottled => (\n                StatusCode::TOO_MANY_REQUESTS,\n                \"too_many_requests\",\n                \"Too many failed attempts from this address. Retry later.\",\n            ),\n            Self::Overloaded => (\n                StatusCode::SERVICE_UNAVAILABLE,\n                \"overloaded\",\n                \"The service is at capacity. Retry shortly.\",\n            ),\n            Self::Upstream(_) => (\n                StatusCode::BAD_GATEWAY,\n                \"upstream_unavailable\",\n                \"The profile service is unavailable.\",\n            ),\n            Self::TokenSigning(_) | Self::BlockingTask(_) => (\n                StatusCode::INTERNAL_SERVER_ERROR,\n                \"internal_error\",\n                \"An unexpected error occurred.\",\n            ),\n        }\n    }\n}\n\nimpl IntoResponse for AppError {\n    fn into_response(self) -> Response {\n        let (status, error, message) = self.parts();\n\n        // Full detail to the log, sanitised detail to the client.\n        if status.is_server_error() {\n            tracing::error!(error = ?self, \"request failed\");\n        } else {\n            tracing::debug!(error = %self, \"request rejected\");\n        }\n\n        let body = Json(ErrorResponse::new(error, message));\n\n        // Retryable failures say when; the rest make the client guess.\n        let retry_after = match self {\n            Self::Overloaded => Some(\"1\"),\n            Self::AddressThrottled => Some(\"300\"),\n            _ => None,\n        };\n\n        if let Some(seconds) = retry_after {\n            return (status, [(header::RETRY_AFTER, seconds)], body).into_response();\n        }\n\n        (status, body).into_response()\n    }\n}\n"}, {"path": "crates/auth-service/src/extract.rs", "group": "auth-service", "lang": "rust", "lines": 75, "src": "//! Request extractors.\n\nuse std::net::{IpAddr, SocketAddr};\n\nuse axum::extract::{ConnectInfo, FromRequestParts};\nuse axum::http::header;\nuse axum::http::request::Parts;\n\nuse crate::AppState;\nuse crate::error::AppError;\nuse crate::token::Claims;\n\n/// A caller who presented a valid bearer token.\n///\n/// Implemented as an extractor rather than a helper function so that a handler\n/// which needs an authenticated user says so *in its signature*. A route that\n/// forgets to authenticate cannot compile against a `Claims` it never received.\n#[derive(Debug, Clone)]\npub struct Authenticated(pub Claims);\n\nimpl FromRequestParts\u003cAppState> for Authenticated {\n    type Rejection = AppError;\n\n    async fn from_request_parts(\n        parts: &mut Parts,\n        state: &AppState,\n    ) -> Result\u003cSelf, Self::Rejection> {\n        let value = parts\n            .headers\n            .get(header::AUTHORIZATION)\n            .and_then(|value| value.to_str().ok())\n            .ok_or(AppError::MissingBearer)?;\n\n        // RFC 9110 makes the auth scheme case-insensitive, so `bearer x` is as\n        // valid as `Bearer x`. Matching with `strip_prefix(\"Bearer \")` would\n        // reject conforming clients.\n        let (scheme, token) = value.split_once(' ').ok_or(AppError::MissingBearer)?;\n        if !scheme.eq_ignore_ascii_case(\"bearer\") {\n            return Err(AppError::MissingBearer);\n        }\n\n        Ok(Self(state.tokens.verify(token.trim())?))\n    }\n}\n\n/// The source address of the request, when one is known.\n///\n/// An infallible extractor rather than `ConnectInfo\u003cSocketAddr>` directly,\n/// because the address is genuinely optional: tests drive the router in-process\n/// with no connection behind it, and a handler that 500s in that case would\n/// make the throttle untestable.\n///\n/// Deliberately *not* read from `X-Forwarded-For`. Behind a trusted proxy that\n/// header is the real client and this one is the proxy, but trusting it\n/// unconditionally lets any caller pick their own rate-limit bucket by\n/// inventing a value. Honouring it is a deployment decision that belongs with\n/// the proxy configuration that makes it safe.\n#[derive(Debug, Clone, Copy)]\npub struct PeerAddress(pub Option\u003cIpAddr>);\n\nimpl\u003cS> FromRequestParts\u003cS> for PeerAddress\nwhere\n    S: Send + Sync,\n{\n    type Rejection = std::convert::Infallible;\n\n    async fn from_request_parts(parts: &mut Parts, _state: &S) -> Result\u003cSelf, Self::Rejection> {\n        Ok(Self(\n            parts\n                .extensions\n                .get::\u003cConnectInfo\u003cSocketAddr>>()\n                .map(|ConnectInfo(peer)| peer.ip()),\n        ))\n    }\n}\n"}, {"path": "crates/auth-service/src/lib.rs", "group": "auth-service", "lang": "rust", "lines": 208, "src": "//! Authorization service.\n//!\n//! Issues bearer tokens for seeded credentials and, once the gateway routes are\n//! wired, forwards authenticated requests to the profile service. Clients only\n//! ever address this process.\n//!\n//! The library target exists so integration tests can drive [`router`] directly\n//! with [`tower::ServiceExt::oneshot`] instead of binding a port:\n//!\n//! ```no_run\n//! use auth_service::{AppState, Config, TokenService, Upstream, UserDirectory};\n//! use std::sync::Arc;\n//!\n//! let config = Config::from_env()?;\n//! let state = AppState {\n//!     users: Arc::new(UserDirectory::with_seed_user(\n//!         &config.seed_username,\n//!         &config.seed_password,\n//!     )),\n//!     tokens: Arc::new(TokenService::new(\n//!         &config.active_key,\n//!         &config.retired_keys,\n//!         config.token_ttl,\n//!     )),\n//!     throttle: Arc::new(auth_service::LoginThrottle::default()),\n//!     upstream: Upstream::new(&config.profile_service_url, &config.internal_token),\n//!     hash_permits: Arc::new(tokio::sync::Semaphore::new(\n//!         auth_service::default_hash_permits(),\n//!     )),\n//! };\n//! let app = auth_service::router(state);\n//! # Ok::\u003c(), auth_service::ConfigError>(())\n//! ```\n\nmod password;\n\npub mod config;\npub mod error;\npub mod extract;\npub mod routes;\npub mod throttle;\npub mod token;\npub mod tracing_id;\npub mod users;\n\nuse std::sync::Arc;\nuse std::time::Duration;\n\nuse axum::Router;\nuse axum::routing::{get, post};\nuse tokio::sync::Semaphore;\nuse tower_http::trace::TraceLayer;\n\npub use config::{Config, ConfigError};\npub use error::AppError as Error;\npub use error::AppError;\npub use extract::{Authenticated, PeerAddress};\npub use throttle::{LoginThrottle, Verdict};\npub use token::{Claims, KeyMaterial, TokenService};\npub use users::{Authentication, UserDirectory, UserRecord};\n\n/// State shared by every handler.\n///\n/// axum clones this once per request, so both fields are [`Arc`]s: cloning is\n/// two refcount bumps rather than a copy of the user directory.\n#[derive(Debug, Clone)]\npub struct AppState {\n    /// The credential store.\n    pub users: Arc\u003cUserDirectory>,\n    /// Token issuer and verifier.\n    pub tokens: Arc\u003cTokenService>,\n    /// Everything needed to reach the profile service.\n    pub upstream: Upstream,\n    /// Counts recent login failures per account and per source address.\n    pub throttle: Arc\u003cLoginThrottle>,\n    /// Bounds how many password verifications run at once.\n    ///\n    /// Argon2id at the default parameters allocates 19 MiB per verification,\n    /// and tokio's blocking pool grows to 512 threads. An unbounded login\n    /// endpoint can therefore be driven to roughly 9.7 GiB of resident memory\n    /// by one attacker with a loop — an OOM kill, not merely slow responses.\n    /// Requests that cannot get a permit are shed with `503`, because queueing\n    /// them converts a memory problem into an unbounded-latency problem.\n    pub hash_permits: Arc\u003cSemaphore>,\n}\n\n/// Default ceiling on concurrent password verifications.\n///\n/// Argon2 is CPU-bound, so allowing more concurrent hashes than cores only\n/// thrashes; the floor keeps a single-core container usable.\n#[must_use]\npub fn default_hash_permits() -> usize {\n    std::thread::available_parallelism().map_or(2, std::num::NonZero::get)\n}\n\n/// The profile service, as seen from the gateway.\n///\n/// Grouped rather than three loose fields on [`AppState`] because they are only\n/// ever used together, by one handler.\n#[derive(Debug, Clone)]\npub struct Upstream {\n    /// Reused across calls so connections are pooled rather than renegotiated\n    /// per request. `reqwest::Client` is already an `Arc` internally, so\n    /// cloning it shares the pool.\n    pub http: reqwest::Client,\n    /// Base URL of the profile service.\n    pub base_url: Arc\u003cstr>,\n    /// Shared secret presented on the internal hop.\n    pub internal_token: Arc\u003cstr>,\n}\n\nimpl Upstream {\n    /// How long to wait for a TCP connection to the profile service.\n    pub const CONNECT_TIMEOUT: Duration = Duration::from_secs(2);\n    /// How long to wait for a complete upstream response.\n    ///\n    /// `reqwest` applies *no* timeout by default. Without this, an upstream\n    /// that accepts connections and then stops responding makes every gateway\n    /// request hang forever, and the gateway dies of accumulated connections\n    /// rather than of anything wrong with itself. Bounding it converts a\n    /// cascading failure into a `502`.\n    pub const REQUEST_TIMEOUT: Duration = Duration::from_secs(5);\n\n    /// Builds an upstream handle with a fresh connection pool.\n    ///\n    /// # Panics\n    ///\n    /// Panics if the TLS backend cannot be initialised, which can only happen\n    /// at startup and indicates a broken build rather than a runtime condition.\n    #[must_use]\n    pub fn new(base_url: &str, internal_token: &str) -> Self {\n        let http = reqwest::Client::builder()\n            .connect_timeout(Self::CONNECT_TIMEOUT)\n            .timeout(Self::REQUEST_TIMEOUT)\n            .pool_idle_timeout(Duration::from_secs(30))\n            // HTTP/1.1 with a connection pool, deliberately. HTTP/2 prior\n            // knowledge was measured here and was 25% *slower* — one multiplexed\n            // socket means head-of-line blocking and framing overhead, and with\n            // small payloads to a peer on the same host there is no connection\n            // setup cost for multiplexing to amortise. It wins over a WAN with\n            // TLS handshakes, which this is not.\n            .build()\n            .expect(\"TLS backend must initialise\");\n\n        Self {\n            http,\n            base_url: Arc::from(base_url),\n            internal_token: Arc::from(internal_token),\n        }\n    }\n}\n\n/// Builds the service's HTTP router.\npub fn router(state: AppState) -> Router {\n    Router::new()\n        .route(\"/login\", post(routes::login::login))\n        .route(\"/logout\", post(routes::login::logout))\n        // Registered per method rather than with `any`, so an unsupported verb\n        // is rejected here instead of making a round-trip to be refused there.\n        .route(\n            \"/profile\",\n            post(routes::gateway::proxy)\n                .get(routes::gateway::proxy)\n                .put(routes::gateway::proxy),\n        )\n        .route(\"/profile/history\", get(routes::gateway::proxy))\n        .route(\"/health\", get(routes::health::health))\n        .layer(TraceLayer::new_for_http())\n        // Outermost, so every request — including ones rejected by an\n        // extractor before any handler runs — is correlated.\n        .layer(axum::middleware::from_fn(tracing_id::propagate))\n        .with_state(state)\n}\n\n/// Resolves when the process is asked to stop.\n///\n/// Without this, `SIGTERM` from an orchestrator kills in-flight requests\n/// mid-write during every rolling deploy.\n///\n/// # Panics\n///\n/// Panics if the process cannot install a signal handler, which indicates the\n/// process lacks a capability it needs to run at all.\npub async fn shutdown_signal() {\n    let interrupt = async {\n        tokio::signal::ctrl_c()\n            .await\n            .expect(\"Ctrl+C handler must install\");\n    };\n\n    #[cfg(unix)]\n    let terminate = async {\n        tokio::signal::unix::signal(tokio::signal::unix::SignalKind::terminate())\n            .expect(\"SIGTERM handler must install\")\n            .recv()\n            .await;\n    };\n\n    #[cfg(not(unix))]\n    let terminate = std::future::pending::\u003c()>();\n\n    tokio::select! {\n        () = interrupt => {},\n        () = terminate => {},\n    }\n\n    tracing::info!(\"shutdown signal received, draining in-flight requests\");\n}\n"}, {"path": "crates/auth-service/src/main.rs", "group": "auth-service", "lang": "rust", "lines": 57, "src": "//! Binary entry point. All behaviour lives in the library target.\n\nuse std::error::Error;\nuse std::sync::Arc;\n\nuse auth_service::{AppState, Config, TokenService, Upstream, UserDirectory, default_hash_permits};\n\n#[tokio::main]\nasync fn main() -> Result\u003c(), Box\u003cdyn Error>> {\n    tracing_subscriber::fmt()\n        // `info`, not `info,tower_http=debug`. The debug default emitted two\n        // formatted lines per request — 320,000 lines across a 160,000-request\n        // run — and cost 25% of gateway throughput plus 0.6 ms of p50. It also\n        // fills a disk and puts request metadata in a log nobody meant to keep.\n        // Operators opt in with RUST_LOG when they are debugging.\n        .with_env_filter(\n            tracing_subscriber::EnvFilter::try_from_default_env().unwrap_or_else(|_| \"info\".into()),\n        )\n        .init();\n\n    let config = Config::from_env()?;\n\n    let state = AppState {\n        users: Arc::new(UserDirectory::with_seed_user(\n            &config.seed_username,\n            &config.seed_password,\n        )),\n        tokens: Arc::new(TokenService::new(\n            &config.active_key,\n            &config.retired_keys,\n            config.token_ttl,\n        )),\n        throttle: Arc::new(auth_service::LoginThrottle::default()),\n        upstream: Upstream::new(&config.profile_service_url, &config.internal_token),\n        hash_permits: Arc::new(tokio::sync::Semaphore::new(default_hash_permits())),\n    };\n\n    let listener = tokio::net::TcpListener::bind(&config.bind_addr).await?;\n\n    tracing::info!(\n        addr = config.bind_addr,\n        seed_user = config.seed_username,\n        active_kid = config.active_key.kid,\n        \"auth-service listening\"\n    );\n\n    // `into_make_service_with_connect_info` is what makes the peer address\n    // available to the throttle; without it `ConnectInfo` never extracts.\n    axum::serve(\n        listener,\n        auth_service::router(state).into_make_service_with_connect_info::\u003cstd::net::SocketAddr>(),\n    )\n    .with_graceful_shutdown(auth_service::shutdown_signal())\n    .await?;\n\n    Ok(())\n}\n"}, {"path": "crates/auth-service/src/password.rs", "group": "auth-service", "lang": "rust", "lines": 48, "src": "//! Argon2id hashing and the decoy hash that keeps login failures uniform.\n\nuse std::sync::OnceLock;\n\nuse argon2::Argon2;\nuse argon2::password_hash::{PasswordHash, PasswordHasher, PasswordVerifier, SaltString};\nuse password_hash::rand_core::OsRng;\n\n/// Default parameters (m = 19456 KiB, t = 2, p = 1) track the OWASP\n/// recommendation for interactive logins.\nfn argon2() -> &'static Argon2\u003c'static> {\n    static ARGON2: OnceLock\u003cArgon2\u003c'static>> = OnceLock::new();\n    ARGON2.get_or_init(Argon2::default)\n}\n\n/// Hashes `password` into a PHC string with a fresh random salt.\npub(crate) fn hash(password: &str) -> Result\u003cString, password_hash::Error> {\n    let salt = SaltString::generate(&mut OsRng);\n    Ok(argon2()\n        .hash_password(password.as_bytes(), &salt)?\n        .to_string())\n}\n\n/// A well-formed hash of a password no account holds.\n///\n/// Verifying against it costs exactly what verifying a real hash costs, which\n/// is what keeps an unknown username indistinguishable from a wrong password.\n/// Computed once on first use; it cannot be a `const` because the salt is\n/// random.\npub(crate) fn decoy_hash() -> &'static str {\n    static DECOY: OnceLock\u003cString> = OnceLock::new();\n    DECOY.get_or_init(|| hash(\"\\0unassigned\\0\").expect(\"hashing a literal cannot fail\"))\n}\n\n/// Checks `password` against the PHC string `phc`.\n///\n/// A malformed `phc` is a data-integrity fault rather than a client error, so\n/// it is logged and reported as a plain mismatch instead of being propagated\n/// where it could be probed.\npub(crate) fn verify(password: &str, phc: &str) -> bool {\n    let Ok(expected) = PasswordHash::new(phc) else {\n        tracing::error!(\"stored password hash is malformed\");\n        return false;\n    };\n    argon2()\n        .verify_password(password.as_bytes(), &expected)\n        .is_ok()\n}\n"}, {"path": "crates/auth-service/src/routes/gateway.rs", "group": "auth-service", "lang": "rust", "lines": 101, "src": "//! The API gateway hop.\n//!\n//! Every profile request enters here, is authenticated, and is replayed against\n//! the profile service with the caller's identity attached out-of-band.\n\nuse axum::body::Bytes;\nuse axum::extract::State;\nuse axum::http::{HeaderMap, HeaderName, Method, StatusCode, Uri, header};\nuse axum::response::{IntoResponse, Response};\nuse common::headers;\n\nuse crate::AppState;\nuse crate::error::AppError;\nuse crate::extract::Authenticated;\n\n/// Headers copied from the client request to the upstream request.\n///\n/// An allowlist, not a denylist. Everything else is dropped, which is what\n/// stops a client from supplying its own `x-user-id` or `x-internal-token` and\n/// impersonating either the gateway or another user — the spoofed values are\n/// never copied, and the genuine ones are set afterwards.\nconst FORWARDED_TO_UPSTREAM: [&str; 3] = [\n    \"content-type\",\n    \"if-match\",\n    // Client-chosen key that makes a retried create safe.\n    \"idempotency-key\",\n];\n\n/// Headers copied from the upstream response back to the client.\nconst FORWARDED_TO_CLIENT: [HeaderName; 2] = [header::CONTENT_TYPE, header::ETAG];\n\n/// Authenticates the caller and forwards the request to the profile service.\n///\n/// The upstream never validates a token. It is told *who* the caller is by a\n/// header, and believes it only because the request also carries the shared\n/// internal secret. That keeps token verification in exactly one service.\n///\n/// # Errors\n///\n/// Returns [`AppError::MissingBearer`] or [`AppError::InvalidToken`] if the\n/// caller is not authenticated, and [`AppError::Upstream`] if the profile\n/// service cannot be reached.\npub async fn proxy(\n    State(state): State\u003cAppState>,\n    Authenticated(claims): Authenticated,\n    method: Method,\n    uri: Uri,\n    client_headers: HeaderMap,\n    body: Bytes,\n) -> Result\u003cResponse, AppError> {\n    let url = format!(\"{}{}\", state.upstream.base_url, uri.path());\n\n    let mut upstream = state\n        .upstream\n        .http\n        .request(method, &url)\n        .header(\n            headers::INTERNAL_TOKEN,\n            state.upstream.internal_token.as_ref(),\n        )\n        .header(headers::USER_ID, claims.sub.as_str());\n\n    for name in FORWARDED_TO_UPSTREAM {\n        if let Some(value) = client_headers.get(name) {\n            upstream = upstream.header(name, value);\n        }\n    }\n\n    // Correlation crosses the hop, so one id spans both services' logs. Set\n    // after the allowlist because this value is the gateway's, not the\n    // client's — `tracing_id::propagate` has already normalised it.\n    if let Some(value) = client_headers.get(headers::REQUEST_ID) {\n        upstream = upstream.header(headers::REQUEST_ID, value);\n    }\n\n    let response = upstream\n        .body(body)\n        .send()\n        .await\n        .map_err(|source| AppError::Upstream(Box::new(source)))?;\n\n    let status = response.status();\n    let mut builder = Response::builder().status(status);\n\n    for name in FORWARDED_TO_CLIENT {\n        if let Some(value) = response.headers().get(&name) {\n            builder = builder.header(name, value);\n        }\n    }\n\n    let payload = response\n        .bytes()\n        .await\n        .map_err(|source| AppError::Upstream(Box::new(source)))?;\n\n    // `body` only fails if a header copied above was
