 malformed, which cannot\n    // happen: every value came from a already-parsed `HeaderMap`.\n    Ok(builder\n        .body(payload.into())\n        .unwrap_or_else(|_| StatusCode::INTERNAL_SERVER_ERROR.into_response()))\n}\n"}, {"path": "crates/auth-service/src/routes/health.rs", "group": "auth-service", "lang": "rust", "lines": 11, "src": "//! Liveness probe.\n\nuse axum::Json;\nuse serde_json::{Value, json};\n\n/// `GET /health` — unauthenticated on purpose: an orchestrator probing\n/// liveness holds no credentials, and a probe that can fail for auth reasons\n/// reports the wrong thing.\npub async fn health() -> Json\u003cValue> {\n    Json(json!({ \"status\": \"ok\" }))\n}\n"}, {"path": "crates/auth-service/src/routes/login.rs", "group": "auth-service", "lang": "rust", "lines": 106, "src": "//! The `POST /login` and `POST /logout` handlers.\n\nuse std::sync::Arc;\n\nuse axum::Json;\nuse axum::extract::State;\nuse axum::http::StatusCode;\nuse common::dto::{LoginRequest, LoginResponse};\n\nuse crate::AppState;\nuse crate::error::AppError;\nuse crate::extract::{Authenticated, PeerAddress};\nuse crate::throttle::Verdict;\nuse crate::users::Authentication;\n\n/// Password used to force a rejection that costs exactly what a real one costs.\n///\n/// A throttled account must not answer faster than an unthrottled one, or the\n/// throttle becomes the user-enumeration oracle the login path is built to\n/// avoid. Verifying this instead of the caller's password does the same Argon2\n/// work and cannot succeed: no account holds it, because it is not a legal\n/// password to register.\nconst UNMATCHABLE: &str = \"\\0throttled\\0\";\n\n/// Exchanges a username and password for a bearer token.\n///\n/// # Errors\n///\n/// Returns [`AppError::InvalidCredentials`] if the account does not exist, the\n/// password is wrong, *or* the account is throttled — all three are one\n/// response. [`AppError::AddressThrottled`] if the caller's address has failed\n/// too often, [`AppError::Overloaded`] if verification capacity is exhausted,\n/// and [`AppError::BlockingTask`] or [`AppError::TokenSigning`] on faults.\npub async fn login(\n    State(state): State\u003cAppState>,\n    PeerAddress(address): PeerAddress,\n    Json(LoginRequest { username, password }): Json\u003cLoginRequest>,\n) -> Result\u003cJson\u003cLoginResponse>, AppError> {\n    // Shed rather than queue. Waiting for a permit would trade a bounded memory\n    // problem for an unbounded latency one, and a caller who is going to be\n    // told \"try again\" is better told immediately. Acquired before the lookup,\n    // so saturation is refused identically for every username.\n    let permit = Arc::clone(&state.hash_permits)\n        .try_acquire_owned()\n        .map_err(|_| AppError::Overloaded)?;\n\n    let verdict = state.throttle.check(&username, address);\n    if verdict == Verdict::AddressThrottled {\n        return Err(AppError::AddressThrottled);\n    }\n\n    // A throttled account still pays for a full verification, against a\n    // password nothing can match. Same work, same elapsed time, same `401`.\n    let offered = if verdict == Verdict::AccountThrottled {\n        UNMATCHABLE.to_owned()\n    } else {\n        password\n    };\n\n    let users = Arc::clone(&state.users);\n    let subject = username.clone();\n\n    // Argon2 is deliberately expensive and CPU-bound. Running it on a runtime\n    // worker would stall every other connection that worker is driving.\n    let outcome = tokio::task::spawn_blocking(move || {\n        let outcome = users.authenticate(&subject, &offered);\n        drop(permit);\n        outcome\n    })\n    .await?;\n\n    let Authentication::Authenticated(user) = outcome else {\n        state.throttle.record_failure(&username, address);\n        return Err(AppError::InvalidCredentials);\n    };\n\n    state.throttle.record_success(&username);\n    tracing::info!(username = user.username(), \"login succeeded\");\n\n    Ok(Json(LoginResponse {\n        access_token: state.tokens.issue(user.id(), user.username())?,\n        token_type: std::borrow::Cow::Borrowed(\"Bearer\"),\n        expires_in: state.tokens.ttl_secs(),\n    }))\n}\n\n/// Revokes the presented token immediately.\n///\n/// Expiry alone leaves a stolen token usable for its full lifetime. Idempotent:\n/// revoking an already-revoked token would need a valid token to authenticate\n/// with, and a revoked one no longer is, so the second call simply fails\n/// authentication like any other unusable token.\n///\n/// # Errors\n///\n/// Returns [`AppError::MissingBearer`] or [`AppError::InvalidToken`] if the\n/// caller is not authenticated.\npub async fn logout(\n    State(state): State\u003cAppState>,\n    Authenticated(claims): Authenticated,\n) -> StatusCode {\n    tracing::info!(username = claims.username, \"token revoked\");\n    state.tokens.revoke(&claims);\n\n    StatusCode::NO_CONTENT\n}\n"}, {"path": "crates/auth-service/src/routes/mod.rs", "group": "auth-service", "lang": "rust", "lines": 5, "src": "//! HTTP handlers.\n\npub mod gateway;\npub mod health;\npub mod login;\n"}, {"path": "crates/auth-service/src/throttle.rs", "group": "auth-service", "lang": "rust", "lines": 246, "src": "//! Login throttling.\n//!\n//! Two limits with different jobs, because one control cannot do both.\n//!\n//! **Per-address**, answered with `429`. Bounds how fast any single source can\n//! guess, regardless of which account it aims at. Safe to report honestly: the\n//! response depends on the caller's address, not on whether a username exists.\n//!\n//! **Per-account**, answered with the *ordinary* `401`. Stops credential\n//! stuffing against one account from a botnet, where no single address trips\n//! the address limit.\n//!\n//! # The trap\n//!\n//! A per-account lockout is the classic way to reintroduce the user enumeration\n//! this service works to prevent. Answer a locked account with `429` and an\n//! unknown one with `401`, and an attacker learns which usernames are real by\n//! failing at them five times. Answer both with `401` but skip the Argon2\n//! verification on the locked path, and the answer comes back in five\n//! milliseconds instead of fifty — the same oracle, read off a stopwatch.\n//!\n//! So a throttled account gets the identical `401`, and the caller still pays\n//! for a full verification (see [`Verdict::AccountThrottled`] in\n//! `routes::login`). Throttling here buys credential-stuffing resistance, not\n//! CPU: resource exhaustion is the semaphore's job and the address limit's.\n\nuse std::collections::HashMap;\nuse std::net::IpAddr;\nuse std::time::{Duration, Instant};\n\nuse parking_lot::Mutex;\n\n/// What the throttle permits for one attempt.\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum Verdict {\n    /// Proceed normally.\n    Allowed,\n    /// The calling address has failed too often. Answer `429`; this reveals\n    /// nothing about any account.\n    AddressThrottled,\n    /// This account has failed too often. Answer with the ordinary\n    /// `401`, after doing the same work a real rejection would.\n    AccountThrottled,\n}\n\n/// Failure counting for one key within a rolling window.\n#[derive(Debug)]\nstruct Failures {\n    count: u32,\n    window_started: Instant,\n}\n\n/// Counts recent login failures per account and per source address.\n#[derive(Debug)]\npub struct LoginThrottle {\n    by_account: Mutex\u003cHashMap\u003cString, Failures>>,\n    by_address: Mutex\u003cHashMap\u003cIpAddr, Failures>>,\n    account_limit: u32,\n    address_limit: u32,\n    window: Duration,\n}\n\nimpl LoginThrottle {\n    /// Failures against one account before it is throttled.\n    pub const DEFAULT_ACCOUNT_LIMIT: u32 = 5;\n    /// Failures from one address before it is throttled. Higher than the\n    /// account limit because an office or mobile network shares an address.\n    pub const DEFAULT_ADDRESS_LIMIT: u32 = 20;\n    /// How long failures are remembered.\n    pub const DEFAULT_WINDOW: Duration = Duration::from_secs(300);\n\n    /// Builds a throttle with the given policy.\n    #[must_use]\n    pub fn new(account_limit: u32, address_limit: u32, window: Duration) -> Self {\n        Self {\n            by_account: Mutex::new(HashMap::new()),\n            by_address: Mutex::new(HashMap::new()),\n            account_limit,\n            address_limit,\n            window,\n        }\n    }\n\n    /// Checks both limits for an attempt.\n    ///\n    /// The address limit is evaluated first: it is the one that can be reported\n    /// honestly, and reporting it costs nothing.\n    #[must_use]\n    pub fn check(&self, username: &str, address: Option\u003cIpAddr>) -> Verdict {\n        if let Some(address) = address\n            && over(\n                &mut self.by_address.lock(),\n                &address,\n                self.address_limit,\n                self.window,\n            )\n        {\n            return Verdict::AddressThrottled;\n        }\n\n        if over(\n            &mut self.by_account.lock(),\n            &username.to_owned(),\n            self.account_limit,\n            self.window,\n        ) {\n            return Verdict::AccountThrottled;\n        }\n\n        Verdict::Allowed\n    }\n\n    /// Records a failed attempt against both keys.\n    pub fn record_failure(&self, username: &str, address: Option\u003cIpAddr>) {\n        bump(\n            &mut self.by_account.lock(),\n            username.to_owned(),\n            self.window,\n        );\n        if let Some(address) = address {\n            bump(&mut self.by_address.lock(), address, self.window);\n        }\n    }\n\n    /// Clears the account's counter after a successful login.\n    ///\n    /// The address counter is deliberately *not* cleared: one success does not\n    /// excuse nineteen failures from the same source, which is exactly the\n    /// shape of a spray across many accounts.\n    pub fn record_success(&self, username: &str) {\n        self.by_account.lock().remove(username);\n    }\n}\n\nimpl Default for LoginThrottle {\n    fn default() -> Self {\n        Self::new(\n            Self::DEFAULT_ACCOUNT_LIMIT,\n            Self::DEFAULT_ADDRESS_LIMIT,\n            Self::DEFAULT_WINDOW,\n        )\n    }\n}\n\n/// Whether `key` is over `limit` within the current window, expiring a stale one.\nfn over\u003cK: std::hash::Hash + Eq>(\n    counters: &mut HashMap\u003cK, Failures>,\n    key: &K,\n    limit: u32,\n    window: Duration,\n) -> bool {\n    match counters.get(key) {\n        Some(failures) if failures.window_started.elapsed() \u003c window => failures.count >= limit,\n        Some(_) => {\n            counters.remove(key);\n            false\n        }\n        None => false,\n    }\n}\n\n/// Adds one failure to `key`, starting a fresh window if the last has lapsed.\nfn bump\u003cK: std::hash::Hash + Eq>(counters: &mut HashMap\u003cK, Failures>, key: K, window: Duration) {\n    let entry = counters.entry(key).or_insert_with(|| Failures {\n        count: 0,\n        window_started: Instant::now(),\n    });\n\n    if entry.window_started.elapsed() >= window {\n        entry.count = 0;\n        entry.window_started = Instant::now();\n    }\n\n    entry.count += 1;\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    const FAST: Duration = Duration::from_millis(50);\n\n    #[test]\n    fn an_account_is_throttled_after_the_limit() {\n        let throttle = LoginThrottle::new(3, 100, Duration::from_secs(60));\n\n        for _ in 0..3 {\n            assert_eq!(throttle.check(\"alice\", None), Verdict::Allowed);\n            throttle.record_failure(\"alice\", None);\n        }\n\n        assert_eq!(throttle.check(\"alice\", None), Verdict::AccountThrottled);\n        assert_eq!(\n            throttle.check(\"bob\", None),\n            Verdict::Allowed,\n            \"throttling one account must not affect another\"\n        );\n    }\n\n    #[test]\n    fn success_clears_the_account_counter() {\n        let throttle = LoginThrottle::new(3, 100, Duration::from_secs(60));\n\n        throttle.record_failure(\"alice\", None);\n        throttle.record_failure(\"alice\", None);\n        throttle.record_success(\"alice\");\n        throttle.record_failure(\"alice\", None);\n\n        assert_eq!(throttle.check(\"alice\", None), Verdict::Allowed);\n    }\n\n    #[test]\n    fn an_address_is_throttled_independently_of_the_account() {\n        let address = Some(IpAddr::from([203, 0, 113, 7]));\n        let throttle = LoginThrottle::new(100, 3, Duration::from_secs(60));\n\n        // A spray: a different username every time, so no account limit trips.\n        for attempt in 0..3 {\n            let username = format!(\"victim-{attempt}\");\n            assert_eq!(throttle.check(&username, address), Verdict::Allowed);\n            throttle.record_failure(&username, address);\n        }\n\n        assert_eq!(\n            throttle.check(\"victim-99\", address),\n            Verdict::AddressThrottled,\n            \"a spray across accounts must still be caught by the address limit\"\n        );\n    }\n\n    #[test]\n    fn counters_lapse_with_the_window() {\n        let throttle = LoginThrottle::new(2, 100, FAST);\n\n        throttle.record_failure(\"alice\", None);\n        throttle.record_failure(\"alice\", None);\n        assert_eq!(throttle.check(\"alice\", None), Verdict::AccountThrottled);\n\n        std::thread::sleep(FAST * 2);\n        assert_eq!(\n            throttle.check(\"alice\", None),\n            Verdict::Allowed,\n            \"failures must not be remembered past the window\"\n        );\n    }\n}\n"}, {"path": "crates/auth-service/src/token.rs", "group": "auth-service", "lang": "rust", "lines": 206, "src": "//! Bearer token issuing, verification, and revocation.\n//!\n//! # Key rotation\n//!\n//! Every token carries a `kid` naming the key that signed it, and the service\n//! holds one active signing key plus any number of retired verification keys.\n//! Rotation is then an overlap rather than an outage: deploy the new key as\n//! active with the old one retired, wait out the token lifetime, drop the old\n//! one. A service with a single hard-coded secret cannot rotate without\n//! invalidating every live session, which in practice means it never rotates.\n//!\n//! The `kid` selects from *our* key set; it never selects an algorithm. The\n//! accepted algorithm list is pinned separately, because trusting a token's own\n//! header for that is how `alg: none` and HMAC/RSA confusion land.\n//!\n//! # Revocation\n//!\n//! Expiry alone means a stolen token is valid for its full lifetime. Each token\n//! carries a `jti`, and [`TokenService::revoke`] records it until its natural\n//! expiry — so the list is bounded by issuance rate times TTL, not by time.\n\nuse std::collections::HashMap;\nuse std::fmt;\nuse std::time::{Duration, SystemTime, UNIX_EPOCH};\n\nuse common::UserId;\nuse jsonwebtoken::{\n    Algorithm, DecodingKey, EncodingKey, Header, Validation, decode, decode_header, encode,\n};\nuse parking_lot::RwLock;\nuse serde::{Deserialize, Serialize};\n\nuse crate::error::AppError;\n\n/// One signing or verification key, named by its `kid`.\n#[derive(Debug, Clone)]\npub struct KeyMaterial {\n    /// Identifier written into the token header.\n    pub kid: String,\n    /// The HMAC secret.\n    pub secret: String,\n}\n\nimpl KeyMaterial {\n    /// Builds key material.\n    #[must_use]\n    pub fn new(kid: &str, secret: &str) -> Self {\n        Self {\n            kid: kid.to_owned(),\n            secret: secret.to_owned(),\n        }\n    }\n}\n\n/// Claims carried by an issued token.\n#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]\npub struct Claims {\n    /// Subject: the account's [`UserId`], not its username, because usernames\n    /// may be reassigned while ids may not.\n    pub sub: UserId,\n    /// The account's login name at the time of issue, carried for logging.\n    pub username: String,\n    /// Unique token identifier, so one token can be revoked without touching\n    /// the key that signed it.\n    pub jti: String,\n    /// Expiry, as seconds since the Unix epoch.\n    pub exp: u64,\n    /// Issued-at, as seconds since the Unix epoch.\n    pub iat: u64,\n}\n\n/// Signs, validates and revokes [`Claims`].\npub struct TokenService {\n    active_kid: String,\n    encoding: EncodingKey,\n    /// Every key whose tokens are still accepted, including the active one.\n    decoding: HashMap\u003cString, DecodingKey>,\n    validation: Validation,\n    ttl: Duration,\n    /// Revoked `jti`s mapped to the expiry after which they can be forgotten.\n    revoked: RwLock\u003cHashMap\u003cString, u64>>,\n}\n\nimpl TokenService {\n    /// Builds a service that signs with `active` and also accepts tokens signed\n    /// by any key in `retired`.\n    #[must_use]\n    pub fn new(active: &KeyMaterial, retired: &[KeyMaterial], ttl: Duration) -> Self {\n        let mut validation = Validation::new(Algorithm::HS256);\n        // Pin the accepted algorithm set. Leaving this to a library default is\n        // how `alg: none` and HMAC/RSA confusion attacks land.\n        validation.algorithms = vec![Algorithm::HS256];\n        validation.set_required_spec_claims(&[\"exp\", \"sub\"]);\n\n        let mut decoding = HashMap::new();\n        for key in std::iter::once(active).chain(retired) {\n            decoding.insert(\n                key.kid.clone(),\n                DecodingKey::from_secret(key.secret.as_bytes()),\n            );\n        }\n\n        Self {\n            active_kid: active.kid.clone(),\n            encoding: EncodingKey::from_secret(active.secret.as_bytes()),\n            decoding,\n            validation,\n            ttl,\n            revoked: RwLock::new(HashMap::new()),\n        }\n    }\n\n    /// Lifetime of tokens issued by this service, in seconds.\n    #[must_use]\n    pub fn ttl_secs(&self) -> u64 {\n        self.ttl.as_secs()\n    }\n\n    /// Issues a token for the given account.\n    ///\n    /// # Errors\n    ///\n    /// Returns [`AppError::TokenSigning`] if the claims cannot be signed.\n    ///\n    /// # Panics\n    ///\n    /// Panics if the system clock is set before the Unix epoch.\n    pub fn issue(&self, user_id: &UserId, username: &str) -> Result\u003cString, AppError> {\n        let now = unix_now();\n        let claims = Claims {\n            sub: user_id.clone(),\n            username: username.to_owned(),\n            jti: uuid::Uuid::new_v4().to_string(),\n            iat: now,\n            exp: now + self.ttl.as_secs(),\n        };\n\n        let mut header = Header::new(Algorithm::HS256);\n        header.kid = Some(self.active_kid.clone());\n\n        encode(&header, &claims, &self.encoding).map_err(AppError::TokenSigning)\n    }\n\n    /// Validates a token's key, signature, algorithm, expiry and revocation.\n    ///\n    /// # Errors\n    ///\n    /// Returns [`AppError::InvalidToken`] for every failure mode. The caller\n    /// learns that the token is unusable, never why — distinguishing \"expired\"\n    /// from \"revoked\" from \"forged\" tells an attacker how close they are.\n    pub fn verify(&self, token: &str) -> Result\u003cClaims, AppError> {\n        let kid = decode_header(token)\n            .map_err(|_| AppError::InvalidToken)?\n            .kid\n            .ok_or(AppError::InvalidToken)?;\n\n        let key = self.decoding.get(&kid).ok_or(AppError::InvalidToken)?;\n\n        let claims = decode::\u003cClaims>(token, key, &self.validation)\n            .map(|data| data.claims)\n            .map_err(|_| AppError::InvalidToken)?;\n\n        if self.revoked.read().contains_key(&claims.jti) {\n            return Err(AppError::InvalidToken);\n        }\n\n        Ok(claims)\n    }\n\n    /// Revokes a single token, effective immediately.\n    ///\n    /// Recorded only until the token would have expired anyway, so the list is\n    /// bounded by issuance rate times TTL rather than growing without limit.\n    pub fn revoke(&self, claims: &Claims) {\n        let now = unix_now();\n        let mut revoked = self.revoked.write();\n\n        revoked.retain(|_, expiry| *expiry > now);\n        revoked.insert(claims.jti.clone(), claims.exp);\n    }\n\n    /// How many revocations are currently retained. Exposed for tests and\n    /// metrics; the number is a queue depth, not a secret.\n    #[must_use]\n    pub fn revoked_count(&self) -> usize {\n        self.revoked.read().len()\n    }\n}\n\n/// Omits the key material.\nimpl fmt::Debug for TokenService {\n    fn fmt(&self, f: &mut fmt::Formatter\u003c'_>) -> fmt::Result {\n        f.debug_struct(\"TokenService\")\n            .field(\"active_kid\", &self.active_kid)\n            .field(\"accepted_kids\", &self.decoding.keys().collect::\u003cVec\u003c_>>())\n            .field(\"ttl\", &self.ttl)\n            .finish_non_exhaustive()\n    }\n}\n\nfn unix_now() -> u64 {\n    SystemTime::now()\n        .duration_since(UNIX_EPOCH)\n        .expect(\"system clock is set before the Unix epoch\")\n        .as_secs()\n}\n"}, {"path": "crates/auth-service/src/tracing_id.rs", "group": "auth-service", "lang": "rust", "lines": 80, "src": "//! Request correlation across the gateway hop.\n//!\n//! With two services, \"grep both logs around the same timestamp\" stops working\n//! the moment there is more than one request in flight. Every request gets an\n//! id — accepted from the caller when present, so a trace can start at the\n//! client, and minted here otherwise — which is attached to the tracing span,\n//! forwarded upstream, and echoed to the caller so a user reporting a failure\n//! can quote it.\n\nuse axum::extract::Request;\nuse axum::http::{HeaderValue, header::HeaderName};\nuse axum::middleware::Next;\nuse axum::response::Response;\nuse common::headers;\n\n/// Longest accepted inbound id.\n///\n/// Client-supplied values end up in log lines, so they are bounded and\n/// restricted to characters that cannot break a log parser or smuggle a line\n/// ending. Anything failing that is replaced rather than rejected: a malformed\n/// correlation id is not worth failing a request over.\nconst MAX_LEN: usize = 64;\n\n/// Attaches a request id to the span, the upstream call, and the response.\npub async fn propagate(mut request: Request, next: Next) -> Response {\n    let header = HeaderName::from_static(headers::REQUEST_ID);\n\n    let id = request\n        .headers()\n        .get(&header)\n        .and_then(|value| value.to_str().ok())\n        .filter(|id| is_acceptable(id))\n        .map_or_else(|| uuid::Uuid::new_v4().to_string(), str::to_owned);\n\n    // Put it back in normalised form so the gateway forwards exactly what it\n    // logged, even when the caller supplied nothing or supplied junk.\n    if let Ok(value) = HeaderValue::from_str(&id) {\n        request.headers_mut().insert(header.clone(), value.clone());\n\n        let span = tracing::info_span!(\"request\", request_id = %id);\n        let mut response = {\n            let _entered = span.enter();\n            next.run(request)\n        }\n        .await;\n\n        response.headers_mut().insert(header, value);\n        return response;\n    }\n\n    next.run(request).await\n}\n\n/// Whether a client-supplied id is safe to log and forward verbatim.\nfn is_acceptable(id: &str) -> bool {\n    !id.is_empty()\n        && id.len() \u003c= MAX_LEN\n        && id\n            .bytes()\n            .all(|b| b.is_ascii_alphanumeric() || b == b'-' || b == b'_')\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn plausible_ids_are_kept() {\n        assert!(is_acceptable(\"0199f2a1-3c4d-7e8f-9a0b-1c2d3e4f5a6b\"));\n        assert!(is_acceptable(\"req_12345\"));\n    }\n\n    #[test]\n    fn log_breaking_or_oversized_ids_are_rejected() {\n        assert!(!is_acceptable(\"\"));\n        assert!(!is_acceptable(\"has space\"));\n        assert!(!is_acceptable(\"line\\nbreak\"));\n        assert!(!is_acceptable(&\"x\".repeat(MAX_LEN + 1)));\n    }\n}\n"}, {"path": "crates/auth-service/src/users.rs", "group": "auth-service", "lang": "rust", "lines": 172, "src": "//! In-memory user directory.\n\nuse std::collections::HashMap;\nuse std::fmt;\nuse std::sync::Arc;\n\nuse common::UserId;\n\nuse crate::password;\n\n/// A stored account.\n///\n/// Fields are private: the password hash must not be readable by handler code,\n/// and the id and username are only meaningful together.\npub struct UserRecord {\n    id: UserId,\n    username: String,\n    /// PHC string; the salt and Argon2 parameters are embedded in it.\n    password_hash: String,\n}\n\nimpl UserRecord {\n    /// The account's stable identifier.\n    #[must_use]\n    pub fn id(&self) -> &UserId {\n        &self.id\n    }\n\n    /// The account's login name.\n    #[must_use]\n    pub fn username(&self) -> &str {\n        &self.username\n    }\n}\n\n/// Redacts the password hash.\n///\n/// A hash is not a plaintext password, but it is offline-crackable material and\n/// has no business appearing in a log line.\nimpl fmt::Debug for UserRecord {\n    fn fmt(&self, f: &mut fmt::Formatter\u003c'_>) -> fmt::Result {\n        f.debug_struct(\"UserRecord\")\n            .field(\"id\", &self.id)\n            .field(\"username\", &self.username)\n            .field(\"password_hash\", &\"\u003credacted>\")\n            .finish()\n    }\n}\n\n/// Outcome of a credential check.\n///\n/// An unknown username and a wrong password both produce [`Self::Rejected`].\n/// The distinction is not merely unrendered: it never leaves this module, so no\n/// caller is able to leak it.\n#[derive(Debug)]\npub enum Authentication {\n    /// The credentials matched the contained account.\n    Authenticated(Arc\u003cUserRecord>),\n    /// The credentials did not match, for a reason the caller does not learn.\n    Rejected,\n}\n\n/// Accounts held in memory, immutable after construction.\n///\n/// There is no lock because there are no writers. `Arc\u003cUserDirectory>` is\n/// already [`Sync`] since [`HashMap`] is [`Sync`] when its contents are. Adding\n/// a [`RwLock`] here would cost an atomic per request and buy nothing; it would\n/// be necessary the moment registration existed.\n///\n/// [`RwLock`]: std::sync::RwLock\n#[derive(Debug, Default)]\npub struct UserDirectory {\n    by_username: HashMap\u003cString, Arc\u003cUserRecord>>,\n}\n\nimpl UserDirectory {\n    /// Builds a directory containing the single hard-coded account the exercise\n    /// permits, hashing `password` on the way in.\n    ///\n    /// # Panics\n    ///\n    /// Panics if Argon2 rejects the seed password. This can only happen for a\n    /// password longer than `0xFFFF_FFFF` bytes, so it indicates a programming\n    /// error rather than a runtime condition.\n    #[must_use]\n    pub fn with_seed_user(username: &str, password: &str) -> Self {\n        // Force the decoy hash now. It lives behind a `OnceLock`, so leaving it\n        // cold means the first unknown-username login computes it *and* then\n        // verifies against it — two Argon2 passes where a known username costs\n        // one. Measured at 0.94s versus 0.47s, which is a user-enumeration\n        // oracle for exactly one request per process. Warming it here removes\n        // the asymmetry at the only point where a directory can exist without\n        // having served a request yet.\n        let _ = password::decoy_hash();\n\n        let record = UserRecord {\n            id: UserId::random(),\n            username: username.to_owned(),\n            password_hash: password::hash(password).expect(\"seed password must be hashable\"),\n        };\n\n        Self {\n            by_username: HashMap::from([(username.to_owned(), Arc::new(record))]),\n        }\n    }\n\n    /// Verifies `password` against the account named `username`.\n    ///\n    /// Performs a full Argon2 verification whether or not the account exists, so\n    /// the two rejection paths are indistinguishable by elapsed time as well as\n    /// by response body.\n    ///\n    /// Blocking and CPU-bound by design; call it from\n    /// [`tokio::task::spawn_blocking`] rather than directly from a handler.\n    #[must_use]\n    pub fn authenticate(&self, username: &str, password: &str) -> Authentication {\n        let user = self.by_username.get(username);\n\n        let phc = match user {\n            Some(user) => user.password_hash.as_str(),\n            None => password::decoy_hash(),\n        };\n\n        match (user, password::verify(password, phc)) {\n            (Some(user), true) => Authentication::Authenticated(Arc::clone(user)),\n            _ => Authentication::Rejected,\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use std::time::{Duration, Instant};\n\n    use super::*;\n\n    #[test]\n    fn constructing_the_directory_warms_the_decoy_hash() {\n        let _directory = UserDirectory::with_seed_user(\"alice\", \"hunter2\");\n\n        // A cold `OnceLock` would run a full Argon2 here — tens of milliseconds\n        // in release, hundreds in debug. Warm, this is a pointer read. The gap\n        // is wide enough that the assertion is not a timing race.\n        let started = Instant::now();\n        let _ = password::decoy_hash();\n\n        assert!(\n            started.elapsed() \u003c Duration::from_millis(1),\n            \"the decoy hash was still cold after construction, so the first \\\n             unknown-username login would cost two Argon2 passes instead of one \\\n             and leak account existence by timing\"\n        );\n    }\n\n    #[test]\n    fn an_unknown_username_is_rejected_like_a_wrong_password() {\n        let directory = UserDirectory::with_seed_user(\"alice\", \"hunter2\");\n\n        assert!(matches!(\n            directory.authenticate(\"alice\", \"wrong\"),\n            Authentication::Rejected\n        ));\n        assert!(matches!(\n            directory.authenticate(\"nobody\", \"wrong\"),\n            Authentication::Rejected\n        ));\n        assert!(matches!(\n            directory.authenticate(\"alice\", \"hunter2\"),\n            Authentication::Authenticated(_)\n        ));\n    }\n}\n"}, {"path": "crates/auth-service/tests/gateway_cost.rs", "group": "auth-service", "lang": "rust", "lines": 72, "src": "//! What the gateway hop is actually made of.\n//!\n//! Measured over real HTTP, a request through the gateway costs about 2.9 ms at\n//! p50 against 1.0 ms straight to the profile service. That 1.9 ms is the thing\n//! worth attacking; nanoseconds of middleware are not. This prices the parts of\n//! it that live in this service.\n//!\n//! ```text\n//! cargo test -p auth-service --release --test gateway_cost -- --ignored --nocapture\n//! ```\n\n#![allow(clippy::cast_precision_loss)]\n\nuse std::time::{Duration, Instant};\n\nuse auth_service::{KeyMaterial, TokenService};\nuse common::UserId;\n\nconst ROUNDS: usize = 5;\nconst ITERATIONS: usize = 50_000;\n\nfn median(mut samples: Vec\u003cf64>) -> f64 {\n    samples.sort_by(f64::total_cmp);\n    samples[samples.len() / 2]\n}\n\nfn time(iterations: usize, mut work: impl FnMut()) -> f64 {\n    let started = Instant::now();\n    for _ in 0..iterations {\n        work();\n    }\n    started.elapsed().as_nanos() as f64 / iterations as f64\n}\n\n#[test]\n#[ignore = \"performance measurement, not a correctness check\"]\nfn token_verification_cost() {\n    let tokens = TokenService::new(\n        &KeyMaterial::new(\"k1\", \"measurement-secret\"),\n        &[],\n        Duration::from_secs(900),\n    );\n    let user = UserId::random();\n    let token = tokens.issue(&user, \"alice\").expect(\"signs\");\n\n    let verify = median(\n        (0..ROUNDS)\n            .map(|_| {\n                time(ITERATIONS, || {\n                    tokens.verify(&token).expect(\"valid\");\n                })\n            })\n            .collect(),\n    );\n\n    let issue = median(\n        (0..ROUNDS)\n            .map(|_| {\n                time(ITERATIONS / 10, || {\n                    tokens.issue(&user, \"alice\").expect(\"signs\");\n                })\n            })\n            .collect(),\n    );\n\n    println!(\"\\ntoken verify   {verify:>8.0} ns/op\");\n    println!(\"token issue    {issue:>8.0} ns/op\");\n    println!();\n    println!(\"A gateway request over real HTTP costs ~2.9 ms at p50 and ~1.0 ms\");\n    println!(\"straight to the upstream, so the hop is ~1.9 ms. Verification is\");\n    println!(\"{:.3}% of that hop.\", verify / 1_900_000.0 * 100.0);\n}\n"}, {"path": "crates/auth-service/tests/login_security.rs", "group": "auth-service", "lang": "rust", "lines": 143, "src": "//! Requirement 2: a failed login must not reveal whether the username exists.\n//!\n//! Two things have to hold, and only one of them is obvious.\n//!\n//! The obvious one is that the *responses* match — same status, same body, same\n//! headers. The subtle one is that the *timing* matches. Argon2 takes tens of\n//! milliseconds by design; an implementation that returns early on an unknown\n//! username is fast on a miss and slow on a hit, and that gap is measurable\n//! across a network. It turns the login endpoint into a \"does this account\n//! exist\" oracle even though every response is byte-identical.\n//!\n//! [`indistinguishable_responses`] covers the first. [`no_early_return_for_unknown_user`]\n//! covers the second without a flaky A-vs-B timing comparison: it asserts the\n//! unknown-user path spends real Argon2 time, which is only possible if it\n//! actually hashed something.\n\nuse std::sync::{Arc, OnceLock};\nuse std::time::{Duration, Instant};\n\nuse auth_service::{AppState, KeyMaterial, LoginThrottle, TokenService, Upstream, UserDirectory};\nuse axum::body::Body;\nuse axum::http::{Request, StatusCode, header};\nuse tower::ServiceExt;\n\nconst USERNAME: &str = \"alice\";\nconst PASSWORD: &str = \"correct-horse-battery-staple\";\n\n/// Built once: seeding hashes the password, which is deliberately expensive.\nfn state() -> AppState {\n    static STATE: OnceLock\u003cAppState> = OnceLock::new();\n    STATE\n        .get_or_init(|| AppState {\n            users: Arc::new(UserDirectory::with_seed_user(USERNAME, PASSWORD)),\n            tokens: Arc::new(TokenService::new(\n                &KeyMaterial::new(\"test\", \"test-secret\"),\n                &[],\n                Duration::from_secs(900),\n            )),\n            throttle: Arc::new(LoginThrottle::default()),\n            upstream: Upstream::new(\"http://127.0.0.1:0\", \"test-internal-token\"),\n            hash_permits: Arc::new(tokio::sync::Semaphore::new(\n                auth_service::default_hash_permits(),\n            )),\n        })\n        .clone()\n}\n\n/// One login attempt, returning everything a caller could observe.\nasync fn attempt(username: &str, password: &str) -> (StatusCode, Option\u003cString>, Vec\u003cu8>) {\n    let request = Request::builder()\n        .method(\"POST\")\n        .uri(\"/login\")\n        .header(header::CONTENT_TYPE, \"application/json\")\n        .body(Body::from(format!(\n            r#\"{{\"username\":\"{username}\",\"password\":\"{password}\"}}\"#\n        )))\n        .expect(\"request is well-formed\");\n\n    let response = auth_service::router(state())\n        .oneshot(request)\n        .await\n        .expect(\"router is infallible\");\n\n    let status = response.status();\n    let content_type = response\n        .headers()\n        .get(header::CONTENT_TYPE)\n        .and_then(|value| value.to_str().ok())\n        .map(str::to_owned);\n    let body = axum::body::to_bytes(response.into_body(), usize::MAX)\n        .await\n        .expect(\"body is finite\");\n\n    (status, content_type, body.to_vec())\n}\n\n#[tokio::test]\nasync fn indistinguishable_responses() {\n    let unknown_user = attempt(\"no-such-account\", \"irrelevant\").await;\n    let wrong_password = attempt(USERNAME, \"not-the-password\").await;\n\n    assert_eq!(unknown_user.0, StatusCode::UNAUTHORIZED);\n    assert_eq!(\n        unknown_user, wrong_password,\n        \"an unknown username and a wrong password must be observationally identical; \\\n         any difference in status, content type, or body is a user-enumeration oracle\"\n    );\n\n    // Pin the exact bytes, so a future edit that adds a helpful detail such as\n    // \"user not found\" to one branch fails here rather than shipping.\n    assert_eq!(\n        String::from_utf8_lossy(&unknown_user.2),\n        r#\"{\"error\":\"invalid_credentials\",\"message\":\"Invalid username or password.\"}\"#\n    );\n}\n\n#[tokio::test]\nasync fn no_early_return_for_unknown_user() {\n    // Argon2id at m=19456 KiB cannot complete in under a millisecond on any\n    // machine that exists. Spending real time here proves the unknown-user path\n    // verified against the decoy hash instead of short-circuiting on the lookup.\n    const FLOOR: Duration = Duration::from_millis(5);\n\n    let started = Instant::now();\n    let (status, ..) = attempt(\"no-such-account\", \"irrelevant\").await;\n    let elapsed = started.elapsed();\n\n    assert_eq!(status, StatusCode::UNAUTHORIZED);\n    assert!(\n        elapsed >= FLOOR,\n        \"unknown-user login returned in {elapsed:?}, faster than one Argon2 verification; \\\n         the lookup miss is short-circuiting and leaks account existence by timing\"\n    );\n}\n\n#[tokio::test]\nasync fn valid_credentials_are_still_accepted() {\n    let (status, _, body) = attempt(USERNAME, PASSWORD).await;\n\n    assert_eq!(status, StatusCode::OK, \"the control case must still pass\");\n    assert!(\n        String::from_utf8_lossy(&body).contains(\"access_token\"),\n        \"a successful login must return a token\"\n    );\n}\n\n#[tokio::test]\nasync fn profile_routes_require_a_token() {\n    let request = Request::builder()\n        .method(\"GET\")\n        .uri(\"/profile\")\n        .body(Body::empty())\n        .expect(\"request is well-formed\");\n\n    let response = auth_service::router(state())\n        .oneshot(request)\n        .await\n        .expect(\"router is infallible\");\n\n    // Rejected at the gateway, so the profile service is never contacted —\n    // note this passes with nothing listening on the upstream port.\n    assert_eq!(response.status(), StatusCode::UNAUTHORIZED);\n}\n"}, {"path": "crates/profile-service/Cargo.toml", "group": "profile-service", "lang": "toml", "lines": 33, "src": "[package]\nname = \"profile-service\"\ndescription = \"Profile service: stores user profile data with optimistic concurrency control.\"\nversion.workspace = true\nedition.workspace = true\npublish.workspace = true\nlicense.workspace = true\nrepository.workspace = true\nauthors.workspace = true\n\n[dependencies]\ncommon.workspace = true\naxum.workspace = true\ntokio.workspace = true\ntower-http.workspace = true\nserde.workspace = true\nserde_json.workspace = true\nsubtle.workspace = true\nasync-trait.workspace = true\nparking_lot.workspace = true\nrustc-hash.workspace = true\narc-swap.workspace = true\nrusqlite.workspace = true\nthiserror.workspace = true\ntracing.workspace = true\ntracing-subscriber.workspace = true\n\n[dev-dependencies]\ntower.workspace = true\nserde_json.workspace = true\n\n[lints]\nworkspace = true\n"}, {"path": "crates/profile-service/clippy.toml", "group": "profile-service", "lang": "toml", "lines": 4, "src": "# Proper nouns that clippy::doc_markdown would otherwise want in backticks.\n# Backticks mean \"this is code\"; these are product names in prose.\n# \"..\" extends clippy's default list rather than replacing it.\ndoc-valid-idents = [\"SQLite\", \"PostgreSQL\", \"..\"]\n"}, {"path": "crates/profile-service/src/auth.rs", "group": "profile-service", "lang": "rust", "lines": 95, "src": "//! Trust boundary for the internal hop.\n//!\n//! The profile service never sees a bearer token and never validates one. It\n//! trusts exactly two headers, and only in this order: a shared secret proving\n//! the caller is the gateway, then the user id the gateway derived from a token\n//! it already verified. Collapsing those two checks into one place means no\n//! handler can accidentally skip the first and still read the second.\n\nuse axum::extract::{FromRequestParts, Request, State};\nuse axum::http::request::Parts;\nuse axum::middleware::Next;\nuse axum::response::Response;\nuse common::UserId;\nuse common::headers;\nuse subtle::ConstantTimeEq;\nuse tracing::Instrument;\n\nuse crate::AppState;\nuse crate::error::ProfileError;\n\n/// The authenticated user, as asserted by the gateway.\n///\n/// Only meaningful because [`require_internal_token`] runs first; on its own\n/// this header is client-controlled and worthless.\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct Caller(pub UserId);\n\nimpl\u003cS> FromRequestParts\u003cS> for Caller\nwhere\n    S: Send + Sync,\n{\n    type Rejection = ProfileError;\n\n    async fn from_request_parts(parts: &mut Parts, _state: &S) -> Result\u003cSelf, Self::Rejection> {\n        parts\n            .headers\n            .get(headers::USER_ID)\n            .and_then(|value| value.to_str().ok())\n            .filter(|id| !id.is_empty())\n            .map(|id| Self(UserId::from(id)))\n            .ok_or(ProfileError::MissingCaller)\n    }\n}\n\n/// Establishes correlation, then rejects anything that is not the gateway.\n///\n/// Two concerns in one layer, deliberately. Each `from_fn` layer costs roughly\n/// 700 ns of machinery — a boxed future and a state clone per request — which\n/// measured as more than a third of the handler it wraps. Two layers therefore\n/// cost more than the work they guard. Combining them keeps both guarantees and\n/// removes one layer's worth of that overhead.\n///\n/// It stays a *layer* rather than folding into an extractor: a layer protects\n/// every route beneath it, whereas an extractor only protects routes that\n/// remember to ask for it. That difference is worth 700 ns — a route added\n/// later must not be able to skip the check by omission.\n///\n/// The token comparison is constant-time. A byte-by-byte `==` short-circuits on\n/// the first mismatch, which leaks the secret one character at a time to anyone\n/// who can measure response latency across enough requests.\n///\n/// Correlation is established *before* the token check, so a rejected request\n/// still appears in the logs under the id the caller quoted.\n///\n/// # Errors\n///\n/// Returns [`ProfileError::NotInternal`] if the token is absent or wrong.\npub async fn gateway_guard(\n    State(state): State\u003cAppState>,\n    request: Request,\n    next: Next,\n) -> Result\u003cResponse, ProfileError> {\n    let correlation = crate::tracing_id::inbound(request.headers());\n    let span = crate::tracing_id::span(correlation.as_ref());\n\n    let presented = request\n        .headers()\n        .get(headers::INTERNAL_TOKEN)\n        .map_or(&b\"\"[..], |value| value.as_bytes());\n\n    if presented.ct_eq(state.internal_token.as_bytes()).unwrap_u8() != 1 {\n        let _entered = span.enter();\n        return Err(ProfileError::NotInternal);\n    }\n\n    // `Instrument`, not `span.enter()`. Entering a span makes it current for the\n    // enclosing scope only; a future *built* inside that scope is polled later,\n    // with the span long since exited, so the handler's own events would escape\n    // it entirely. This is easy to write and invisible until you go looking for\n    // a log line that should have been correlated.\n    let mut response = next.run(request).instrument(span).await;\n    crate::tracing_id::echo(response.headers_mut(), correlation);\n\n    Ok(response)\n}\n"}, {"path": "crates/profile-service/src/config.rs", "group": "profile-service", "lang": "rust", "lines": 61, "src": "//! Process configuration, read once at startup.\n\nuse std::fmt;\n\n/// Values read from the environment at startup.\n#[derive(Clone)]\npub struct Config {\n    /// Address the HTTP listener binds to.\n    pub bind_addr: String,\n    /// Shared secret the gateway must present on every request.\n    pub internal_token: String,\n    /// Which storage backend to build.\n    pub backend: Backend,\n}\n\n/// Storage backends selectable at startup.\n///\n/// A deployment choice rather than a compile-time one: a single instance can\n/// run on the in-memory store, while anything replicated needs the version to\n/// live somewhere every replica can see.\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Default)]\npub enum Backend {\n    /// Process-local maps. Fastest, and correct only for a single instance.\n    #[default]\n    Memory,\n    /// SQLite, opened in memory as the brief calls for. Demonstrates the same\n    /// compare-and-swap as real SQL; point it at a file or a server for\n    /// durability and shared state.\n    Sqlite,\n}\n\nimpl Config {\n    /// Reads configuration from the environment, falling back to development\n    /// defaults so `cargo run` works with no setup.\n    #[must_use]\n    pub fn from_env() -> Self {\n        fn var(key: &str, default: &str) -> String {\n            std::env::var(key).unwrap_or_else(|_| default.to_owned())\n        }\n\n        Self {\n            bind_addr: var(\"PROFILE_BIND_ADDR\", \"127.0.0.1:8081\"),\n            internal_token: var(\"INTERNAL_TOKEN\", \"dev-only-internal-token-change-me\"),\n            backend: match var(\"PROFILE_BACKEND\", \"memory\").as_str() {\n                \"sqlite\" => Backend::Sqlite,\n                _ => Backend::Memory,\n            },\n        }\n    }\n}\n\n/// Redacts the shared secret.\nimpl fmt::Debug for Config {\n    fn fmt(&self, f: &mut fmt::Formatter\u003c'_>) -> fmt::Result {\n        f.debug_struct(\"Config\")\n            .field(\"bind_addr\", &self.bind_addr)\n            .field(\"internal_token\", &\"\u003credacted>\")\n            .field(\"backend\", &self.backend)\n            .finish()\n    }\n}\n"}, {"path": "crates/profile-service/src/error.rs", "group": "profile-service", "lang": "rust", "lines": 164, "src": "//! The service-wide error type and its single HTTP mapping.\n\nuse std::borrow::Cow;\n\nuse axum::Json;\nuse axum::http::{StatusCode, header};\nuse axum::response::{IntoResponse, Response};\nuse common::dto::ErrorResponse;\nuse common::{InvalidProfile, Version};\n\nuse crate::store::StoreError;\n\n/// Anything a handler can fail with.\n#[derive(Debug, thiserror::Error)]\npub enum ProfileError {\n    /// The internal token was absent or wrong: the caller is not the gateway.\n    #[error(\"caller is not the gateway\")]\n    NotInternal,\n\n    /// The gateway forwarded a request with no user id header. This is a bug in\n    /// the gateway, never something a client can cause, so it is a `500`.\n    #[error(\"internal request carried no user id\")]\n    MissingCaller,\n\n    /// No profile exists for the calling user.\n    #[error(\"profile not found\")]\n    NotFound,\n\n    /// A profile already exists and `POST` will not overwrite it.\n    #[error(\"profile already exists\")]\n    AlreadyExists,\n\n    /// `PUT` arrived without an `If-Match` header.\n    #[error(\"If-Match is required\")]\n    PreconditionRequired,\n\n    /// The `If-Match` version did not match the stored one.\n    #[error(\"If-Match version is stale\")]\n    PreconditionFailed {\n        /// The version actually stored, returned so the client can retry.\n        current_version: Version,\n    },\n\n    /// An `If-Match` header was present but not a valid version.\n    #[error(\"If-Match is malformed\")]\n    MalformedPrecondition,\n\n    /// The request body was not the JSON this endpoint expects.\n    #[error(\"request body is not valid JSON for this endpoint\")]\n    MalformedBody,\n\n    /// Another request is currently holding this idempotency key.\n    #[error(\"a request with this idempotency key is in progress\")]\n    IdempotencyInFlight,\n\n    /// This idempotency key was used before with a different body.\n    #[error(\"idempotency key reused with a different request body\")]\n    IdempotencyReused,\n\n    /// The payload failed the invariants on [`ProfileInput`].\n    ///\n    /// [`ProfileInput`]: common::dto::ProfileInput\n    #[error(transparent)]\n    Invalid(#[from] InvalidProfile),\n\n    /// The storage backend failed.\n    #[error(\"storage fault\")]\n    Store(#[from] StoreError),\n}\n\nimpl ProfileError {\n    /// Maps the error to `(status, machine-readable code, client-safe message)`.\n    fn parts(&self) -> (StatusCode, &'static str, Cow\u003c'static, str>) {\n        match self {\n            Self::NotInternal => (\n                StatusCode::FORBIDDEN,\n                \"forbidden\",\n                Cow::Borrowed(\"This service is not directly reachable.\"),\n            ),\n            Self::NotFound => (\n                StatusCode::NOT_FOUND,\n                \"not_found\",\n                Cow::Borrowed(\"No profile exists for this user.\"),\n            ),\n            Self::AlreadyExists => (\n                StatusCode::CONFLICT,\n                \"already_exists\",\n                Cow::Borrowed(\"A profile already exists; use PUT to update it.\"),\n            ),\n            Self::PreconditionRequired => (\n                StatusCode::PRECONDITION_REQUIRED,\n                \"precondition_required\",\n                Cow::Borrowed(\"If-Match is required. Read the profile and retry with its ETag.\"),\n            ),\n            Self::PreconditionFailed { .. } => (\n                StatusCode::PRECONDITION_FAILED,\n                \"precondition_failed\",\n                Cow::Borrowed(\"The profile changed since you read it. Re-read and retry.\"),\n            ),\n            Self::MalformedPrecondition => (\n                StatusCode::BAD_REQUEST,\n                \"malformed_precondition\",\n                Cow::Borrowed(\"If-Match must be an ETag such as \\\"3\\\".\"),\n            ),\n            Self::MalformedBody => (\n                StatusCode::BAD_REQUEST,\n                \"malformed_body\",\n                Cow::Borrowed(\"The request body must be a JSON profile.\"),\n            ),\n            Self::IdempotencyInFlight => (\n                StatusCode::CONFLICT,\n                \"idempotency_in_flight\",\n                Cow::Borrowed(\n                    \"An earlier request with this Idempotency-Key is still running. Retry shortly.\",\n                ),\n            ),\n            Self::IdempotencyReused => (\n                StatusCode::UNPROCESSABLE_ENTITY,\n                \"idempotency_key_reused\",\n                Cow::Borrowed(\n                    \"This Idempotency-Key was already used with a different request body.\",\n                ),\n            ),\n            // The only variant whose message is not static: it names the field\n            // the caller got wrong, which is information the caller supplied.\n            Self::Invalid(reason) => (\n                StatusCode::UNPROCESSABLE_ENTITY,\n                \"invalid_profile\",\n                Cow::Owned(reason.to_string()),\n            ),\n            Self::MissingCaller | Self::Store(_) => (\n                StatusCode::INTERNAL_SERVER_ERROR,\n                \"internal_error\",\n                Cow::Borrowed(\"An unexpected error occurred.\"),\n            ),\n        }\n    }\n}\n\nimpl IntoResponse for ProfileError {\n    fn into_response(self) -> Response {\n        let (status, error, message) = self.parts();\n\n        if status.is_server_error() {\n            tracing::error!(error = ?self, \"request failed\");\n        } else {\n            tracing::debug!(error = %self, \"request rejected\");\n        }\n\n        let body = Json(ErrorResponse {\n            error: Cow::Borrowed(error),\n            message,\n        });\n\n        // A 412 carries the current ETag so a client can retry without a\n        // separate round-trip to discover the version it lost to.\n        match self {\n            Self::PreconditionFailed { current_version } => {\n                (status, [(header::ETAG, current_version.to_string())], body).into_response()\n            }\n            _ => (status, body).into_response(),\n        }\n    }\n}\n"}, {"path": "crates/profile-service/src/idempotency.rs", "group": "profile-service", "lang": "rust", "lines": 271, "src": "//! Idempotency keys for `POST /profile`.\n//!\n//! A client whose request times out cannot tell whether the server processed it.\n//! Retrying is the only option, and without deduplication the retry gets `409`\n//! — indistinguishable from \"someone else created this profile\", which is a\n//! materially different fact. The client is left guessing about the state of\n//! its own write.\n//!\n//! An `Idempotency-Key` fixes that: the first request's outcome is recorded\n//! against the key and replayed verbatim for any retry carrying the same key.\n//! The retry then receives the original `201`, not a confusing `409`.\n//!\n//! Three cases have to be distinguished, and only the first is obvious.\n//!\n//! - **Key unseen** — reserve it, run the request, record the outcome.\n//! - **Key complete** — replay the recorded response.\n//! - **Key in flight** — the first request has not finished. Answering `409`\n//!   is correct and is *not* the same `409` as a duplicate profile, so it\n//!   carries its own error code.\n//!\n//! A fourth case matters for safety: the same key presented with a *different*\n//! body. That means the client reused a key it should not have, and replaying\n//! the first response would silently discard the second request. Refused with\n//! `422`.\n//!\n//! `PUT` needs none of this: `If-Match` already makes a retry idempotent,\n//! because the second attempt fails its precondition.\n\nuse std::collections::HashMap;\nuse std::hash::{DefaultHasher, Hash, Hasher};\nuse std::time::{Duration, Instant};\n\nuse parking_lot::Mutex;\n\n/// A recorded response, replayed for any retry of the same key.\n#[derive(Debug, Clone)]\npub struct Recorded {\n    /// Status of the original response.\n    pub status: u16,\n    /// Body of the original response, verbatim.\n    pub body: String,\n    /// `ETag` of the original response, if it carried one.\n    pub etag: Option\u003cString>,\n}\n\n/// What the store says about a key.\n#[derive(Debug, Clone)]\npub enum Lookup {\n    /// The key is newly reserved; the caller should do the work.\n    Reserved,\n    /// The key completed; replay this.\n    Replay(Recorded),\n    /// Another request holds this key right now.\n    InFlight,\n    /// The key was used before with a different request body.\n    BodyMismatch,\n}\n\n#[derive(Debug)]\nenum Entry {\n    InFlight {\n        fingerprint: u64,\n        since: Instant,\n    },\n    Complete {\n        fingerprint: u64,\n        at: Instant,\n        recorded: Recorded,\n    },\n}\n\nimpl Entry {\n    fn fingerprint(&self) -> u64 {\n        match self {\n            Self::InFlight { fingerprint, .. } | Self::Complete { fingerprint, .. } => *fingerprint,\n        }\n    }\n}\n\n/// Records the outcome of keyed requests for a bounded window.\n#[derive(Debug)]\npub struct IdempotencyStore {\n    entries: Mutex\u003cHashMap\u003c(String, String), Entry>>,\n    retention: Duration,\n    /// How long an in-flight reservation is honoured before it is assumed\n    /// abandoned. Without this, a request that panics mid-flight would wedge\n    /// its key until the process restarts.\n    reservation_timeout: Duration,\n}\n\nimpl IdempotencyStore {\n    /// How long a completed outcome stays replayable.\n    pub const DEFAULT_RETENTION: Duration = Duration::from_secs(86_400);\n    /// How long an unfinished request holds its key.\n    pub const DEFAULT_RESERVATION_TIMEOUT: Duration = Duration::from_secs(60);\n\n    /// Builds a store with the given windows.\n    #[must_use]\n    pub fn new(retention: Duration, reservation_timeout: Duration) -> Self {\n        Self {\n            entries: Mutex::new(HashMap::new()),\n            retention,\n            reservation_timeout,\n        }\n    }\n\n    /// Reserves `key` for `user`, or reports what is already known about it.\n    #[must_use]\n    pub fn begin(&self, user: &str, key: &str, body: &str) -> Lookup {\n        let fingerprint = fingerprint(body);\n        let mut entries = self.entries.lock();\n\n        self.expire(&mut entries);\n\n        let slot = (user.to_owned(), key.to_owned());\n\n        match entries.get(&slot) {\n            Some(entry) if entry.fingerprint() != fingerprint => Lookup::BodyMismatch,\n            Some(Entry::InFlight { .. }) => Lookup::InFlight,\n            Some(Entry::Complete { recorded, .. }) => Lookup::Replay(recorded.clone()),\n            None => {\n                entries.insert(\n                    slot,\n                    Entry::InFlight {\n                        fingerprint,\n                        since: Instant::now(),\n                    },\n                );\n                Lookup::Reserved\n            }\n        }\n    }\n\n    /// Records the outcome of a reserved key.\n    pub fn finish(&self, user: &str, key: &str, body: &str, recorded: Recorded) {\n        self.entries.lock().insert(\n            (user.to_owned(), key.to_owned()),\n            Entry::Complete {\n                fingerprint: fingerprint(body),\n                at: Instant::now(),\n                recorded,\n            },\n        );\n    }\n\n    /// Releases a reservation whose request failed, so a retry may proceed.\n    ///\n    /// Only failures the client can fix are released. A recorded terminal\n    /// response is never released, or a retry would re-run the work.\n    pub fn abandon(&self, user: &str, key: &str) {\n        let mut entries = self.entries.lock();\n        let slot = (user.to_owned(), key.to_owned());\n\n        if matches!(entries.get(&slot), Some(Entry::InFlight { .. })) {\n            entries.remove(&slot);\n        }\n    }\n\n    fn expire(&self, entries: &mut HashMap\u003c(String, String), Entry>) {\n        entries.retain(|_, entry| match entry {\n            Entry::InFlight { since, .. } => since.elapsed() \u003c self.reservation_timeout,\n            Entry::Complete { at, .. } => at.elapsed() \u003c self.retention,\n        });\n    }\n}\n\nimpl Default for IdempotencyStore {\n    fn default() -> Self {\n        Self::new(Self::DEFAULT_RETENTION, Self::DEFAULT_RESERVATION_TIMEOUT)\n    }\n}\n\n/// Fingerprints a request body so key reuse with different content is caught.\n///\n/// A hash, not the body itself: the store must not retain payloads it has no\n/// reason to keep. Collisions would let a mismatched retry replay the wrong\n/// response, but at 64 bits against the handful of bodies one client sends\n/// under one key, that is not a risk worth a cryptographic digest.\nfn fingerprint(body: &str) -> u64 {\n    let mut hasher = DefaultHasher::new();\n    body.hash(&mut hasher);\n    hasher.finish()\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    const BODY: &str = r#\"{\"address\":\"1 Main St\"}\"#;\n\n    fn recorded() -> Recorded {\n        Recorded {\n            status: 201,\n            body: BODY.to_owned(),\n            etag: Some(\"\\\"1\\\"\".to_owned()),\n        }\n    }\n\n    #[test]\n    fn a_fresh_key_is_reserved_then_replayed() {\n        let store = IdempotencyStore::default();\n\n        assert!(matches!(store.begin(\"u\", \"k\", BODY), Lookup::Reserved));\n        assert!(matches!(store.begin(\"u\", \"k\", BODY), Lookup::InFlight));\n\n        store.finish(\"u\", \"k\", BODY, recorded());\n\n        let Lookup::Replay(replayed) = store.begin(\"u\", \"k\", BODY) else {\n            panic!(\"a completed key must replay\");\n        };\n        assert_eq!(replayed.status, 201);\n    }\n\n    #[test]\n    fn reusing_a_key_with_a_different_body_is_refused() {\n        let store = IdempotencyStore::default();\n        let _ = store.begin(\"u\", \"k\", BODY);\n        store.finish(\"u\", \"k\", BODY, recorded());\n\n        assert!(matches!(\n            store.begin(\"u\", \"k\", r#\"{\"address\":\"somewhere else\"}\"#),\n            Lookup::BodyMismatch\n        ));\n    }\n\n    #[test]\n    fn keys_are_scoped_to_one_user() {\n        let store = IdempotencyStore::default();\n        let _ = store.begin(\"alice\", \"k\", BODY);\n\n        assert!(\n            matches!(store.begin(\"bob\", \"k\", BODY), Lookup::Reserved),\n            \"one caller's key must not collide with another's\"\n        );\n    }\n\n    #[test]\n    fn an_abandoned_reservation_frees_the_key() {\n        let store = IdempotencyStore::default();\n        let _ = store.begin(\"u\", \"k\", BODY);\n        store.abandon(\"u\", \"k\");\n\n        assert!(matches!(store.begin(\"u\", \"k\", BODY), Lookup::Reserved));\n    }\n\n    #[test]\n    fn a_recorded_outcome_survives_abandon() {\n        let store = IdempotencyStore::default();\n        let _ = store.begin(\"u\", \"k\", BODY);\n        store.finish(\"u\", \"k\", BODY, recorded());\n        store.abandon(\"u\", \"k\");\n\n        assert!(\n            matches!(store.begin(\"u\", \"k\", BODY), Lookup::Replay(_)),\n            \"a terminal response must never be released for re-execution\"\n        );\n    }\n\n    #[test]\n    fn a_stale_reservation_lapses() {\n        let store = IdempotencyStore::new(Duration::from_secs(60), Duration::from_millis(30));\n        let _ = store.begin(\"u\", \"k\", BODY);\n\n        std::thread::sleep(Duration::from_millis(60));\n\n        assert!(\n            matches!(store.begin(\"u\", \"k\", BODY), Lookup::Reserved),\n            \"a request that died mid-flight must not wedge its key\"\n        );\n    }\n}\n"}, {"path": "crates/profile-service/src/lib.rs", "group": "profile-service", "lang": "rust", "lines": 105, "src": "//! Profile service.\n//!\n//! Stores one profile per user, behind the authorization service. It never sees\n//! a bearer token: it trusts the shared internal secret checked by\n//! [`auth::require_internal_token`], and the user id header that check gates.\n//!\n//! The concurrency design is documented on [`store`], which is the part of this\n//! crate worth reading first.\n\npub mod auth;\npub mod config;\npub mod error;\npub mod idempotency;\npub mod routes;\npub mod store;\npub mod tracing_id;\n\nuse std::sync::Arc;\n\nuse axum::Router;\nuse axum::routing::{get, post};\nuse tower_http::trace::TraceLayer;\n\npub use config::{Backend, Config};\npub use error::ProfileError;\npub use idempotency::IdempotencyStore;\npub use store::{InMemoryProfiles, ProfileRepository, Revision, SqliteProfiles, Update};\n\n/// State shared by every handler.\n#[derive(Debug, Clone)]\npub struct AppState {\n    /// The profile store.\n    ///\n    /// A trait object so the backend is a deployment choice rather than a\n    /// compile-time one: the in-memory implementation for a single process, the\n    /// SQLite one wherever the version must be shared across replicas.\n    pub profiles: Arc\u003cdyn ProfileRepository>,\n    /// Shared secret the gateway must present.\n    pub internal_token: Arc\u003cstr>,\n    /// Deduplicates retried creates.\n    pub idempotency: Arc\u003cIdempotencyStore>,\n}\n\n/// Builds the service's HTTP router.\n///\n/// Every route sits behind [`auth::require_internal_token`], applied as a layer\n/// rather than called from each handler so a newly added route is protected by\n/// default instead of by remembering.\npub fn router(state: AppState) -> Router {\n    let protected = Router::new()\n        .route(\n            \"/profile\",\n            post(routes::profile::create)\n                .get(routes::profile::read)\n                .put(routes::profile::update),\n        )\n        .route(\"/profile/history\", get(routes::profile::history))\n        .layer(axum::middleware::from_fn_with_state(\n            state.clone(),\n            auth::gateway_guard,\n        ));\n\n    Router::new()\n        // Merged after the layer above, so the probe is reachable without the\n        // shared secret while everything else stays behind it.\n        .merge(protected)\n        .route(\"/health\", get(routes::health::health))\n        .layer(TraceLayer::new_for_http())\n        .with_state(state)\n}\n\n/// Resolves when the process is asked to stop.\n///\n/// Without this, `SIGTERM` from an orchestrator kills in-flight requests\n/// mid-write during every rolling deploy.\n///\n/// # Panics\n///\n/// Panics if the process cannot install a signal handler, which indicates the\n/// process lacks a capability it needs to run at all.\npub async fn shutdown_signal() {\n    let interrupt = async {\n        tokio::signal::ctrl_c()\n            .await\n            .expect(\"Ctrl+C handler must install\");\n    };\n\n    #[cfg(unix)]\n    let terminate = async {\n        tokio::signal::unix::signal(tokio::signal::unix::SignalKind::terminate())\n            .expect(\"SIGTERM handler must install\")\n            .recv()\n            .await;\n    };\n\n    #[cfg(not(unix))]\n    let terminate = std::future::pending::\u003c()>();\n\n    tokio::select! {\n        () = interrupt => {},\n        () = terminate => {},\n    }\n\n    tracing::info!(\"shutdown signal received, draining in-flight requests\");\n}\n"}, {"path": "crates/profile-service/src/main.rs", "group": "profile-service", "lang": "rust", "lines": 45, "src": "//! Binary entry point. All behaviour lives in the library target.\n\nuse std::error::Error;\nuse std::sync::Arc;\n\nuse profile_service::{\n    AppState, Backend, Config, IdempotencyStore, InMemoryProfiles, ProfileRepository,\n    SqliteProfiles,\n};\n\n#[tokio::main]\nasync fn main() -> Result\u003c(), Box\u003cdyn Error>> {\n    tracing_subscriber::fmt()\n        // `info`, not `info,tower_http=debug`. The debug default emitted two\n        // formatted lines per request — 320,000 lines across a 160,000-request\n        // run — and cost 25% of gateway throughput plus 0.6 ms of p50. It also\n        // fills a disk and puts request metadata in a log nobody meant to keep.\n        // Operators opt in with RUST_LOG when they are debugging.\n        .with_env_filter(\n            tracing_subscriber::EnvFilter::try_from_default_env().unwrap_or_else(|_| \"info\".into()),\n        )\n        .init();\n\n    let config = Config::from_env();\n\n    let profiles: Arc\u003cdyn ProfileRepository> = match config.backend {\n        Backend::Memory => Arc::new(InMemoryProfiles::new()),\n        Backend::Sqlite => Arc::new(SqliteProfiles::in_memory()?),\n    };\n\n    let state = AppState {\n        profiles,\n        internal_token: Arc::from(config.internal_token.as_str()),\n        idempotency: Arc::new(IdempotencyStore::default()),\n    };\n\n    let listener = tokio::net::TcpListener::bind(&config.bind_addr).await?;\n    tracing::info!(addr = config.bind_addr, backend = ?config.backend, \"profile-service listening\");\n\n    axum::serve(listener, profile_service::router(state))\n        .with_graceful_shutdown(profile_service::shutdown_signal())\n        .await?;\n\n    Ok(())\n}\n"}, {"path": "crates/profile-service/src/routes/health.rs", "group": "profile-service", "lang": "rust", "lines": 13, "src": "//! Liveness probe.\n\nuse axum::Json;\nuse serde_json::{Value, json};\n\n/// `GET /health` — deliberately outside the internal-token layer.\n///\n/// An orchestrator probing liveness is not the gateway and holds no shared\n/// secret. A probe that can fail for authorization reasons reports the wrong\n/// thing, and would take a healthy pod out of service on a token rotation.\npub async fn health() -> Json\u003cValue> {\n    Json(json!({ \"status\": \"ok\" }))\n}\n"}, {"path": "crates/profile-service/src/routes/mod.rs", "group": "profile-service", "lang": "rust", "lines": 4, "src": "//! HTTP handlers.\n\npub mod health;\npub mod profile;\n"}, {"path": "crates/profile-service/src/routes/profile.rs", "group": "profile-service", "lang": "rust", "lines": 229, "src": "//! Handlers for `/profile`.\n//!\n//! The concurrency contract lives in the status codes:\n//!\n//! | Request                     | Response                          |\n//! |-----------------------------|-----------------------------------|\n//! | `POST`, no profile yet      | `201` + `ETag: \"1\"`               |\n//! | `POST`, profile exists      | `409`                             |\n//! | `GET`                       | `200` + `ETag: \"n\"`, or `404`     |\n//! | `PUT`, no `If-Match`        | `428`                             |\n//! | `PUT`, `If-Match` stale     | `412` + `ETag: \"n\"` (the winner)  |\n//! | `PUT`, `If-Match` current   | `200` + `ETag: \"n+1\"`             |\n\nuse axum::Json;\nuse axum::extract::State;\nuse axum::http::{HeaderMap, StatusCode, header};\nuse axum::response::{IntoResponse, Response};\nuse common::dto::{Profile, ProfileInput};\nuse std::sync::Arc;\n\nuse common::{UserId, Version};\n\nuse crate::AppState;\nuse crate::auth::Caller;\nuse crate::error::ProfileError;\nuse crate::idempotency::{Lookup, Recorded};\nuse crate::store::{Revision, Update};\n\n/// Header carrying a client-chosen key that makes a retried create safe.\nconst IDEMPOTENCY_KEY: &str = \"idempotency-key\";\n\n/// `POST /profile` — create the calling user's profile.\n///\n/// Honours `Idempotency-Key`. Without one a timed-out client that retries\n/// cannot tell \"my create succeeded\" from \"someone else created this\", because\n/// both are `409`. With one, the retry replays the original response.\n///\n/// # Errors\n///\n/// [`ProfileError::Invalid`] if the payload fails validation,\n/// [`ProfileError::AlreadyExists`] if the user already has a profile,\n/// [`ProfileError::IdempotencyInFlight`] if an earlier request holds the same\n/// key, and [`ProfileError::IdempotencyReused`] if the key was used before with\n/// a different body.\npub async fn create(\n    State(state): State\u003cAppState>,\n    Caller(user_id): Caller,\n    request_headers: HeaderMap,\n    body: String,\n) -> Result\u003cResponse, ProfileError> {\n    let key = request_headers\n        .get(IDEMPOTENCY_KEY)\n        .and_then(|value| value.to_str().ok())\n        .filter(|key| !key.is_empty())\n        .map(str::to_owned);\n\n    // Reserve before doing anything, so two concurrent retries cannot both run.\n    if let Some(key) = &key {\n        match state.idempotency.begin(user_id.as_str(), key, &body) {\n            Lookup::Reserved => {}\n            Lookup::InFlight => return Err(ProfileError::IdempotencyInFlight),\n            Lookup::BodyMismatch => return Err(ProfileError::IdempotencyReused),\n            Lookup::Replay(recorded) => return Ok(replay(&recorded)),\n        }\n    }\n\n    let outcome = create_once(&state, &user_id, &body).await;\n\n    match (&outcome, &key) {\n        // A terminal outcome is recorded so the retry sees what the first\n        // caller saw. Everything else releases the key: a transient fault must\n        // not permanently consume it.\n        (Ok(recorded), Some(key)) => {\n            state\n                .idempotency\n                .finish(user_id.as_str(), key, &body, recorded.clone());\n        }\n        (Err(_), Some(key)) => state.idempotency.abandon(user_id.as_str(), key),\n        _ => {}\n    }\n\n    outcome.map(|recorded| replay(&recorded))\n}\n\n/// Performs one create, rendering the outcome in replayable form.\nasync fn create_once(\n    state: &AppState,\n    user_id: &UserId,\n    body: &str,\n) -> Result\u003cRecorded, ProfileError> {\n    let input: ProfileInput =\n        serde_json::from_str(body).map_err(|_| ProfileError::MalformedBody)?;\n    input.validate()?;\n\n    let created = state\n        .profiles\n        .create(user_id, input)\n        .await?\n        .ok_or(ProfileError::AlreadyExists)?;\n\n    tracing::info!(user_id = %user_id, \"profile created\");\n\n    Ok(Recorded {\n        status: StatusCode::CREATED.as_u16(),\n        etag: Some(created.version.to_string()),\n        body: serde_json::to_string(&created).map_err(|_| ProfileError::MalformedBody)?,\n    })\n}\n\n/// Renders a recorded outcome, whether it is being served for the first time or\n/// replayed for a retry. One function, so the two cannot drift.\nfn replay(recorded: &Recorded) -> Response {\n    let status = StatusCode::from_u16(recorded.status).unwrap_or(StatusCode::CREATED);\n    let mut response = Response::builder()\n        .status(status)\n        .header(header::CONTENT_TYPE, \"application/json\");\n\n    if let Some(etag) = &recorded.etag {\n        response = response.header(header::ETAG, etag);\n    }\n\n    response\n        .body(recorded.body.clone().into())\n        .unwrap_or_else(|_| StatusCode::INTERNAL_SERVER_ERROR.into_response())\n}\n\n/// `GET /profile` — read the calling user's profile.\n///\n/// # Errors\n///\n/// [`ProfileError::NotFound`] if the user has no profile.\npub async fn read(\n    State(state): State\u003cAppState>,\n    Caller(user_id): Caller,\n) -> Result\u003cimpl IntoResponse, ProfileError> {\n    let profile = state\n        .profiles\n        .get(&user_id)\n        .await?\n        .ok_or(ProfileError::NotFound)?;\n    Ok(with_etag(StatusCode::OK, profile))\n}\n\n/// `PUT /profile` — replace the calling user's profile, if unchanged.\n///\n/// Requires `If-Match` carrying the version the caller believes it is\n/// replacing. Without it a client cannot express \"I intend to overwrite exactly\n/// what I read\", and a lost update becomes indistinguishable from a successful\n/// one, so the header is mandatory rather than optional.\n///\n/// # Errors\n///\n/// [`ProfileError::PreconditionRequired`] without `If-Match`,\n/// [`ProfileError::MalformedPrecondition`] if it does not parse,\n/// [`ProfileError::PreconditionFailed`] if the version is stale, and\n/// [`ProfileError::NotFound`] if there is no profile to replace.\npub async fn update(\n    State(state): State\u003cAppState>,\n    Caller(user_id): Caller,\n    request_headers: HeaderMap,\n    Json(input): Json\u003cProfileInput>,\n) -> Result\u003cimpl IntoResponse, ProfileError> {\n    input.validate()?;\n    let expected = parse_if_match(&request_headers)?;\n\n    match state.profiles.update(&user_id, expected, input).await? {\n        Update::Applied(profile) => {\n            tracing::info!(user_id = %user_id, version = %profile.version, \"profile updated\");\n            Ok(with_etag(StatusCode::OK, profile))\n        }\n        Update::Stale { current_version } => {\n            tracing::info!(user_id = %user_id, expected = %expected, current = %current_version, \"update rejected as stale\");\n            Err(ProfileError::PreconditionFailed { current_version })\n        }\n        Update::Missing => Err(ProfileError::NotFound),\n    }\n}\n\n/// Attaches the profile's version as an `ETag`, so the client's next `PUT` can\n/// quote it back without guessing.\n///\n/// Takes the shared projection rather than an owned `Profile`: the store hands\n/// out an [`Arc`] so a read costs one refcount bump, and cloning it here to\n/// serialise would give that saving straight back.\nfn with_etag(status: StatusCode, profile: Arc\u003cProfile>) -> impl IntoResponse {\n    (\n        status,\n        [(header::ETAG, profile.version.to_string())],\n        Json(profile),\n    )\n}\n\n/// Reads the version out of an `If-Match` header.\n///\n/// The accepted syntax lives on [`Version`]'s [`FromStr`] impl, so this and the\n/// `ETag` it round-trips from cannot disagree.\n///\n/// [`FromStr`]: std::str::FromStr\nfn parse_if_match(headers: &HeaderMap) -> Result\u003cVersion, ProfileError> {\n    headers\n        .get(header::IF_MATCH)\n        .ok_or(ProfileError::PreconditionRequired)?\n        .to_str()\n        .ok()\n        .and_then(|raw| raw.parse().ok())\n        .ok_or(ProfileError::MalformedPrecondition)\n}\n\n/// `GET /profile/history` — every accepted revision, oldest first.\n///\n/// The audit view. A profile is a projection of its revisions, so this is the\n/// underlying record rather than a derived report: an address change is a fraud\n/// and KYC signal, and the prior value is evidence.\n///\n/// # Errors\n///\n/// [`ProfileError::NotFound`] if the user has no profile.\npub async fn history(\n    State(state): State\u003cAppState>,\n    Caller(user_id): Caller,\n) -> Result\u003cJson\u003cVec\u003cRevision>>, ProfileError> {\n    let revisions = state.profiles.history(&user_id).await?;\n\n    if revisions.is_empty() {\n        return Err(ProfileError::NotFound);\n    }\n\n    Ok(Json(revisions))\n}\n"}, {"path": "crates/profile-service/src/store/memory.rs", "group": "profile-service", "lang": "rust", "lines": 212, "src": "//! In-memory [`ProfileRepository`], the default backend.\n//!\n//! # Sharding\n//!\n//! ```text\n//! [ RwLock\u003cHashMap\u003cUserId, Arc\u003cRwLock\u003cRecord>>>> ; N ]\n//!   ^^^^^^                 ^^^^^^^^^^^^^^^^^^^^\n//!   one shard's structure  one profile's contents\n//! ```\n//!\n//! A single map behind one lock is correct, and it is also a single cache line\n//! that every core touches on every request. Even a *read* lock has to write\n//! the reader count, so the line bounces between cores and throughput stops\n//! scaling with them. Splitting the keyspace across shards means unrelated\n//! profiles rarely touch the same line.\n//!\n//! The per-entry lock then guards one profile's contents, so writers to\n//! different profiles never contend, and writers to the *same* profile\n//! serialise — the granularity the invariant needs and no more. The shard guard\n//! is released before the entry lock is taken (see [`InMemoryProfiles::slot`]);\n//! holding both would collapse this into a global lock wearing a disguise.\n//!\n//! # Reads take no lock at all\n//!\n//! [`Record`] keeps the current [`Profile`] in an [`ArcSwap`], rebuilt only when\n//! a write is accepted. A read is then a single atomic load — no lock, no\n//! allocation, and no readers blocking each other. Before this the address, the\n//! phone number and the id were each cloned to build a response, and every\n//! reader of a hot profile queued behind the same `RwLock`; with four workers on\n//! one key that lock, not the work, was the ceiling.\n//!\n//! Writers still serialise on the revisions mutex, which is what keeps the\n//! compare-and-swap atomic: the version is read and the new projection is\n//! published under one hold, so no two writers can both believe they won. A\n//! reader concurrent with a write sees either the old projection or the new\n//! one, never a mix.\n//!\n//! The cost is one duplicated copy of two short strings per profile — the\n//! current projection and the newest revision hold the same values. That is the\n//! right trade for a read-heavy store.\n//!\n//! # Why `parking_lot` and not `std::sync`\n//!\n//! `std` locks poison on panic, and a poisoned entry lock would make one\n//! account permanently unreadable until the process restarts — a customer\n//! locked out of their own record by an unrelated bug. `parking_lot` does not\n//! poison, which removes the failure mode rather than arguing that the critical\n//! sections cannot panic. Neither crate's guards may be held across an\n//! `.await`; none here are.\n\nuse std::collections::HashMap;\nuse std::collections::hash_map::Entry;\nuse std::hash::BuildHasher;\nuse std::sync::Arc;\n\nuse arc_swap::ArcSwap;\nuse async_trait::async_trait;\nuse common::dto::{Profile, ProfileInput};\nuse common::{UserId, Version};\nuse parking_lot::{Mutex, RwLock};\nuse rustc_hash::FxBuildHasher;\n\nuse super::{ProfileRepository, Revision, StoreError, Update, project, revision};\n\n/// A profile's full history, plus the projection readers are handed.\n#[derive(Debug)]\nstruct Record {\n    /// Read without any lock; replaced wholesale by a writer.\n    current: ArcSwap\u003cProfile>,\n    /// Held by writers for the whole compare-and-swap, and by the audit read.\n    revisions: Mutex\u003cVec\u003cRevision>>,\n}\
