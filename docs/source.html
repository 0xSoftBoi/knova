<script>
(function () {
  var FILES = window.__FILES__, STATS = window.__STATS__;
  var tree = document.getElementById('tree'), view = document.getElementById('view');
  var pathEl = document.getElementById('path'), metaEl = document.getElementById('meta');
  var copyBtn = document.getElementById('copy'), filterEl = document.getElementById('filter');
  var current = null;

  document.getElementById('s-files').textContent = STATS.files;
  document.getElementById('s-lines').textContent = STATS.lines.toLocaleString();
  document.getElementById('s-tests').textContent = STATS.tests.toLocaleString();

  var KEYWORDS = ('as async await break const continue crate dyn else enum extern fn for if impl in let loop ' +
    'match mod move mut pub ref return self Self static struct super trait type unsafe use where while').split(' ');
  var KW = Object.create(null);
  KEYWORDS.forEach(function (k) { KW[k] = 1; });

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // One master regex, alternation ordered so a keyword inside a string or
  // comment is never matched as a keyword. That ordering is the whole trick.
  var RUST = new RegExp([
    '(\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/)',            // 1 comment
    '(r#+"[\\s\\S]*?"#+|r"[^"]*"|"(?:[^"\\\\]|\\\\[\\s\\S])*")', // 2 string
    "('(?:\\\\.|[^'\\\\])')",                              // 3 char
    "('[a-z_][A-Za-z0-9_]*)",                              // 4 lifetime
    '(#!?\\[[\\s\\S]*?\\])',                             // 5 attribute
    '(\\b\\d[0-9_]*(?:\\.[0-9_]+)?(?:[iuf](?:8|16|32|64|128|size))?\\b)', // 6 number
    '([A-Za-z_][A-Za-z0-9_]*!)',                         // 7 macro
    '([A-Za-z_][A-Za-z0-9_]*)'                           // 8 ident
  ].join('|'), 'g');

  function rust(src) {
    var out = '', last = 0, m;
    RUST.lastIndex = 0;
    while ((m = RUST.exec(src)) !== null) {
      out += esc(src.slice(last, m.index));
      var t = m[0], cls;
      if (m[1]) cls = 'cm';
      else if (m[2]) cls = 'st';
      else if (m[3]) cls = 'st';
      else if (m[4]) cls = 'ty';
      else if (m[5]) cls = 'at';
      else if (m[6]) cls = 'nu';
      else if (m[7]) cls = 'mc';
      else if (KW[t]) cls = 'kw';
      else if (/^[A-Z]/.test(t)) cls = 'ty';
      else cls = null;
      out += cls ? '<span class="' + cls + '">' + esc(t) + '</span>' : esc(t);
      last = m.index + t.length;
    }
    return out + esc(src.slice(last));
  }

  var TOML = /(#[^\n]*)|("(?:[^"\\]|\\[\s\S])*")|(^\s*\[[^\]\n]*\])|(^\s*[A-Za-z0-9_.-]+(?=\s*=))/gm;
  function toml(src) {
    var out = '', last = 0, m;
    TOML.lastIndex = 0;
    while ((m = TOML.exec(src)) !== null) {
      out += esc(src.slice(last, m.index));
      var t = m[0];
      var cls = m[1] ? 'cm' : m[2] ? 'st' : m[3] ? 'hd' : 'key';
      out += '<span class="' + cls + '">' + esc(t) + '</span>';
      last = m.index + t.length;
    }
    return out + esc(src.slice(last));
  }

  var MD = /(^```[\s\S]*?^```)|(^#{1,6} [^\n]*)|(`[^`\n]+`)|(\*\*[^*\n]+\*\*)/gm;
  function md(src) {
    var out = '', last = 0, m;
    MD.lastIndex = 0;
    while ((m = MD.exec(src)) !== null) {
      out += esc(src.slice(last, m.index));
      var t = m[0];
      var cls = m[1] ? 'st' : m[2] ? 'hd' : m[3] ? 'mc' : 'kw';
      out += '<span class="' + cls + '">' + esc(t) + '</span>';
      last = m.index + t.length;
    }
    return out + esc(src.slice(last));
  }

  function highlight(file) {
    if (file.lang === 'rust') return rust(file.src);
    if (file.lang === 'toml') return toml(file.src);
    return md(file.src);
  }

  var LABEL = {
    workspace: 'workspace root',
    common: 'crates/common',
    'auth-service': 'crates/auth-service',
    'profile-service': 'crates/profile-service'
  };

  function buildTree(needle) {
    tree.innerHTML = '';
    var seen = null, shown = 0;
    FILES.forEach(function (f, i) {
      if (needle && f.path.toLowerCase().indexOf(needle) === -1) return;
      if (f.group !== seen) {
        seen = f.group;
        var h = document.createElement('div');
        h.className = 'grp';
        h.textContent = LABEL[f.group] || f.group;
        tree.appendChild(h);
      }
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'f' + (/\/tests\//.test(f.path) ? ' test' : '') + (current === i ? ' on' : '');
      b.dataset.i = i;
      var name = f.path.split('/').pop();
      b.innerHTML = '<span class="n"></span><span class="ln"></span>';
      b.querySelector('.n').textContent = name;
      b.querySelector('.ln').textContent = f.lines;
      b.addEventListener('click', function () { open(i); });
      tree.appendChild(b);
      shown++;
    });
    if (!shown) {
      var empty = document.createElement('div');
      empty.className = 'grp';
      empty.textContent = 'no files match';
      tree.appendChild(empty);
    }
  }

  function open(i) {
    current = i;
    var f = FILES[i];
    var parts = f.path.split('/');
    var name = parts.pop();
    pathEl.innerHTML = '<span>' + esc(parts.join('/') + (parts.length ? '/' : '')) + '</span>' + esc(name);
    metaEl.textContent = f.lines + ' LINES';
    copyBtn.hidden = false;
    copyBtn.textContent = 'COPY';

    // Trim one trailing newline so a 334-line file renders 334 rows, not 335.
    var body = f.src.charAt(f.src.length - 1) === '\n' ? 1 : 0;
    var lines = highlight(f).split('\n');
    if (body) lines.pop();
    var rows = lines.map(function (line, n) {
      return '<tr id="L' + (n + 1) + '"><td class="g">' + (n + 1) + '</td><td class="l">' +
        (line || '​') + '</td></tr>';
    }).join('');
    view.innerHTML = '<table class="code"><tbody>' + rows + '</tbody></table>';
    view.scrollTop = 0;

    buildTree(filterEl.value.trim().toLowerCase());
    try { localStorage.setItem('knova-file', f.path); } catch (e) {}
  }

  function overview() {
    current = null;
    pathEl.textContent = 'Overview';
    metaEl.textContent = '';
    copyBtn.hidden = true;
    view.innerHTML = document.getElementById('intro-tpl').innerHTML;
    view.querySelectorAll('.start button').forEach(function (b) {
      b.addEventListener('click', function () {
        var want = b.dataset.path;
        for (var i = 0; i < FILES.length; i++) {
          if (FILES[i].path === want) { open(i); return; }
        }
      });
    });
    buildTree(filterEl.value.trim().toLowerCase());
  }

  copyBtn.addEventListener('click', function () {
    if (current === null) return;
    var src = FILES[current].src;
    var done = function () { copyBtn.textContent = 'COPIED'; setTimeout(function () { copyBtn.textContent = 'COPY'; }, 1600); };
    var failed = function () { copyBtn.textContent = 'SELECT + ⌘C'; setTimeout(function () { copyBtn.textContent = 'COPY'; }, 2400); };
