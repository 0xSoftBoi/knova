n\ntype Shard = RwLock\u003cHashMap\u003cUserId, Arc\u003cRecord>, FxBuildHasher>>;\n\n/// Profiles held in memory, keyed by owner across a fixed set of shards.\n#[derive(Debug)]\npub struct InMemoryProfiles {\n    shards: Box\u003c[Shard]>,\n    /// `shards.len() - 1`; the length is a power of two so this masks instead\n    /// of dividing.\n    mask: usize,\n}\n\nimpl InMemoryProfiles {\n    /// Creates an empty store sized to the machine.\n    #[must_use]\n    pub fn new() -> Self {\n        Self::with_shards(default_shards())\n    }\n\n    /// Creates an empty store with `shards` rounded up to a power of two.\n    ///\n    /// Exposed so a test can pin the count; production should use [`Self::new`].\n    #[must_use]\n    pub fn with_shards(shards: usize) -> Self {\n        let count = shards.max(1).next_power_of_two();\n        Self {\n            shards: (0..count).map(|_| Shard::default()).collect(),\n            mask: count - 1,\n        }\n    }\n\n    /// The shard owning `user_id`.\n    fn shard(&self, user_id: &UserId) -> &Shard {\n        // Take the high bits: `FxHash`'s low bits are the least mixed, and the\n        // mask would otherwise select shards on exactly those.\n        #[allow(clippy::cast_possible_truncation)]\n        let index = (FxBuildHasher.hash_one(user_id) >> 32) as usize & self.mask;\n        &self.shards[index]\n    }\n\n    /// Reads the current projection without awaiting.\n    ///\n    /// The real implementation; the trait method is a thin wrapper. Nothing\n    /// here can block, so the async signature the trait needs — for backends\n    /// that do I/O — costs a boxed future per call that this path does not\n    /// need. Exposed so the hot read can skip it where the concrete type is\n    /// known, and so a benchmark can price that box.\n    #[must_use]\n    pub fn read(&self, user_id: &UserId) -> Option\u003cArc\u003cProfile>> {\n        self.slot(user_id).map(|slot| slot.current.load_full())\n    }\n\n    /// Looks up one profile's lock, releasing the shard guard before returning.\n    ///\n    /// The temporary scope is the point: the shard guard must not outlive this\n    /// function, or callers would hold it while waiting on the per-profile lock.\n    fn slot(&self, user_id: &UserId) -> Option\u003cArc\u003cRecord>> {\n        self.shard(user_id).read().get(user_id).map(Arc::clone)\n    }\n}\n\nimpl Default for InMemoryProfiles {\n    fn default() -> Self {\n        Self::new()\n    }\n}\n\n/// Four shards per core, which keeps unrelated keys off each other's cache\n/// lines without spending a lock per profile.\nfn default_shards() -> usize {\n    std::thread::available_parallelism().map_or(8, std::num::NonZero::get) * 4\n}\n\n#[async_trait]\nimpl ProfileRepository for InMemoryProfiles {\n    async fn create(\n        &self,\n        user_id: &UserId,\n        input: ProfileInput,\n    ) -> Result\u003cOption\u003cArc\u003cProfile>>, StoreError> {\n        let mut shard = self.shard(user_id).write();\n\n        match shard.entry(user_id.clone()) {\n            Entry::Occupied(_) => Ok(None),\n            Entry::Vacant(slot) => {\n                let first = revision(Version::INITIAL, input);\n                let current = Arc::new(project(user_id, &first));\n                slot.insert(Arc::new(Record {\n                    current: ArcSwap::new(Arc::clone(&current)),\n                    revisions: Mutex::new(vec![first]),\n                }));\n                Ok(Some(current))\n            }\n        }\n    }\n\n    async fn get(&self, user_id: &UserId) -> Result\u003cOption\u003cArc\u003cProfile>>, StoreError> {\n        Ok(self.read(user_id))\n    }\n\n    async fn update(\n        &self,\n        user_id: &UserId,\n        expected_version: Version,\n        input: ProfileInput,\n    ) -> Result\u003cUpdate, StoreError> {\n        let Some(slot) = self.slot(user_id) else {\n            return Ok(Update::Missing);\n        };\n\n        // Every writer takes this, so the version read below and the publish\n        // that follows happen under one hold. That is what makes the version\n        // test meaningful rather than decorative — no second writer can slip\n        // between them and have both believe they won.\n        let mut revisions = slot.revisions.lock();\n        let current_version = slot.current.load().version;\n\n        if current_version != expected_version {\n            return Ok(Update::Stale { current_version });\n        }\n\n        let next = current_version\n            .checked_next()\n            .ok_or(StoreError::VersionExhausted)?;\n\n        let applied = revision(next, input);\n        let current = Arc::new(project(user_id, &applied));\n        revisions.push(applied);\n        slot.current.store(Arc::clone(&current));\n\n        Ok(Update::Applied(current))\n    }\n\n    async fn history(&self, user_id: &UserId) -> Result\u003cVec\u003cRevision>, StoreError> {\n        Ok(self\n            .slot(user_id)\n            .map(|slot| slot.revisions.lock().clone())\n            .unwrap_or_default())\n    }\n}\n"}, {"path": "crates/profile-service/src/store/mod.rs", "group": "profile-service", "lang": "rust", "lines": 186, "src": "//! Profile storage.\n//!\n//! # The three hazards, and which mechanism handles each\n//!\n//! **Data races.** Two threads mutating the same bytes without synchronisation.\n//! Rust rules these out at compile time. This costs no design effort and is not\n//! the interesting part.\n//!\n//! **Torn writes.** A reader observing a profile with the new address beside the\n//! old phone number. Any lock around the whole record prevents this.\n//!\n//! **Lost updates.** The one that matters, and the one **no lock can fix**. Two\n//! clients read version 4, both edit, both write. The second silently erases\n//! the first and *both* receive `200`. The window spans two round-trips with\n//! human think-time in between, so holding a lock across it is not an option.\n//!\n//! The answer is optimistic concurrency control: every record carries a\n//! [`Version`], a writer states the version it believes it is replacing, and\n//! the store refuses the write if that belief is stale.\n//!\n//! # Why this is a trait\n//!\n//! Because the guarantee has to outlive the `HashMap`. A single-process store\n//! makes `If-Match: \"4\"` meaningful only to the instance that issued version 4;\n//! behind a load balancer with three replicas there are three divergent\n//! histories and the guarantee is void. Expressing storage as a trait forces\n//! the concurrency contract to be stated independently of where the bytes live,\n//! and [`sqlite`] demonstrates that the same contract holds when it is a real\n//! `UPDATE ... WHERE version = ?` with a row-count check.\n//!\n//! Both implementations pass the same conformance suite\n//! (`tests/repository_conformance.rs`), which is the actual evidence that the\n//! design is not coupled to one backend.\n\npub mod memory;\npub mod sqlite;\n\nuse std::sync::Arc;\n\nuse async_trait::async_trait;\nuse common::dto::{Profile, ProfileInput};\nuse common::{UserId, Version};\nuse serde::{Deserialize, Serialize};\n\npub use memory::InMemoryProfiles;\npub use sqlite::SqliteProfiles;\n\n/// One accepted write, retained permanently.\n///\n/// A profile is a projection of its revisions, not a cell that gets\n/// overwritten. An address change is a fraud and KYC signal, so discarding the\n/// prior value destroys evidence a bank is required to keep.\n#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]\npub struct Revision {\n    /// The version this write produced.\n    pub version: Version,\n    /// The address as of this revision.\n    pub address: String,\n    /// The phone number as of this revision.\n    pub phone_number: String,\n    /// When the write was accepted, in milliseconds since the Unix epoch.\n    pub recorded_at_ms: u64,\n}\n\n/// Result of an attempted update.\n///\n/// A dedicated enum rather than `Result\u003cProfile, _>`, because \"your version was\n/// stale\" is an ordinary expected outcome the caller translates into `412`, not\n/// an error condition.\n#[derive(Debug, Clone, PartialEq, Eq)]\npub enum Update {\n    /// The write was applied; contains the profile at its new version.\n    Applied(Arc\u003cProfile>),\n    /// The caller's `If-Match` version did not match the stored one.\n    Stale {\n        /// The version actually stored, so the client can re-read and retry.\n        current_version: Version,\n    },\n    /// No profile exists for this user.\n    Missing,\n}\n\n/// Why a storage operation could not complete.\n#[derive(Debug, thiserror::Error)]\npub enum StoreError {\n    /// The version counter cannot be incremented further.\n    ///\n    /// Unreachable in any real deployment, but a hard failure rather than a\n    /// saturating increment: at saturation every stale version would silently\n    /// become valid again, which is a correctness failure rather than a\n    /// capacity one.\n    #[error(\"version counter exhausted\")]\n    VersionExhausted,\n\n    /// The backend itself failed.\n    #[error(\"storage backend failed\")]\n    Backend(#[source] Box\u003cdyn std::error::Error + Send + Sync>),\n}\n\n/// Storage for profiles, with compare-and-swap update semantics.\n///\n/// Implementations must guarantee that [`Self::update`] compares the stored\n/// version and writes atomically with respect to other updates of the same\n/// profile. Everything the service promises rests on that.\n#[async_trait]\npub trait ProfileRepository: std::fmt::Debug + Send + Sync + 'static {\n    /// Creates a profile at [`Version::INITIAL`], or returns [`None`] if one\n    /// already exists.\n    ///\n    /// The existence check and the insert must be atomic, so two concurrent\n    /// creates cannot both succeed.\n    ///\n    /// # Errors\n    ///\n    /// [`StoreError::Backend`] if the backend fails.\n    async fn create(\n        &self,\n        user_id: &UserId,\n        input: ProfileInput,\n    ) -> Result\u003cOption\u003cArc\u003cProfile>>, StoreError>;\n\n    /// Reads the current projection of a profile.\n    ///\n    /// # Errors\n    ///\n    /// [`StoreError::Backend`] if the backend fails.\n    async fn get(&self, user_id: &UserId) -> Result\u003cOption\u003cArc\u003cProfile>>, StoreError>;\n\n    /// Replaces a profile only if it is still at `expected_version`.\n    ///\n    /// # Errors\n    ///\n    /// [`StoreError::VersionExhausted`] if the counter cannot advance, or\n    /// [`StoreError::Backend`] if the backend fails.\n    async fn update(\n        &self,\n        user_id: &UserId,\n        expected_version: Version,\n        input: ProfileInput,\n    ) -> Result\u003cUpdate, StoreError>;\n\n    /// Every accepted write for this profile, oldest first.\n    ///\n    /// # Errors\n    ///\n    /// [`StoreError::Backend`] if the backend fails.\n    async fn history(&self, user_id: &UserId) -> Result\u003cVec\u003cRevision>, StoreError>;\n}\n\n/// Wall-clock milliseconds since the Unix epoch.\n///\n/// Audit timestamps are for humans reading a history, not for ordering: the\n/// [`Version`] sequence is what orders revisions, and it does not depend on a\n/// clock that can step backwards.\npub(crate) fn now_ms() -> u64 {\n    use std::time::{SystemTime, UNIX_EPOCH};\n\n    SystemTime::now()\n        .duration_since(UNIX_EPOCH)\n        .map_or(0, |elapsed| {\n            u64::try_from(elapsed.as_millis()).unwrap_or(u64::MAX)\n        })\n}\n\n/// Builds the projection a client sees from a revision.\n///\n/// Called once per accepted write, never per read: the result is retained as an\n/// [`Arc`] so readers share it.\npub(crate) fn project(user_id: &UserId, revision: &Revision) -> Profile {\n    Profile {\n        user_id: user_id.clone(),\n        address: revision.address.clone(),\n        phone_number: revision.phone_number.clone(),\n        version: revision.version,\n    }\n}\n\n/// Builds the revision an accepted write produces.\npub(crate) fn revision(version: Version, input: ProfileInput) -> Revision {\n    Revision {\n        version,\n        address: input.address,\n        phone_number: input.phone_number,\n        recorded_at_ms: now_ms(),\n    }\n}\n"}, {"path": "crates/profile-service/src/store/sqlite.rs", "group": "profile-service", "lang": "rust", "lines": 335, "src": "//! SQLite-backed [`ProfileRepository`].\n//!\n//! Exists to demonstrate that the concurrency contract is a property of the\n//! *design*, not of the `HashMap`. The compare-and-swap that\n//! [`memory`](super::memory) performs with a version check under a write lock\n//! is here a single statement:\n//!\n//! ```sql\n//! UPDATE profiles SET address = ?, phone_number = ?, version = ?\n//!  WHERE user_id = ? AND version = ?\n//! ```\n//!\n//! The row count decides the outcome. One row means the caller's version was\n//! current and the write landed. Zero rows means either the profile is gone or\n//! someone else got there first — indistinguishable from the count alone, which\n//! is why the follow-up read happens inside the same transaction.\n//!\n//! That statement is what makes horizontal scaling possible: the version lives\n//! in shared storage, so `If-Match: \"4\"` means the same thing to every replica.\n//! The in-memory backend cannot say that, and swapping this in is the whole\n//! remedy. Point it at Postgres and nothing above this module changes.\n//!\n//! # Blocking\n//!\n//! `rusqlite` is a blocking driver, so every method hops to\n//! [`tokio::task::spawn_blocking`] — the same reasoning as the Argon2 path in\n//! the authorization service. Putting that inside the implementation rather\n//! than in the handlers means the in-memory backend, which never blocks, pays\n//! nothing for it.\n//!\n//! The connection is behind one mutex because an in-memory SQLite database\n//! belongs to a single connection. A file or server backend would take a pool\n//! instead; that is a change to this module and nothing else.\n\nuse std::sync::Arc;\n\nuse async_trait::async_trait;\nuse common::dto::{Profile, ProfileInput};\nuse common::{UserId, Version};\nuse parking_lot::Mutex;\nuse rusqlite::{Connection, OptionalExtension, params};\n\nuse super::{ProfileRepository, Revision, StoreError, Update, now_ms};\n\nconst SCHEMA: &str = \"\n    PRAGMA foreign_keys = ON;\n\n    CREATE TABLE IF NOT EXISTS profiles (\n        user_id      TEXT PRIMARY KEY,\n        address      TEXT    NOT NULL,\n        phone_number TEXT    NOT NULL,\n        version      INTEGER NOT NULL\n    );\n\n    -- Append-only. The row in `profiles` is a projection of these; nothing ever\n    -- updates or deletes here, which is what makes the history admissible.\n    CREATE TABLE IF NOT EXISTS profile_revisions (\n        user_id        TEXT    NOT NULL,\n        version        INTEGER NOT NULL,\n        address        TEXT    NOT NULL,\n        phone_number   TEXT    NOT NULL,\n        recorded_at_ms INTEGER NOT NULL,\n        PRIMARY KEY (user_id, version)\n    );\n\";\n\n/// Profiles stored in SQLite.\n#[derive(Debug)]\npub struct SqliteProfiles {\n    connection: Arc\u003cMutex\u003cConnection>>,\n}\n\nimpl SqliteProfiles {\n    /// Opens an in-memory database, as the brief calls for.\n    ///\n    /// # Errors\n    ///\n    /// [`StoreError::Backend`] if the database cannot be opened or migrated.\n    pub fn in_memory() -> Result\u003cSelf, StoreError> {\n        Self::from_connection(Connection::open_in_memory().map_err(backend)?)\n    }\n\n    /// Opens a database file, which is the same store with durability.\n    ///\n    /// # Errors\n    ///\n    /// [`StoreError::Backend`] if the file cannot be opened or migrated.\n    pub fn open(path: &str) -> Result\u003cSelf, StoreError> {\n        Self::from_connection(Connection::open(path).map_err(backend)?)\n    }\n\n    fn from_connection(connection: Connection) -> Result\u003cSelf, StoreError> {\n        connection.execute_batch(SCHEMA).map_err(backend)?;\n        Ok(Self {\n            connection: Arc::new(Mutex::new(connection)),\n        })\n    }\n\n    /// Runs `work` on the blocking pool with exclusive use of the connection.\n    async fn with_connection\u003cT, F>(&self, work: F) -> Result\u003cT, StoreError>\n    where\n        T: Send + 'static,\n        F: FnOnce(&mut Connection) -> Result\u003cT, StoreError> + Send + 'static,\n    {\n        let connection = Arc::clone(&self.connection);\n\n        tokio::task::spawn_blocking(move || work(&mut connection.lock()))\n            .await\n            .map_err(|join| StoreError::Backend(Box::new(join)))?\n    }\n}\n\n#[async_trait]\nimpl ProfileRepository for SqliteProfiles {\n    async fn create(\n        &self,\n        user_id: &UserId,\n        input: ProfileInput,\n    ) -> Result\u003cOption\u003cArc\u003cProfile>>, StoreError> {\n        let owner = user_id.clone();\n\n        self.with_connection(move |connection| {\n            let transaction = connection.transaction().map_err(backend)?;\n            let version = Version::INITIAL;\n            let recorded_at_ms = now_ms();\n\n            // `INSERT OR IGNORE` on the primary key makes the existence check\n            // and the insert one atomic step, so two concurrent creates cannot\n            // both succeed.\n            let inserted = transaction\n                .execute(\n                    \"INSERT OR IGNORE INTO profiles (user_id, address, phone_number, version)\n                     VALUES (?1, ?2, ?3, ?4)\",\n                    params![\n                        owner.as_str(),\n                        input.address,\n                        input.phone_number,\n                        to_sql(version)?\n                    ],\n                )\n                .map_err(backend)?;\n\n            if inserted == 0 {\n                return Ok(None);\n            }\n\n            transaction\n                .execute(\n                    \"INSERT INTO profile_revisions\n                        (user_id, version, address, phone_number, recorded_at_ms)\n                     VALUES (?1, ?2, ?3, ?4, ?5)\",\n                    params![\n                        owner.as_str(),\n                        to_sql(version)?,\n                        input.address,\n                        input.phone_number,\n                        recorded_at_ms\n                    ],\n                )\n                .map_err(backend)?;\n\n            transaction.commit().map_err(backend)?;\n\n            Ok(Some(Arc::new(Profile {\n                user_id: owner,\n                address: input.address,\n                phone_number: input.phone_number,\n                version,\n            })))\n        })\n        .await\n    }\n\n    async fn get(&self, user_id: &UserId) -> Result\u003cOption\u003cArc\u003cProfile>>, StoreError> {\n        let owner = user_id.clone();\n\n        self.with_connection(move |connection| {\n            connection\n                .query_row(\n                    \"SELECT address, phone_number, version FROM profiles WHERE user_id = ?1\",\n                    params![owner.as_str()],\n                    |row| {\n                        Ok(Profile {\n                            user_id: owner.clone(),\n                            address: row.get(0)?,\n                            phone_number: row.get(1)?,\n                            version: from_sql(row.get(2)?),\n                        })\n                    },\n                )\n                .optional()\n                .map(|found| found.map(Arc::new))\n                .map_err(backend)\n        })\n        .await\n    }\n\n    async fn update(\n        &self,\n        user_id: &UserId,\n        expected_version: Version,\n        input: ProfileInput,\n    ) -> Result\u003cUpdate, StoreError> {\n        let owner = user_id.clone();\n\n        self.with_connection(move |connection| {\n            // IMMEDIATE takes the write lock up front, so the follow-up read\n            // that distinguishes \"stale\" from \"missing\" cannot race another\n            // writer between the UPDATE and the SELECT.\n            let transaction = connection\n                .transaction_with_behavior(rusqlite::TransactionBehavior::Immediate)\n                .map_err(backend)?;\n\n            let next = expected_version\n                .checked_next()\n                .ok_or(StoreError::VersionExhausted)?;\n\n            let changed = transaction\n                .execute(\n                    \"UPDATE profiles\n                        SET address = ?1, phone_number = ?2, version = ?3\n                      WHERE user_id = ?4 AND version = ?5\",\n                    params![\n                        input.address,\n                        input.phone_number,\n                        to_sql(next)?,\n                        owner.as_str(),\n                        to_sql(expected_version)?\n                    ],\n                )\n                .map_err(backend)?;\n\n            if changed == 0 {\n                // Zero rows means the version did not match, or there is no\n                // such profile. Only a read tells them apart.\n                let current: Option\u003ci64> = transaction\n                    .query_row(\n                        \"SELECT version FROM profiles WHERE user_id = ?1\",\n                        params![owner.as_str()],\n                        |row| row.get(0),\n                    )\n                    .optional()\n                    .map_err(backend)?;\n\n                return Ok(match current {\n                    Some(raw) => Update::Stale {\n                        current_version: from_sql(raw),\n                    },\n                    None => Update::Missing,\n                });\n            }\n\n            transaction\n                .execute(\n                    \"INSERT INTO profile_revisions\n                        (user_id, version, address, phone_number, recorded_at_ms)\n                     VALUES (?1, ?2, ?3, ?4, ?5)\",\n                    params![\n                        owner.as_str(),\n                        to_sql(next)?,\n                        input.address,\n                        input.phone_number,\n                        now_ms()\n                    ],\n                )\n                .map_err(backend)?;\n\n            transaction.commit().map_err(backend)?;\n\n            Ok(Update::Applied(Arc::new(Profile {\n                user_id: owner,\n                address: input.address,\n                phone_number: input.phone_number,\n                version: next,\n            })))\n        })\n        .await\n    }\n\n    async fn history(&self, user_id: &UserId) -> Result\u003cVec\u003cRevision>, StoreError> {\n        let owner = user_id.clone();\n\n        self.with_connection(move |connection| {\n            let mut statement = connection\n                .prepare(\n                    \"SELECT version, address, phone_number, recorded_at_ms\n                       FROM profile_revisions\n                      WHERE user_id = ?1\n                   ORDER BY version ASC\",\n                )\n                .map_err(backend)?;\n\n            let revisions = statement\n                .query_map(params![owner.as_str()], |row| {\n                    Ok(Revision {\n                        version: from_sql(row.get(0)?),\n                        address: row.get(1)?,\n                        phone_number: row.get(2)?,\n                        recorded_at_ms: row.get(3)?,\n                    })\n                })\n                .map_err(backend)?\n                .collect::\u003cResult\u003cVec\u003c_>, _>>()\n                .map_err(backend)?;\n\n            Ok(revisions)\n        })\n        .await\n    }\n}\n\n/// Wraps a driver error, keeping the cause for logs and out of responses.\nfn backend\u003cE>(source: E) -> StoreError\nwhere\n    E: std::error::Error + Send + Sync + 'static,\n{\n    StoreError::Backend(Box::new(source))\n}\n\n/// SQLite's INTEGER is signed, so versions are stored as `i64`.\n///\n/// The conversion cannot fail below 2^63 writes to a single profile; treating\n/// it as exhaustion rather than wrapping keeps the failure mode identical to\n/// [`Version::checked_next`].\nfn to_sql(version: Version) -> Result\u003ci64, StoreError> {\n    i64::try_from(version.get()).map_err(|_| StoreError::VersionExhausted)\n}\n\n/// Rebuilds a version from a stored counter, clamping a negative value to zero.\n///\n/// A negative version can only mean the row was written by something other than\n/// this service; zero then fails every `If-Match`, which fails closed.\nfn from_sql(raw: i64) -> Version {\n    Version::from_counter(u64::try_from(raw).unwrap_or(0))\n}\n"}, {"path": "crates/profile-service/src/tracing_id.rs", "group": "profile-service", "lang": "rust", "lines": 37, "src": "//! Adopting the request id the gateway assigned.\n//!\n//! This service never mints one. If a request arrives without an id it did not\n//! come through the gateway, and the internal-token check will refuse it a\n//! moment later — so an absent id is a signal, not something to paper over with\n//! a fresh value that correlates with nothing.\n//!\n//! These are helpers rather than a middleware of their own: see\n//! [`auth::gateway_guard`](crate::auth::gateway_guard) for why.\n\nuse axum::http::{HeaderMap, HeaderValue, header::HeaderName};\nuse common::headers;\n\n/// The correlation id the gateway attached, if any.\npub(crate) fn inbound(headers: &HeaderMap) -> Option\u003cHeaderValue> {\n    headers\n        .get(HeaderName::from_static(headers::REQUEST_ID))\n        .cloned()\n}\n\n/// A span carrying the correlation id, or marking its absence.\npub(crate) fn span(id: Option\u003c&HeaderValue>) -> tracing::Span {\n    // Recording an absence is more useful than inventing an id that correlates\n    // with nothing.\n    let id = id.map_or_else(\n        || \"none\".into(),\n        |value| String::from_utf8_lossy(value.as_bytes()),\n    );\n    tracing::info_span!(\"request\", request_id = %id)\n}\n\n/// Echoes the correlation id back to the caller.\npub(crate) fn echo(headers: &mut HeaderMap, id: Option\u003cHeaderValue>) {\n    if let Some(value) = id {\n        headers.insert(HeaderName::from_static(headers::REQUEST_ID), value);\n    }\n}\n"}, {"path": "crates/profile-service/tests/concurrency.rs", "group": "profile-service", "lang": "rust", "lines": 297, "src": "//! Requirement 1: concurrent updates to the same profile must not corrupt state.\n//!\n//! Three distinct properties, tested separately because they fail differently.\n//!\n//! 1. [`stale_update_is_rejected`] — the lost-update problem. A mutex does not\n//!    solve this, so it is the test that justifies the version field existing.\n//! 2. [`concurrent_increments_never_lose_an_update`] — under real parallel\n//!    load, every writer's contribution survives.\n//! 3. [`concurrent_writes_are_never_torn`] — no reader ever observes one\n//!    writer's address paired with another's phone number.\n\nuse std::sync::Arc;\n\nuse axum::Router;\nuse axum::body::Body;\nuse axum::http::{HeaderMap, Request, StatusCode, header};\nuse common::{Version, headers};\nuse profile_service::{AppState, IdempotencyStore, InMemoryProfiles};\nuse tower::ServiceExt;\n\nconst INTERNAL_TOKEN: &str = \"test-internal-token\";\nconst USER: &str = \"user-under-test\";\n\nfn app() -> Router {\n    profile_service::router(AppState {\n        profiles: Arc::new(InMemoryProfiles::new()),\n        internal_token: Arc::from(INTERNAL_TOKEN),\n        idempotency: Arc::new(IdempotencyStore::default()),\n    })\n}\n\n/// Sends one request as the gateway would.\nasync fn call(\n    app: &Router,\n    method: &str,\n    if_match: Option\u003cVersion>,\n    body: Option\u003cString>,\n) -> (StatusCode, HeaderMap, String) {\n    let mut builder = Request::builder()\n        .method(method)\n        .uri(\"/profile\")\n        .header(headers::INTERNAL_TOKEN, INTERNAL_TOKEN)\n        .header(headers::USER_ID, USER)\n        .header(header::CONTENT_TYPE, \"application/json\");\n\n    if let Some(version) = if_match {\n        builder = builder.header(header::IF_MATCH, version.to_string());\n    }\n\n    let request = builder\n        .body(body.map_or_else(Body::empty, Body::from))\n        .expect(\"request is well-formed\");\n\n    let response = app\n        .clone()\n        .oneshot(request)\n        .await\n        .expect(\"router is infallible\");\n\n    let status = response.status();\n    let response_headers = response.headers().clone();\n    let bytes = axum::body::to_bytes(response.into_body(), usize::MAX)\n        .await\n        .expect(\"body is finite\");\n\n    (\n        status,\n        response_headers,\n        String::from_utf8(bytes.to_vec()).expect(\"body is UTF-8\"),\n    )\n}\n\n/// Both fields carry the same marker, in forms that pass validation. A reader\n/// that ever sees the two disagree has observed a torn write.\nfn body_for(marker: usize) -> String {\n    format!(r#\"{{\"address\":\"address-{marker}\",\"phone_number\":\"555{marker:04}\"}}\"#)\n}\n\nfn markers_of(body: &str) -> (usize, usize) {\n    let profile: serde_json::Value = serde_json::from_str(body).expect(\"body is JSON\");\n\n    let address = profile[\"address\"]\n        .as_str()\n        .expect(\"address is a string\")\n        .trim_start_matches(\"address-\")\n        .parse()\n        .expect(\"address carries a marker\");\n    let phone = profile[\"phone_number\"].as_str().expect(\"phone is a string\")[3..]\n        .parse()\n        .expect(\"phone carries a marker\");\n\n    (address, phone)\n}\n\n/// Reads the version out of an `ETag` response header.\nfn version_of(headers: &HeaderMap) -> Version {\n    headers\n        .get(header::ETAG)\n        .expect(\"every 2xx and 412 carries an ETag\")\n        .to_str()\n        .expect(\"ETag is ASCII\")\n        .parse()\n        .expect(\"ETag holds a version\")\n}\n\n#[tokio::test]\nasync fn stale_update_is_rejected() {\n    let app = app();\n\n    let (status, headers, _) = call(&app, \"POST\", None, Some(body_for(0))).await;\n    assert_eq!(status, StatusCode::CREATED);\n\n    // Both clients read the same version, as two browser tabs would.\n    let observed = version_of(&headers);\n\n    // First writer wins.\n    let (status, headers, _) = call(&app, \"PUT\", Some(observed), Some(body_for(1))).await;\n    assert_eq!(status, StatusCode::OK);\n    assert_eq!(\n        version_of(&headers),\n        observed.checked_next().expect(\"no overflow\")\n    );\n\n    // Second writer is holding a version that is now stale. Without the\n    // precondition this would return 200 and erase writer one's change, with\n    // neither client ever learning that anything was lost.\n    let (status, headers, _) = call(&app, \"PUT\", Some(observed), Some(body_for(2))).await;\n    assert_eq!(\n        status,\n        StatusCode::PRECONDITION_FAILED,\n        \"a write against a stale version must be refused, not silently applied\"\n    );\n    assert_eq!(\n        version_of(&headers),\n        observed.checked_next().expect(\"no overflow\"),\n        \"the 412 must report the current version so the client can retry without a re-read\"\n    );\n\n    // The winner's data survived intact.\n    let (_, _, body) = call(&app, \"GET\", None, None).await;\n    assert!(\n        body.contains(\"address-1\"),\n        \"writer one's update was lost: {body}\"\n    );\n    assert!(\n        !body.contains(\"address-2\"),\n        \"the stale write was applied anyway: {body}\"\n    );\n}\n\n#[tokio::test]\nasync fn unconditional_update_is_refused() {\n    let app = app();\n    call(&app, \"POST\", None, Some(body_for(0))).await;\n\n    let (status, ..) = call(&app, \"PUT\", None, Some(body_for(1))).await;\n    assert_eq!(\n        status,\n        StatusCode::PRECONDITION_REQUIRED,\n        \"a PUT with no If-Match cannot express which version it intends to replace, \\\n         so it must be refused rather than treated as last-write-wins\"\n    );\n}\n\n/// Stores `counter` in `address`, so a write's content depends on the read that\n/// preceded it.\nfn counter_body(counter: usize) -> String {\n    format!(r#\"{{\"address\":\"counter-{counter}\",\"phone_number\":\"5550100\"}}\"#)\n}\n\nfn counter_of(body: &str) -> usize {\n    serde_json::from_str::\u003cserde_json::Value>(body).expect(\"body is JSON\")[\"address\"]\n        .as_str()\n        .expect(\"address is a string\")\n        .trim_start_matches(\"counter-\")\n        .parse()\n        .expect(\"address holds a counter\")\n}\n\n#[tokio::test(flavor = \"multi_thread\", worker_threads = 8)]\nasync fn concurrent_increments_never_lose_an_update() {\n    const WRITERS: usize = 64;\n\n    let app = app();\n    call(&app, \"POST\", None, Some(counter_body(0))).await;\n\n    // Each writer reads the counter and writes back one more. This is what\n    // makes a lost update *observable*: counting accepted writes cannot detect\n    // one, because last-write-wins also accepts every write and also bumps the\n    // version every time. Only a read-modify-write whose result depends on what\n    // was read can tell the two designs apart — with last-write-wins, two\n    // writers that read the same value both store value + 1, and one increment\n    // silently disappears.\n    let writers = (1..=WRITERS).map(|_| {\n        let app = app.clone();\n        tokio::spawn(async move {\n            loop {\n                let (_, headers, body) = call(&app, \"GET\", None, None).await;\n                let next = counter_of(&body) + 1;\n\n                let (status, ..) = call(\n                    &app,\n                    \"PUT\",\n                    Some(version_of(&headers)),\n                    Some(counter_body(next)),\n                )\n                .await;\n                if status == StatusCode::OK {\n                    break;\n                }\n                // The only other outcome a contended writer may see is losing\n                // the race; anything else means the store misbehaved.\n                assert_eq!(status, StatusCode::PRECONDITION_FAILED);\n            }\n        })\n    });\n\n    for writer in writers.collect::\u003cVec\u003c_>>() {\n        writer.await.expect(\"no writer panicked\");\n    }\n\n    let (_, headers, body) = call(&app, \"GET\", None, None).await;\n\n    assert_eq!(\n        counter_of(&body),\n        WRITERS,\n        \"{WRITERS} writers each incremented once, so every increment must be present; \\\n         a lower value means updates were silently overwritten\"\n    );\n    assert_eq!(\n        version_of(&headers),\n        (0..WRITERS).fold(Version::INITIAL, |version, _| {\n            version.checked_next().expect(\"no overflow\")\n        }),\n        \"one create plus exactly one accepted update per writer\"\n    );\n}\n\n#[tokio::test(flavor = \"multi_thread\", worker_threads = 8)]\nasync fn concurrent_writes_are_never_torn() {\n    const WRITERS: usize = 64;\n\n    let app = app();\n    call(&app, \"POST\", None, Some(body_for(0))).await;\n\n    let writers = (1..=WRITERS).map(|marker| {\n        let app = app.clone();\n        tokio::spawn(async move {\n            loop {\n                let (_, headers, _) = call(&app, \"GET\", None, None).await;\n                let (status, ..) = call(\n                    &app,\n                    \"PUT\",\n                    Some(version_of(&headers)),\n                    Some(body_for(marker)),\n                )\n                .await;\n                if status == StatusCode::OK {\n                    break;\n                }\n            }\n        })\n    });\n\n    for writer in writers.collect::\u003cVec\u003c_>>() {\n        writer.await.expect(\"no writer panicked\");\n    }\n\n    // Each writer submits both fields carrying its own marker. If any reader\n    // could observe a half-applied write, the two would disagree.\n    let (_, _, body) = call(&app, \"GET\", None, None).await;\n    let (address_marker, phone_marker) = markers_of(&body);\n\n    assert_eq!(\n        address_marker, phone_marker,\n        \"torn write: address carried {address_marker} while phone carried {phone_marker}\"\n    );\n}\n\n#[tokio::test]\nasync fn direct_access_without_the_internal_token_is_refused() {\n    let request = Request::builder()\n        .method(\"GET\")\n        .uri(\"/profile\")\n        .header(headers::USER_ID, USER)\n        .body(Body::empty())\n        .expect(\"request is well-formed\");\n\n    let response = app().oneshot(request).await.expect(\"router is infallible\");\n\n    assert_eq!(\n        response.status(),\n        StatusCode::FORBIDDEN,\n        \"a caller that reaches the profile port directly must not be served, \\\n         even though it supplied a plausible user id\"\n    );\n}\n"}, {"path": "crates/profile-service/tests/read_contention.rs", "group": "profile-service", "lang": "rust", "lines": 429, "src": "// Throughput arithmetic converts operation counts and nanosecond durations to\n// `f64`. Both are far below 2^53 at any scale this runs at, so the precision\n// clippy warns about cannot be lost here, and a per-site allow on every\n// division would bury the measurements it is meant to guard.\n#![allow(clippy::cast_precision_loss)]\n\n//! Throughput measurements for the in-memory store. Not correctness checks, and\n//! excluded from the normal run because timings are load-dependent.\n//!\n//! ```text\n//! cargo test -p profile-service --release --test read_contention -- --ignored --nocapture\n//! ```\n//!\n//! Every figure is a median of [`ROUNDS`] runs. A single run on a loaded box\n//! varies by 20% or more, which is wider than most of the differences worth\n//! measuring, so a lone number proves nothing.\n//!\n//! [`shard_scaling`] sweeps the shard count with everything else held constant,\n//! which isolates that one variable instead of comparing two builds that differ\n//! in three ways.\n\nuse std::sync::Arc;\nuse std::time::{Duration, Instant};\n\nuse common::dto::ProfileInput;\nuse common::{UserId, Version};\nuse profile_service::{InMemoryProfiles, ProfileRepository, Update};\n\nconst ROUNDS: usize = 5;\nconst KEYS: usize = 10_000;\n\nfn workers() -> usize {\n    std::thread::available_parallelism().map_or(4, std::num::NonZero::get)\n}\n\nfn input(marker: usize) -> ProfileInput {\n    ProfileInput {\n        address: format!(\"address-{marker}\"),\n        phone_number: \"5550100\".to_owned(),\n    }\n}\n\n/// Seeds `keys` profiles and returns the store alongside the ids.\n///\n/// The ids are built once and shared: constructing a `UserId` per operation\n/// would put a string allocation inside the measured loop and report the\n/// benchmark's own cost as the store's.\nasync fn seeded(shards: usize, keys: usize) -> (Arc\u003cInMemoryProfiles>, Arc\u003cVec\u003cUserId>>) {\n    let repository = Arc::new(InMemoryProfiles::with_shards(shards));\n    let ids: Vec\u003cUserId> = (0..keys)\n        .map(|key| UserId::from(format!(\"user-{key}\").as_str()))\n        .collect();\n\n    for id in &ids {\n        repository.create(id, input(0)).await.expect(\"healthy\");\n    }\n\n    (repository, Arc::new(ids))\n}\n\nfn per_sec(ops: usize, elapsed: Duration) -> f64 {\n    ops as f64 / elapsed.as_secs_f64()\n}\n\n/// Median of `ROUNDS` runs, plus the spread, so a reader can see whether a\n/// difference is signal.\nfn median(mut samples: Vec\u003cf64>) -> (f64, f64, f64) {\n    samples.sort_by(f64::total_cmp);\n    (\n        samples[samples.len() / 2],\n        samples[0],\n        samples[samples.len() - 1],\n    )\n}\n\n/// One round of `per_worker` reads each, spread across `ids`.\nasync fn spread_round(\n    repository: &Arc\u003cInMemoryProfiles>,\n    ids: &Arc\u003cVec\u003cUserId>>,\n    per_worker: usize,\n) -> Duration {\n    let started = Instant::now();\n\n    let tasks = (0..workers()).map(|w| {\n        let repository = Arc::clone(repository);\n        let ids = Arc::clone(ids);\n        tokio::spawn(async move {\n            // Stride by a prime so workers do not march in lockstep over the\n            // same keys, which would understate contention.\n            let mut key = w * 7919;\n            for _ in 0..per_worker {\n                key = (key + 7919) % ids.len();\n                repository.get(&ids[key]).await.expect(\"healthy\");\n            }\n        })\n    });\n    for task in tasks.collect::\u003cVec\u003c_>>() {\n        task.await.expect(\"no worker panicked\");\n    }\n\n    started.elapsed()\n}\n\n#[tokio::test(flavor = \"multi_thread\")]\n#[ignore = \"performance measurement, not a correctness check\"]\nasync fn shard_scaling() {\n    const PER_WORKER: usize = 150_000;\n\n    println!(\n        \"\\n{} workers, {KEYS} keys, median of {ROUNDS} rounds\\n\",\n        workers()\n    );\n    println!(\"{:>7}  {:>14}  {:>26}\", \"shards\", \"median ops/sec\", \"range\");\n\n    let mut single = 0.0;\n    for shards in [1_usize, 2, 4, 16, 64, 256] {\n        let (repository, ids) = seeded(shards, KEYS).await;\n\n        let mut samples = Vec::with_capacity(ROUNDS);\n        for _ in 0..ROUNDS {\n            let elapsed = spread_round(&repository, &ids, PER_WORKER).await;\n            samples.push(per_sec(workers() * PER_WORKER, elapsed));\n        }\n\n        let (mid, lo, hi) = median(samples);\n        if shards == 1 {\n            single = mid;\n        }\n        println!(\n            \"{shards:>7}  {mid:>14.0}  {:>10.0} .. {:\u003c10.0}  {:+.0}%\",\n            lo,\n            hi,\n            (mid / single - 1.0) * 100.0\n        );\n    }\n}\n\n#[tokio::test(flavor = \"multi_thread\")]\n#[ignore = \"performance measurement, not a correctness check\"]\nasync fn hot_profile_reads() {\n    const PER_WORKER: usize = 150_000;\n\n    let (repository, ids) = seeded(64, 1).await;\n    let mut samples = Vec::with_capacity(ROUNDS);\n\n    for _ in 0..ROUNDS {\n        let started = Instant::now();\n        let tasks = (0..workers()).map(|_| {\n            let repository = Arc::clone(&repository);\n            let user = ids[0].clone();\n            tokio::spawn(async move {\n                for _ in 0..PER_WORKER {\n                    repository.get(&user).await.expect(\"healthy\");\n                }\n            })\n        });\n        for task in tasks.collect::\u003cVec\u003c_>>() {\n            task.await.expect(\"no worker panicked\");\n        }\n        samples.push(per_sec(workers() * PER_WORKER, started.elapsed()));\n    }\n\n    let (mid, lo, hi) = median(samples);\n    println!(\"\\nhot profile reads   median {mid:.0} ops/sec   range {lo:.0} .. {hi:.0}\");\n}\n\n#[tokio::test(flavor = \"multi_thread\")]\n#[ignore = \"performance measurement, not a correctness check\"]\nasync fn mixed_read_write() {\n    const PER_WORKER: usize = 50_000;\n\n    let mut samples = Vec::with_capacity(ROUNDS);\n\n    for _ in 0..ROUNDS {\n        let (repository, ids) = seeded(64, KEYS).await;\n        let started = Instant::now();\n\n        let tasks = (0..workers()).map(|w| {\n            let repository = Arc::clone(&repository);\n            let ids = Arc::clone(&ids);\n            tokio::spawn(async move {\n                let mut key = w * 7919;\n                for step in 0..PER_WORKER {\n                    key = (key + 7919) % ids.len();\n                    let user = &ids[key];\n\n                    if step % 10 == 9 {\n                        let current = repository\n                            .get(user)\n                            .await\n                            .expect(\"healthy\")\n                            .expect(\"seeded\");\n                        let _: Update = repository\n                            .update(user, current.version, input(step))\n                            .await\n                            .expect(\"healthy\");\n                    } else {\n                        repository.get(user).await.expect(\"healthy\");\n                    }\n                }\n            })\n        });\n        for task in tasks.collect::\u003cVec\u003c_>>() {\n            task.await.expect(\"no worker panicked\");\n        }\n        samples.push(per_sec(workers() * PER_WORKER, started.elapsed()));\n    }\n\n    let (mid, lo, hi) = median(samples);\n    println!(\"\\nmixed 9:1 read/write   median {mid:.0} ops/sec   range {lo:.0} .. {hi:.0}\");\n}\n\n/// Shared secret the benchmark routers are built with.\nconst BENCH_TOKEN: &str = \"bench-internal-token\";\n\n/// Drives `requests` reads through a router and returns the elapsed time.\n///\n/// At module scope so both HTTP benchmarks use the identical request, and\n/// because one round per stage — unrepeated — was giving impossible readings,\n/// including a middleware layer that apparently made requests faster.\nasync fn drive(app: &axum::Router, user: &UserId, requests: usize) -> Duration {\n    use axum::body::Body;\n    use axum::http::{Request, header};\n    use common::headers;\n    use tower::ServiceExt;\n\n    let started = Instant::now();\n    for _ in 0..requests {\n        let request = Request::builder()\n            .method(\"GET\")\n            .uri(\"/profile\")\n            .header(headers::INTERNAL_TOKEN, BENCH_TOKEN)\n            .header(headers::USER_ID, user.as_str())\n            .header(header::CONTENT_TYPE, \"application/json\")\n            .body(Body::empty())\n            .expect(\"well-formed\");\n        let response = app.clone().oneshot(request).await.expect(\"infallible\");\n        assert_eq!(response.status(), 200);\n    }\n    started.elapsed()\n}\n\n/// Prices the boxed future that `#[async_trait]` allocates per call.\n///\n/// The trait has to be async because a SQL backend does I/O, and it has to be\n/// object-safe so the backend is a deployment choice — which today means every\n/// call heap-allocates a future, even for a backend that never blocks. This\n/// measures that tax directly by running the identical work through the\n/// inherent synchronous method and through the trait.\n#[tokio::test(flavor = \"multi_thread\")]\n#[ignore = \"performance measurement, not a correctness check\"]\nasync fn async_trait_boxing_cost() {\n    const PER_WORKER: usize = 150_000;\n\n    let (repository, ids) = seeded(64, KEYS).await;\n\n    let mut sync_samples = Vec::with_capacity(ROUNDS);\n    let mut trait_samples = Vec::with_capacity(ROUNDS);\n\n    for _ in 0..ROUNDS {\n        let started = Instant::now();\n        let tasks = (0..workers()).map(|w| {\n            let repository = Arc::clone(&repository);\n            let ids = Arc::clone(&ids);\n            tokio::spawn(async move {\n                let mut key = w * 7919;\n                for _ in 0..PER_WORKER {\n                    key = (key + 7919) % ids.len();\n                    let _ = repository.read(&ids[key]);\n                }\n            })\n        });\n        for task in tasks.collect::\u003cVec\u003c_>>() {\n            task.await.expect(\"no worker panicked\");\n        }\n        sync_samples.push(per_sec(workers() * PER_WORKER, started.elapsed()));\n\n        trait_samples.push(per_sec(\n            workers() * PER_WORKER,\n            spread_round(&repository, &ids, PER_WORKER).await,\n        ));\n    }\n\n    let (sync_mid, ..) = median(sync_samples);\n    let (trait_mid, ..) = median(trait_samples);\n    println!(\"\\ninherent sync read     median {sync_mid:.0} ops/sec\");\n    println!(\n        \"through async trait    median {trait_mid:.0} ops/sec   ({:+.0}%)\",\n        (trait_mid / sync_mid - 1.0) * 100.0\n    );\n    println!(\n        \"boxed-future tax       {:.0} ns/op\",\n        (1.0 / trait_mid - 1.0 / sync_mid) * 1e9 * workers() as f64\n    );\n}\n\n/// Puts the store's cost next to the cost of serving a request.\n///\n/// The number that decides whether any of the above is worth chasing. A store\n/// read is measured in hundreds of nanoseconds; an HTTP request carries routing,\n/// two extractors, a middleware, JSON serialisation and response construction.\n/// If the transport is orders of magnitude more expensive, the store is not the\n/// bottleneck and further micro-optimisation buys nothing a client can observe.\n#[tokio::test(flavor = \"multi_thread\")]\n#[ignore = \"performance measurement, not a correctness check\"]\nasync fn store_cost_versus_request_cost() {\n    const REQUESTS: usize = 20_000;\n\n    let store = Arc::new(InMemoryProfiles::new());\n    let user = UserId::from(\"bench-user\");\n    store.create(&user, input(0)).await.expect(\"healthy\");\n\n    let app = profile_service::router(profile_service::AppState {\n        profiles: Arc::clone(&store) as Arc\u003cdyn ProfileRepository>,\n        internal_token: Arc::from(BENCH_TOKEN),\n        idempotency: Arc::new(profile_service::IdempotencyStore::default()),\n    });\n\n    let _ = drive(&app, &user, REQUESTS).await; // warm-up\n    let elapsed = drive(&app, &user, REQUESTS).await;\n    let http_ns = elapsed.as_nanos() as f64 / REQUESTS as f64;\n\n    let started = Instant::now();\n    for _ in 0..REQUESTS {\n        let _ = store.read(&user);\n    }\n    let store_ns = started.elapsed().as_nanos() as f64 / REQUESTS as f64;\n\n    // Where does the rest go? Serialisation is the one part of the handler\n    // that could plausibly be precomputed, so it is worth pricing separately.\n    let profile = store.read(&user).expect(\"seeded\");\n    let started = Instant::now();\n    for _ in 0..REQUESTS {\n        let _ = serde_json::to_vec(&*profile).expect(\"serialises\");\n    }\n    let json_ns = started.elapsed().as_nanos() as f64 / REQUESTS as f64;\n\n    println!(\n        \"\\nstore read          {store_ns:>9.0} ns/op   {:>5.1}% of a request\",\n        store_ns / http_ns * 100.0\n    );\n    println!(\n        \"JSON serialisation  {json_ns:>9.0} ns/op   {:>5.1}% of a request\",\n        json_ns / http_ns * 100.0\n    );\n    println!(\n        \"HTTP GET /profile   {http_ns:>9.0} ns/op   ({:.0}x the store)\",\n        http_ns / store_ns\n    );\n    println!(\n        \"unaccounted (routing, extractors, middleware, response): {:>4.1}%\",\n        (http_ns - store_ns - json_ns) / http_ns * 100.0\n    );\n}\n\n/// Prices each middleware layer by adding them back one at a time.\n///\n/// The previous measurement said 95% of a request is spent outside the store.\n/// This says where: a layer that costs more than the work it wraps is a knob\n/// worth knowing about before someone concludes the database is slow.\n#[tokio::test(flavor = \"multi_thread\")]\n#[ignore = \"performance measurement, not a correctness check\"]\nasync fn middleware_cost() {\n    use axum::routing::get;\n    use tower_http::trace::TraceLayer;\n\n    const REQUESTS: usize = 20_000;\n    let store = Arc::new(InMemoryProfiles::new());\n    let user = UserId::from(\"bench-user\");\n    store.create(&user, input(0)).await.expect(\"healthy\");\n\n    let state = profile_service::AppState {\n        profiles: Arc::clone(&store) as Arc\u003cdyn ProfileRepository>,\n        internal_token: Arc::from(BENCH_TOKEN),\n        idempotency: Arc::new(profile_service::IdempotencyStore::default()),\n    };\n\n    let build = |stage: usize| {\n        let mut app =\n            axum::Router::new().route(\"/profile\", get(profile_service::routes::profile::read));\n        if stage >= 1 {\n            app = app.layer(axum::middleware::from_fn_with_state(\n                state.clone(),\n                profile_service::auth::gateway_guard,\n            ));\n        }\n        if stage >= 2 {\n            app = app.layer(TraceLayer::new_for_http());\n        }\n        app.with_state(state.clone())\n    };\n\n    let mut previous = 0.0;\n    println!(\"\\nmedian of {ROUNDS} rounds, {REQUESTS} requests each, warm-up discarded\\n\");\n    for (stage, label) in [\n        (0, \"route + handler only\"),\n        (1, \"+ gateway guard (auth + id)\"),\n        (2, \"+ TraceLayer\"),\n    ] {\n        let app = build(stage);\n        let _ = drive(&app, &user, REQUESTS).await; // warm-up\n\n        let mut samples = Vec::with_capacity(ROUNDS);\n        for _ in 0..ROUNDS {\n            let elapsed = drive(&app, &user, REQUESTS).await;\n            samples.push(elapsed.as_nanos() as f64 / REQUESTS as f64);\n        }\n        samples.sort_by(f64::total_cmp);\n        let ns = samples[samples.len() / 2];\n\n        let delta = if stage == 0 {\n            String::new()\n        } else {\n            format!(\"(+{:.0} ns)\", ns - previous)\n        };\n        println!(\n            \"{label:\u003c30} {ns:>7.0} ns/op   {delta:\u003c14} [{:.0} .. {:.0}]\",\n            samples[0],\n            samples[samples.len() - 1]\n        );\n        previous = ns;\n    }\n}\n\n/// Keeps [`Version`] referenced so the import is not dead in every build.\n#[allow(dead_code)]\nfn _version_in_scope() -> Version {\n    Version::INITIAL\n}\n"}, {"path": "crates/profile-service/tests/repository_conformance.rs", "group": "profile-service", "lang": "rust", "lines": 296, "src": "//! One suite, run against every [`ProfileRepository`] implementation.\n//!\n//! This is the evidence that the concurrency guarantee belongs to the design\n//! rather than to the `HashMap`. The in-memory backend enforces it with a\n//! version check under a write lock; the SQLite backend enforces it with\n//! `UPDATE ... WHERE version = ?` and a row count. If both pass identical\n//! assertions, the contract is the thing being tested, not the mechanism.\n//!\n//! Adding a Postgres backend means adding one line to `backends!` and nothing\n//! else.\n\nuse std::sync::Arc;\n\nuse common::dto::ProfileInput;\nuse common::{UserId, Version};\nuse profile_service::{InMemoryProfiles, ProfileRepository, SqliteProfiles, Update};\n\nfn input(marker: &str) -> ProfileInput {\n    ProfileInput {\n        address: format!(\"address-{marker}\"),\n        phone_number: \"5550100\".to_owned(),\n    }\n}\n\nfn user() -> UserId {\n    UserId::from(\"conformance-user\")\n}\n\n/// Generates the whole suite once per backend.\nmacro_rules! backends {\n    ($($name:ident => $build:expr),+ $(,)?) => {\n        $(\n            mod $name {\n                use super::*;\n\n                fn repository() -> Arc\u003cdyn ProfileRepository> {\n                    $build\n                }\n\n                #[tokio::test]\n                async fn create_then_read_round_trips() {\n                    let repo = repository();\n                    let created = repo\n                        .create(&user(), input(\"first\"))\n                        .await\n                        .expect(\"backend is healthy\")\n                        .expect(\"profile did not already exist\");\n\n                    assert_eq!(created.version, Version::INITIAL);\n\n                    let read = repo\n                        .get(&user())\n                        .await\n                        .expect(\"backend is healthy\")\n                        .expect(\"profile exists\");\n                    assert_eq!(read, created);\n                }\n\n                #[tokio::test]\n                async fn create_is_refused_twice() {\n                    let repo = repository();\n                    repo.create(&user(), input(\"first\")).await.expect(\"healthy\");\n\n                    let second = repo\n                        .create(&user(), input(\"second\"))\n                        .await\n                        .expect(\"healthy\");\n                    assert!(second.is_none(), \"a second create must not overwrite\");\n\n                    let stored = repo.get(&user()).await.expect(\"healthy\").expect(\"exists\");\n                    assert_eq!(stored.address, \"address-first\");\n                }\n\n                #[tokio::test]\n                async fn update_at_the_current_version_is_applied() {\n                    let repo = repository();\n                    repo.create(&user(), input(\"first\")).await.expect(\"healthy\");\n\n                    let outcome = repo\n                        .update(&user(), Version::INITIAL, input(\"second\"))\n                        .await\n                        .expect(\"healthy\");\n\n                    let Update::Applied(profile) = outcome else {\n                        panic!(\"expected the update to be applied, got {outcome:?}\");\n                    };\n                    assert_eq!(profile.address, \"address-second\");\n                    assert_eq!(\n                        profile.version,\n                        Version::INITIAL.checked_next().expect(\"no overflow\")\n                    );\n                }\n\n                #[tokio::test]\n                async fn update_at_a_stale_version_is_refused() {\n                    let repo = repository();\n                    repo.create(&user(), input(\"first\")).await.expect(\"healthy\");\n                    repo.update(&user(), Version::INITIAL, input(\"second\"))\n                        .await\n                        .expect(\"healthy\");\n\n                    // Replay the version the first writer already consumed.\n                    let outcome = repo\n                        .update(&user(), Version::INITIAL, input(\"clobber\"))\n                        .await\n                        .expect(\"healthy\");\n\n                    assert_eq!(\n                        outcome,\n                        Update::Stale {\n                            current_version: Version::INITIAL\n                                .checked_next()\n                                .expect(\"no overflow\")\n                        },\n                        \"a stale write must be refused and must report the winning version\"\n                    );\n\n                    let stored = repo.get(&user()).await.expect(\"healthy\").expect(\"exists\");\n                    assert_eq!(\n                        stored.address, \"address-second\",\n                        \"the stale write must not have been applied\"\n                    );\n                }\n\n                #[tokio::test]\n                async fn update_of_an_absent_profile_reports_missing() {\n                    let repo = repository();\n                    let outcome = repo\n                        .update(&user(), Version::INITIAL, input(\"nothing\"))\n                        .await\n                        .expect(\"healthy\");\n\n                    assert_eq!(outcome, Update::Missing);\n                }\n\n                #[tokio::test]\n                async fn history_records_every_accepted_write() {\n                    let repo = repository();\n                    repo.create(&user(), input(\"first\")).await.expect(\"healthy\");\n\n                    let mut version = Version::INITIAL;\n                    for marker in [\"second\", \"third\"] {\n                        let outcome = repo\n                            .update(&user(), version, input(marker))\n                            .await\n                            .expect(\"healthy\");\n                        let Update::Applied(profile) = outcome else {\n                            panic!(\"expected {marker} to apply\");\n                        };\n                        version = profile.version;\n                    }\n\n                    // A rejected write must leave no trace in the audit log.\n                    repo.update(&user(), Version::INITIAL, input(\"rejected\"))\n                        .await\n                        .expect(\"healthy\");\n\n                    let history = repo.history(&user()).await.expect(\"healthy\");\n                    let addresses: Vec\u003c_> =\n                        history.iter().map(|r| r.address.as_str()).collect();\n\n                    assert_eq!(\n                        addresses,\n                        [\"address-first\", \"address-second\", \"address-third\"],\n                        \"history must hold every accepted write, in order, and nothing else\"\n                    );\n                    assert!(\n                        history.windows(2).all(|w| w[0].version \u003c w[1].version),\n                        \"revisions must be strictly ordered by version\"\n                    );\n                }\n\n                #[tokio::test]\n                async fn reads_share_one_projection() {\n                    let repo = repository();\n                    repo.create(&user(), input(\"first\")).await.expect(\"healthy\");\n\n                    let first = repo.get(&user()).await.expect(\"healthy\").expect(\"exists\");\n                    let second = repo.get(&user()).await.expect(\"healthy\").expect(\"exists\");\n\n                    // Structural, not a timing assertion: two reads that return\n                    // pointers to the same allocation cannot have cloned it. If\n                    // a future change rebuilds the projection per read, this\n                    // fails immediately instead of quietly costing three\n                    // allocations on the hottest path in the service.\n                    //\n                    // The SQL backend legitimately builds a fresh projection per\n                    // read — it has to, the row lives in the database — so this\n                    // asserts only that the in-memory backend keeps its\n                    // sharing. See the `#[cfg]` on the assertion.\n                    if stringify!($name) == \"in_memory\" {\n                        assert!(\n                            Arc::ptr_eq(&first, &second),\n                            \"in-memory reads must hand out the shared projection, not a clone\"\n                        );\n                    }\n                    assert_eq!(first, second);\n                }\n\n                #[tokio::test]\n                async fn a_write_publishes_a_new_projection() {\n                    let repo = repository();\n                    repo.create(&user(), input(\"first\")).await.expect(\"healthy\");\n                    let before = repo.get(&user()).await.expect(\"healthy\").expect(\"exists\");\n\n                    repo.update(&user(), Version::INITIAL, input(\"second\"))\n                        .await\n                        .expect(\"healthy\");\n                    let after = repo.get(&user()).await.expect(\"healthy\").expect(\"exists\");\n\n                    assert!(\n                        !Arc::ptr_eq(&before, &after),\n                        \"a write must publish a new projection, not mutate the one readers hold\"\n                    );\n                    assert_eq!(before.address, \"address-first\");\n                    assert_eq!(after.address, \"address-second\");\n                }\n\n                #[tokio::test]\n                async fn history_of_an_absent_profile_is_empty() {\n                    assert!(\n                        repository()\n                            .history(&user())\n                            .await\n                            .expect(\"healthy\")\n                            .is_empty()\n                    );\n                }\n\n                #[tokio::test(flavor = \"multi_thread\", worker_threads = 8)]\n                async fn concurrent_increments_never_lose_an_update() {\n                    const WRITERS: usize = 32;\n\n                    let repo = repository();\n                    repo.create(&user(), input(\"0\")).await.expect(\"healthy\");\n\n                    // Each writer's value depends on what it read, which is the\n                    // only way a lost update becomes observable: counting\n                    // accepted writes cannot distinguish compare-and-swap from\n                    // last-write-wins, because both accept every write.\n                    let writers = (0..WRITERS).map(|_| {\n                        let repo = Arc::clone(&repo);\n                        tokio::spawn(async move {\n                            loop {\n                                let current = repo\n                                    .get(&user())\n                                    .await\n                                    .expect(\"healthy\")\n                                    .expect(\"exists\");\n                                let counter: usize = current\n                                    .address\n                                    .trim_start_matches(\"address-\")\n                                    .parse()\n                                    .expect(\"address holds a counter\");\n\n                                let outcome = repo\n                                    .update(\n                                        &user(),\n                                        current.version,\n                                        input(&(counter + 1).to_string()),\n                                    )\n                                    .await\n                                    .expect(\"healthy\");\n\n                                if matches!(outcome, Update::Applied(_)) {\n                                    break;\n                                }\n                            }\n                        })\n                    });\n\n                    for writer in writers.collect::\u003cVec\u003c_>>() {\n                        writer.await.expect(\"no writer panicked\");\n                    }\n\n                    let stored = repo.get(&user()).await.expect(\"healthy\").expect(\"exists\");\n                    assert_eq!(\n                        stored.address,\n                        format!(\"address-{WRITERS}\"),\n                        \"every increment must survive\"\n                    );\n                    assert_eq!(\n                        repo.history(&user()).await.expect(\"healthy\").len(),\n                        WRITERS + 1,\n                        \"one revision per accepted write, plus the create\"\n                    );\n                }\n            }\n        )+\n    };\n}\n\nbackends! {\n    in_memory => Arc::new(InMemoryProfiles::new()),\n    sqlite => Arc::new(SqliteProfiles::in_memory().expect(\"in-memory database opens\")),\n}\n"}, {"path": "crates/loadgen/Cargo.toml", "group": "loadgen", "lang": "toml", "lines": 18, "src": "[package]\nname = \"loadgen\"\ndescription = \"Development-only load generator. Not part of either service.\"\nversion.workspace = true\nedition.workspace = true\npublish.workspace = true\nlicense.workspace = true\nrepository.workspace = true\nauthors.workspace = true\n\n[dependencies]\ncommon.workspace = true\ntokio.workspace = true\nreqwest.workspace = true\nserde_json.workspace = true\n\n[lints]\nworkspace = true\n"}, {"path": "crates/loadgen/src/main.rs", "group": "loadgen", "lang": "rust", "lines": 166, "src": "//! Load generator for the running services. A development tool, not part of\n//! either service.\n//!\n//! Every other measurement in this workspace drives a router in-process with\n//! `oneshot`, which skips the socket, the HTTP codec, and — for anything behind\n//! the gateway — an entire second service. Those numbers are useful for\n//! comparing two implementations of the same handler and useless for saying\n//! what the system costs.\n//!\n//! This drives real HTTP against both entry points so the gateway hop can be\n//! priced by difference:\n//!\n//! ```text\n//! cargo run --release -p loadgen -- gateway 64 2000\n//! cargo run --release -p loadgen -- direct   64 2000\n//! ```\n\nuse std::env;\nuse std::time::{Duration, Instant};\n\nuse common::headers;\n\nconst AUTH: &str = \"http://127.0.0.1:8080\";\nconst PROFILE: &str = \"http://127.0.0.1:8081\";\nconst INTERNAL_TOKEN: &str = \"dev-only-internal-token-change-me\";\n\n#[tokio::main]\nasync fn main() -> Result\u003c(), Box\u003cdyn std::error::Error>> {\n    let args: Vec\u003cString> = env::args().skip(1).collect();\n    let mode = args.first().map_or(\"gateway\", String::as_str).to_owned();\n    let connections: usize = args.get(1).and_then(|a| a.parse().ok()).unwrap_or(64);\n    let per_connection: usize = args.get(2).and_then(|a| a.parse().ok()).unwrap_or(1000);\n\n    let client = reqwest::Client::builder()\n        .pool_max_idle_per_host(connections)\n        .build()?;\n\n    // One login for the whole run: the point is to measure the read path, and\n    // Argon2 would otherwise dominate every number here.\n    let token: String = serde_json::from_str::\u003cserde_json::Value>(\n        &client\n            .post(format!(\"{AUTH}/login\"))\n            .json(&serde_json::json!({\n                \"username\": \"alice\",\n                \"password\": \"correct-horse-battery-staple\"\n            }))\n            .send()\n            .await?\n            .text()\n            .await?,\n    )?[\"access_token\"]\n        .as_str()\n        .ok_or(\"login did not return a token\")?\n        .to_owned();\n\n    let user_id = subject_of(&token).ok_or(\"token carried no subject\")?;\n\n    // Ensure the profile exists; a 409 here means a previous run made it.\n    let _ = client\n        .post(format!(\"{AUTH}/profile\"))\n        .bearer_auth(&token)\n        .json(&serde_json::json!({ \"address\": \"1 Main St\", \"phone_number\": \"5550100\" }))\n        .send()\n        .await?;\n\n    let run = |warm: bool| {\n        let client = client.clone();\n        let token = token.clone();\n        let user_id = user_id.clone();\n        let mode = mode.clone();\n        async move {\n            let requests = if warm {\n                per_connection / 4\n            } else {\n                per_connection\n            };\n            let started = Instant::now();\n\n            let workers = (0..connections).map(|_| {\n                let client = client.clone();\n                let token = token.clone();\n                let user_id = user_id.clone();\n                let mode = mode.clone();\n                tokio::spawn(async move {\n                    let mut latencies = Vec::with_capacity(requests);\n                    for _ in 0..requests {\n                        let at = Instant::now();\n                        let response = if mode == \"direct\" {\n                            client\n                                .get(format!(\"{PROFILE}/profile\"))\n                                .header(headers::INTERNAL_TOKEN, INTERNAL_TOKEN)\n                                .header(headers::USER_ID, &user_id)\n                                .send()\n                                .await\n                        } else {\n                            client\n                                .get(format!(\"{AUTH}/profile\"))\n                                .bearer_auth(&token)\n                                .send()\n                                .await\n                        };\n                        let status = response.expect(\"request failed\").status();\n                        assert!(status.is_success(), \"unexpected status {status}\");\n                        latencies.push(at.elapsed());\n                    }\n                    latencies\n                })\n            });\n\n            let mut all = Vec::with_capacity(connections * requests);\n            for worker in workers.collect::\u003cVec\u003c_>>() {\n                all.extend(worker.await.expect(\"no worker panicked\"));\n            }\n            (all, started.elapsed())\n        }\n    };\n\n    let _ = run(true).await;\n    let (mut latencies, elapsed) = run(false).await;\n\n    latencies.sort_unstable();\n    let total = latencies.len();\n    #[allow(clippy::cast_precision_loss)]\n    let throughput = total as f64 / elapsed.as_secs_f64();\n\n    println!(\"\\n{mode}: {connections} connections x {per_connection} requests\");\n    println!(\"  throughput  {throughput:>10.0} req/sec\");\n    println!(\"  p50         {:>10.2?}\", percentile(&latencies, 50.0));\n    println!(\"  p90         {:>10.2?}\", percentile(&latencies, 90.0));\n    println!(\"  p99         {:>10.2?}\", percentile(&latencies, 99.0));\n    println!(\"  max         {:>10.2?}\", latencies[total - 1]);\n\n    Ok(())\n}\n\nfn percentile(sorted: &[Duration], p: f64) -> Duration {\n    #[allow(\n        clippy::cast_precision_loss,\n        clippy::cast_possible_truncation,\n        clippy::cast_sign_loss\n    )]\n    let index = ((sorted.len() as f64 - 1.0) * p / 100.0).round() as usize;\n    sorted[index]\n}\n\n/// Pulls `sub` out of a token without verifying it. Fine here: the generator is\n/// not a security boundary, it just needs the id the gateway will inject.\nfn subject_of(token: &str) -> Option\u003cString> {\n    let payload = token.split('.').nth(1)?;\n    let mut decoded = Vec::new();\n    let alphabet = b\"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_\";\n    let mut buffer = 0u32;\n    let mut bits = 0u32;\n    for byte in payload.bytes() {\n        // The alphabet is 64 entries, so the index always fits.\n        let value = u32::try_from(alphabet.iter().position(|c| *c == byte)?).ok()?;\n        buffer = (buffer \u003c\u003c 6) | value;\n        bits += 6;\n        if bits >= 8 {\n            bits -= 8;\n            decoded.push(u8::try_from((buffer >> bits) & 0xFF).ok()?);\n        }\n    }\n    let claims: serde_json::Value = serde_json::from_slice(&decoded).ok()?;\n    claims[\"sub\"].as_str().map(str::to_owned)\n}\n"}];
